<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaidTrainOverlay — Configurator (redesign prototype)</title>
<!--
  THROWAWAY DESIGN PROTOTYPE — wayfinder ticket #5.
  Single self-contained file, fake in-memory data, no real wiring.
  Demonstrates: Profile switcher, My Raid Trains, Raid Train Config editing
  with preset-override badges, Preset library, Live Link panel, and a
  secondary Build-by-hand door.
-->
<style>
  :root {
    --bg: #0f1216;
    --panel: #191e25;
    --panel-2: #222834;
    --panel-3: #2a3140;
    --ink: #e7ecf3;
    --muted: #96a2b4;
    --line: #2b313c;
    --accent: #57b6ff;
    --accent-dim: #9ad;
    --gold: #f4c430;
    --live: #ff5a67;
    --ok: #5ed18a;
    --warn: #ffb454;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  input, select, textarea { color-scheme: dark; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 70% -200px, #1a2230 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  input[type=text], select {
    width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); font: inherit;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  /* ── Top bar ─────────────────────────────────────────────────────── */
  .top {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px; border-bottom: 1px solid var(--line);
    background: rgba(15, 18, 22, .85); backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 40;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.3px; white-space: nowrap; }
  .brand h1 .a { color: var(--gold); }
  .brand .sep { color: var(--line); }
  .brand .app { color: var(--muted); font-size: 14px; font-weight: 600; }
  .brand-train { display: flex; align-items: flex-end; gap: 3px; padding-bottom: 3px; }
  .brand-train i {
    display: block; width: 14px; height: 9px; border-radius: 2px;
    border: 1px solid #0007;
  }
  .brand-train i:nth-child(1) { background: #b45309; border-color: var(--gold); width: 16px; height: 11px; }
  .brand-train i:nth-child(2) { background: #1e3a5f; }
  .brand-train i:nth-child(3) { background: #5b2a78; }
  .proto-chip {
    margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--warn); border: 1px dashed var(--warn);
    border-radius: 999px; padding: 3px 10px; opacity: .8; white-space: nowrap;
  }

  /* ── Profile switcher ─────────────────────────────────────────────── */
  .profile-wrap { position: relative; }
  .profile-btn {
    display: flex; align-items: center; gap: 9px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); padding: 5px 13px 5px 6px; font-weight: 600;
    transition: border-color .15s;
  }
  .profile-btn:hover { border-color: var(--accent); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #0c1016;
  }
  .profile-btn .chev { color: var(--muted); font-size: 11px; }
  .profile-menu {
    position: absolute; right: 0; top: calc(100% + 8px); width: 300px; z-index: 60;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 14px 40px #000a; padding: 8px; display: none;
  }
  .profile-menu.open { display: block; animation: pop .14s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .profile-menu .menu-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); padding: 6px 10px 4px; font-weight: 700;
  }
  .profile-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; border-radius: 8px; padding: 8px 10px;
    color: var(--ink); text-align: left;
  }
  .profile-item:hover { background: var(--panel-2); }
  .profile-item .p-name { font-weight: 700; }
  .profile-item .p-sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .profile-item .p-check { margin-left: auto; color: var(--ok); font-weight: 700; }
  .profile-add { display: flex; gap: 6px; padding: 8px 6px 4px; border-top: 1px solid var(--line); margin-top: 6px; }
  .profile-add input { flex: 1; padding: 7px 10px; font-size: 13px; }
  .profile-add button {
    padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); font-weight: 600; white-space: nowrap;
  }
  .profile-add button:hover { border-color: var(--accent); }
  .profile-hint { color: var(--muted); font-size: 11.5px; padding: 4px 10px 6px; }

  /* ── Shell: sidebar + main ────────────────────────────────────────── */
  .shell { display: flex; gap: 26px; max-width: 1240px; margin: 0 auto; padding: 26px 28px 60px; }
  .side { width: 224px; flex: none; position: sticky; top: 84px; align-self: flex-start; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; border-left: 2px solid transparent; border-radius: 0 8px 8px 0;
    padding: 9px 12px; color: var(--muted); font-weight: 600; text-align: left; font-size: 14.5px;
  }
  .nav-item:hover { color: var(--ink); background: #1a1f27; }
  .nav-item.active { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  .nav-item .n-count {
    margin-left: auto; font-size: 12px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 0 8px; line-height: 18px;
  }
  .nav-item.active .n-count { background: var(--panel-3); }
  .nav-item .n-gold { color: var(--gold); }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .nav-item.secondary { font-size: 13.5px; }
  .side .side-note { color: var(--muted); font-size: 11.5px; padding: 10px 12px 0; line-height: 1.5; }

  main { flex: 1; min-width: 0; }
  .view-title { font-size: 20px; margin: 2px 0 4px; letter-spacing: -.3px; }
  .view-sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 16px;
    animation: rise .3s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .card:nth-child(3) { animation-delay: .04s; } .card:nth-child(4) { animation-delay: .08s; }
  .card:nth-child(5) { animation-delay: .12s; } .card:nth-child(6) { animation-delay: .16s; }
  .card:nth-child(7) { animation-delay: .2s; }  .card:nth-child(8) { animation-delay: .24s; }
  h2.card-h {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--accent-dim); margin: 0 0 12px; font-weight: 700;
  }
  .hint { color: var(--muted); font-size: 13px; margin-top: 5px; }

  .btn {
    padding: 8px 15px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); font-weight: 600; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #08121c; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #1f2937; font-weight: 700; }
  .btn.gold:hover { filter: brightness(1.06); }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn.sm { padding: 5px 11px; font-size: 13px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted); font-size: 15px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--accent); }
  .icon-btn.accent { color: var(--accent); border-color: #2c4356; background: #57b6ff10; }
  .icon-btn.accent:hover { color: var(--ink); background: #57b6ff22; border-color: var(--accent); }
  .icon-btn.destructive { color: #d9737c; border-color: #4a262c; }
  .icon-btn.destructive:hover { color: #ffb4ba; background: #52242a; border-color: #7c3540; }
  .icon-btn svg { display: block; }
  .icon-btn.spin { animation: spin .8s linear infinite; color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Live Link hero ───────────────────────────────────────────────── */
  .live-link {
    border-color: #4a4126;
    background: linear-gradient(180deg, rgba(244, 196, 48, .055), transparent 55%), var(--panel);
    position: relative; overflow: hidden;
  }
  .live-link::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(var(--gold), #a87e0c);
  }
  .live-link.flash { animation: flashcard 1.1s ease; }
  @keyframes flashcard { 0%, 40% { box-shadow: 0 0 0 2px var(--gold), 0 0 34px #f4c43055; } 100% { box-shadow: none; } }
  .ll-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .ll-head h2 { font-size: 16px; margin: 0; color: var(--gold); letter-spacing: .01em; }
  .ll-badge {
    font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); border: 1px solid #4a4126; background: #f4c43014;
    border-radius: 999px; padding: 2px 9px;
  }
  .ll-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
  .ll-sub b { color: var(--ink); font-weight: 600; }
  .url-row { display: flex; gap: 8px; }
  .url-row input {
    flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px; background: #0c0f14; border-color: var(--line); color: var(--accent-dim);
    padding: 10px 12px;
  }
  .url-row .btn { padding-left: 18px; padding-right: 18px; }
  .ll-note { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 12.5px; margin-top: 9px; }
  .ll-note .w { color: var(--warn); flex: none; }
  .ll-idle { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--line); }
  .ll-idle label.chk { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .ll-idle input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--gold); }
  .ll-idle select { width: auto; padding: 6px 10px; font-size: 13.5px; }
  .ll-idle .dim { opacity: .45; pointer-events: none; }
  .ll-meta { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .ll-meta a { color: var(--accent-dim); }

  /* ── Event cards ─────────────────────────────────────────────────── */
  .event-card {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 15px 18px;
  }
  .event-main { flex: 1; min-width: 0; }
  .event-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .event-title { font-size: 15.5px; font-weight: 700; letter-spacing: -.2px; }
  .event-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .event-meta b { color: var(--ink); font-weight: 600; }
  .event-actions { display: flex; align-items: center; gap: 7px; flex: none; padding-top: 3px; }
  .chip-live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
    color: var(--live); border: 1px solid #5c2b31; background: #ff5a6714;
    border-radius: 999px; padding: 2px 9px 2px 7px;
  }
  .chip-live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.4s ease infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #ff5a6766; } 55% { box-shadow: 0 0 0 5px #ff5a6700; } }
  .chip-org {
    font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); border: 1px solid #4a4126; background: #f4c43010;
    border-radius: 999px; padding: 2px 9px;
  }
  .chip-cfg {
    font-size: 11px; font-weight: 600; color: var(--accent-dim);
    border: 1px solid #2c4356; background: #57b6ff10; border-radius: 999px; padding: 1.5px 9px;
  }
  .event-card.is-live { border-color: #5c2b31; box-shadow: 0 0 22px #ff5a6712; }

  .mini-train { display: inline-flex; align-items: flex-end; gap: 3px; margin-top: 9px; height: 14px; }
  .mini-train .mt-e { width: 15px; height: 12px; border-radius: 2.5px 1.5px 1.5px 2.5px; background: #b45309; border: 1px solid #f4c43088; }
  .mini-train .mt-c { width: 13px; height: 10px; border-radius: 2px; border: 1px solid #0006; }
  .mini-train .mt-c.open { background: transparent; border: 1px dashed #4a5568; }
  .mini-train .mt-more { color: var(--muted); font-size: 10.5px; padding-left: 3px; align-self: center; }

  /* ── Past (departed) trains ──────────────────────────────────────── */
  .past-divider {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 600;
    padding: 10px 4px; margin: 4px 0;
  }
  .past-divider::before, .past-divider::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
  .past-divider:hover { color: var(--ink); }
  .past-divider .pd-chev { font-size: 11px; transition: transform .18s; display: inline-block; }
  .past-divider.open .pd-chev { transform: rotate(180deg); }
  .past-list { overflow: hidden; }
  .event-card.past {
    filter: grayscale(1); opacity: .55; padding: 10px 18px; margin-bottom: 10px;
    transition: opacity .15s, filter .15s;
  }
  .event-card.past:hover { opacity: .9; filter: grayscale(.5); }
  .stamp {
    font-size: 9.5px; font-weight: 800; letter-spacing: .14em; color: var(--muted);
    border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 7px;
    transform: rotate(-5deg); user-select: none;
  }

  /* ── Config editor ───────────────────────────────────────────────── */
  .back-link {
    display: inline-flex; align-items: center; gap: 7px; background: none; border: 0;
    color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 0; margin-bottom: 12px;
  }
  .back-link:hover { color: var(--accent); }
  .preset-ref { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .preset-ref select { width: 260px; }
  .preset-ref .lbl { font-weight: 700; font-size: 14px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field-head { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; min-height: 24px; }
  .field-head label { font-weight: 600; }
  .ovr-slot { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .ovr-badge {
    font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
    color: var(--warn); border: 1px solid #5a4426; background: #ffb45412;
    border-radius: 999px; padding: 2px 9px; animation: pop .15s ease;
  }
  .ovr-revert {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid #5a4426;
    background: transparent; color: var(--warn); font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ovr-revert:hover { background: #ffb45418; }
  .range-row { display: flex; align-items: center; gap: 12px; }
  .range-out { min-width: 3ch; text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700; }
  .check-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
  .check-row input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }

  /* Collapsible settings groups (mirror the old Look / Motion / Lineup tabs) */
  details.fgroup { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 10px; background: #171b22; }
  details.fgroup:last-of-type { margin-bottom: 0; }
  details.fgroup summary {
    display: flex; align-items: center; gap: 10px; list-style: none; cursor: pointer;
    padding: 10px 14px; user-select: none;
  }
  details.fgroup summary::-webkit-details-marker { display: none; }
  .g-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--accent-dim); font-weight: 700;
  }
  details.fgroup summary:hover .g-label { color: var(--ink); }
  .g-ovr {
    font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--warn); border: 1px solid #5a4426; background: #ffb45412;
    border-radius: 999px; padding: 1px 8px;
  }
  .g-ovr:empty { display: none; }
  .g-chev { margin-left: auto; color: var(--muted); font-size: 11px; transition: transform .15s; }
  details.fgroup[open] .g-chev { transform: rotate(180deg); }
  .fgroup-body { padding: 6px 14px 14px; border-top: 1px solid var(--line); }
  .spot-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
  .spot-chip {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line);
    background: #0c0f14; border-radius: 999px; padding: 2.5px 11px;
  }
  .spot-chip b { color: var(--accent-dim); font-weight: 600; }
  .editor-head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 2px; }
  .editor-head-row h2 { font-size: 19px; margin: 0; letter-spacing: -.3px; }
  .cfg-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cfg-toolbar .reset-all { margin-left: auto; background: none; border: 0; color: var(--warn); font-size: 13px; font-weight: 600; padding: 0; }
  .cfg-toolbar .reset-all:hover { text-decoration: underline; }

  /* ── Preset library ──────────────────────────────────────────────── */
  .preset-row {
    display: flex; align-items: center; gap: 14px; padding: 13px 18px;
  }
  .preset-info { flex: 1; min-width: 0; }
  .preset-name-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .preset-name { font-size: 15px; font-weight: 700; }
  .preset-name-row input { width: 230px; padding: 5px 9px; font-size: 14px; font-weight: 700; }
  .chip-default {
    font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
    color: var(--gold); border: 1px solid #4a4126; background: #f4c43010;
    border-radius: 999px; padding: 1.5px 9px;
  }
  .preset-sum { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .sum-chip {
    font-size: 11.5px; color: var(--muted); border: 1px solid var(--line);
    background: #0c0f14; border-radius: 999px; padding: 1.5px 10px;
  }
  .preset-used { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .preset-used b { color: var(--accent-dim); font-weight: 600; }
  .preset-actions { display: flex; gap: 7px; flex: none; }
  .star-btn { color: var(--muted); font-size: 16px; }
  .star-btn.on { color: var(--gold); border-color: #4a4126; }

  .preset-info { cursor: pointer; }
  .preset-info:hover .preset-name { color: var(--accent); }

  /* ── Preset editor + Profile settings ────────────────────────────── */
  .preset-title-input {
    width: auto; min-width: 200px; max-width: 420px;
    font-size: 19px; font-weight: 700; letter-spacing: -.3px;
    background: transparent; border: 1px solid transparent; border-radius: 7px;
    padding: 4px 9px; margin-left: -9px; color: var(--ink);
  }
  .preset-title-input:hover { border-color: var(--line); background: var(--panel); }
  .preset-title-input:focus { border-color: var(--accent); background: var(--panel-2); outline: none; }
  .spot-edit-link {
    background: none; border: 0; padding: 2px 4px; color: var(--accent-dim);
    font-size: 12px; font-weight: 600; align-self: center;
  }
  .spot-edit-link:hover { color: var(--accent); text-decoration: underline; }
  .spot-edit-list { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
  .spot-edit-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--muted); border: 1px solid var(--line);
    background: #0c0f14; border-radius: 999px; padding: 4px 6px 4px 13px;
  }
  .spot-edit-chip b { color: var(--accent-dim); font-weight: 600; }
  .chip-x {
    width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--panel-2);
    color: var(--muted); font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .chip-x:hover { background: #52242a; color: #ffb4ba; }
  .spot-add { display: flex; gap: 8px; max-width: 420px; }

  /* ── Manual view ─────────────────────────────────────────────────── */

  /* ── Toast + modal ───────────────────────────────────────────────── */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--panel-3); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 9px 20px; font-size: 14px; font-weight: 600;
    box-shadow: 0 10px 30px #000a; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 90;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast .ok { color: var(--ok); margin-right: 6px; }
  #modal-scrim {
    position: fixed; inset: 0; background: #0009; backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; z-index: 80;
  }
  #modal-scrim.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 440px; max-width: calc(100vw - 40px); padding: 20px 22px;
    box-shadow: 0 20px 60px #000c; animation: pop .16s ease;
  }
  .modal h3 { margin: 0 0 8px; font-size: 16px; }
  .modal p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  .modal p b { color: var(--warn); }
  .modal .m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .btn.danger-solid { background: #52242a; border-color: #7c3540; color: #ffb4ba; }
  .btn.danger-solid:hover { background: #6b2d35; }

  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }
</style>

<script>
'use strict';

/* ══════════════ Fake data (in-memory only) ══════════════ */

const THEMES = {
  classic: 'Classic Americana', flat: 'Flat cartoon', synthwave: 'Synthwave',
  ticket: 'Vintage ticket', wood: 'Wooden toy train', comic: 'Comic / halftone',
  departures: 'Departures board', paper: 'Paper cutout', tron: 'Tron lightcycle',
  pixel: '16-bit pixel', highvibes: 'High Vibes', jazz: 'Jazz vinyl',
  bullet: 'Anime bullet train', lava: 'Lava lamp', pride: 'Pride', shuffle: 'Shuffle — cycle every theme',

const MODES = { pass: 'Pass — rolls across every few minutes', marquee: 'Marquee — always on screen' };
const HORIZONS = { next3: 'Next 3 trains', next5: 'Next 5 trains', w2: 'Next 2 weeks', m1: 'Next month', all: 'All upcoming' };
const LANGS = {
  '': 'Auto (browser)', en: 'English', 'es-ES': 'Español (España)', 'es-MX': 'Español (México)',

const CAR_COLORS = ['#1e3a5f', '#5b2a78', '#14361f', '#6b3d12', '#3d1f42', '#173a3a'];
const OVERLAY_BASE = 'https://goproslowyo.github.io/RaidTrainOverlay/overlay.html';

// The FULL settings-only field set (what a Preset stores, and what a Raid
// Train Config can override per field). Spotlight is never a Preset field:
// standing Spotlights live on the Profile, extras on the Raid Train Config.
const FIELD_DEFS = [
  { key: 'theme',        group: 'look',     label: 'Theme',                  type: 'select', options: THEMES },
  { key: 'scale',        group: 'look',     label: 'Train size',             type: 'range', min: 0.5, max: 2, step: 0.1 },
  { key: 'height',       group: 'look',     label: 'Vertical position',      type: 'range', min: 0, max: 100, step: 1,

  { key: 'enginedim',    group: 'look',     label: 'When the event ends',    type: 'select',
    options: { over: 'Dim the engine', finished: 'Hide it (when hiding finished cars)', never: 'Keep the engine bright' } },
  { key: 'mode',         group: 'motion',   label: 'Display style',          type: 'select', options: MODES },
  { key: 'interval',     group: 'motion',   label: 'Minutes between passes', type: 'number', min: 1, step: 1 },

  { key: 'track',        group: 'motion',   label: 'Track between passes',   type: 'select',

  { key: 'trackfadein',  group: 'motion',   label: 'Track fade in (seconds)',  type: 'number', min: 0, max: 120, step: 1 },
  { key: 'trackfadeout', group: 'motion',   label: 'Track fade out (seconds)', type: 'number', min: 0, max: 120, step: 1 },
  { key: 'refresh',      group: 'behavior', label: 'Auto-refresh (minutes)', type: 'number', min: 15, step: 5, placeholder: 'off',
    hint: 'How often to re-check RaidPal for lineup changes. Blank = check once on load.' },
  { key: 'openslots',    group: 'behavior', label: 'Open slots',             type: 'check',
    checkText: 'Show open slots as OPEN cars so viewers can sign up' },
  { key: 'hidefinished', group: 'behavior', label: 'Finished cars',          type: 'check',
    checkText: 'Hide cars that have already played, instead of dimming them' },
  { key: 'tz',           group: 'behavior', label: 'Clock time zones',       type: 'text', placeholder: 'PT, ET, GMT',
    hint: 'Up to 3 zones to show absolute times instead of "in 2h". Blank = relative times.' },
  { key: 'lang',         group: 'behavior', label: 'Overlay language',       type: 'select', options: LANGS },
];
const GROUPS = [
  { id: 'look', label: 'Look' },
  { id: 'motion', label: 'Motion' },
  { id: 'behavior', label: 'Behavior' },
];
const FIELDS = FIELD_DEFS.map((d) => d.key);
const DEF_BY_KEY = Object.fromEntries(FIELD_DEFS.map((d) => [d.key, d]));
// Baseline values (the real serializer's defaults) — every Preset starts here.
const SETTING_DEFAULTS = {
  theme: 'classic', scale: '1', height: '100', enginedim: 'over',
  mode: 'pass', interval: '15', speed: '1', track: 'periodic', trackfadein: '15', trackfadeout: '10',
  refresh: '', openslots: false, hidefinished: false, tz: '', lang: '',
};

const ICONS = {
  pencil: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.7l2 2L5.4 12.6l-2.9.9.9-2.9z"/><path d="m9.9 4.1 2 2"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.2"/><path d="M10.5 3.5v-.4a1 1 0 0 0-1-1H3.6a1 1 0 0 0-1 1v5.8a1 1 0 0 0 1 1h.4" transform="translate(0 0)"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11"/><path d="M5.5 4.5V3.2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.3"/><path d="m4.3 4.5.6 8.6a1 1 0 0 0 1 .9h4.2a1 1 0 0 0 1-.9l.6-8.6"/><path d="M6.7 7.3v3.9M9.3 7.3v3.9"/></svg>',
};

const DB = {
  order: ['gostreamcore', 'vinyl_veda'],
  profiles: {
    gostreamcore: {
      color: '#57b6ff',
      spotlights: ['DJ_Nova', 'beatrix_live'],

        { name: 'Minimal Marquee',   ...SETTING_DEFAULTS, theme: 'departures', mode: 'marquee', scale: '0.8', hidefinished: true },
      ],
      configs: {

        'trainwreck-lucky-13':    { preset: 'House Default',     overrides: {}, spotlight: '' },
      },
      events: [
        { slug: 'synthwave-saturdays-42', title: 'Synthwave Saturdays #42', status: 'live',
          organized: false, organiser: 'NeonRailways', when: 'Today · 4:00 PM – 10:00 PM', slots: 12, filled: 11 },
        { slug: 'trainwreck-lucky-13', title: 'Trainwreck Lucky 13', status: 'upcoming',

        { slug: 'lofi-night-owls', title: 'Lo-Fi Night Owls', status: 'upcoming',
          organized: false, organiser: 'sleepy_cass', when: 'Sat, Aug 22 · 10:00 PM – 6:00 AM', slots: 10, filled: 6 },
        { slug: 'retro-rewind-9', title: 'Retro Rewind Vol. 9', status: 'past',
          organized: false, organiser: 'NeonRailways', when: 'Sun, Jul 26', slots: 12, filled: 12 },
        { slug: 'nye-marathon-2026', title: 'New Year Marathon 2026', status: 'past',
          organized: true, organiser: 'gostreamcore', when: 'Thu, Jan 1', slots: 24, filled: 22 },
      ],
    },
    vinyl_veda: {
      color: '#c084fc',
      spotlights: [],
      defaultPreset: 'Jazz Nights',
      liveLink: { idle: true, horizon: 'w2' },
      presets: [
        { name: 'Jazz Nights', ...SETTING_DEFAULTS, theme: 'jazz' },
      ],
      configs: {},
      events: [
        { slug: 'blue-note-express', title: 'Blue Note Express', status: 'upcoming',
          organized: true, organiser: 'vinyl_veda', when: 'Sat, Aug 15 · 7:00 PM – 1:00 AM', slots: 6, filled: 4 },
        { slug: 'sunday-spin-14', title: 'Sunday Spin #14', status: 'past',
          organized: false, organiser: 'wax_wanderer', when: 'Sun, Jul 20', slots: 8, filled: 8 },
      ],
    },
  },
};

const state = {
  profile: 'gostreamcore',
  view: 'trains',        // 'trains' | 'presets' | 'manual' | 'profile'
  editing: null,         // event slug when the Raid Train Config editor is open
  editingPreset: null,   // preset name when the Preset editor is open
  pastOpen: false,
  renaming: null,        // preset name currently in inline-rename (library rows)
};

/* ══════════════ Prototype persistence (localStorage, demo only) ══════════════ */

const STORE_KEY = 'rto-redesign-proto.v1';
const SEED = JSON.stringify({ order: DB.order, profiles: DB.profiles }); // pristine, pre-restore
(function restoreSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || !saved.db || !Array.isArray(saved.db.order) || !saved.db.profiles) return;
    for (const name of saved.db.order) {
      const p = saved.db.profiles[name];
      if (!p || !Array.isArray(p.presets) || !p.presets.length) return; // malformed — keep the seed
      // Older saves may predate schema growth: backfill every preset field.
      p.presets = p.presets.map((q) => ({ ...SETTING_DEFAULTS, ...q }));
      p.spotlights = Array.isArray(p.spotlights) ? p.spotlights : [];
      p.configs = p.configs && typeof p.configs === 'object' ? p.configs : {};
      p.events = Array.isArray(p.events) ? p.events : [];
      p.liveLink = p.liveLink && typeof p.liveLink === 'object' ? p.liveLink : { idle: false, horizon: 'next3' };
      if (!p.presets.some((q) => q.name === p.defaultPreset)) p.defaultPreset = p.presets[0].name;
    }
    DB.order = saved.db.order;
    DB.profiles = saved.db.profiles;
    if (saved.profile && DB.profiles[saved.profile]) state.profile = saved.profile;
  } catch (e) { /* corrupt save — fall back to the seed */ }
})();
let saveTimer = null;
function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ db: { order: DB.order, profiles: DB.profiles }, profile: state.profile })); } catch (e) { /* quota — demo only */ }
  }, 150);
}
// Capture-phase net: every interaction that can mutate state schedules a save.
for (const t of ['click', 'input', 'change', 'focusout']) document.addEventListener(t, saveSoon, true);
function resetDemo() {
  localStorage.removeItem(STORE_KEY);
  const fresh = JSON.parse(SEED);
  DB.order = fresh.order;
  DB.profiles = fresh.profiles;
  Object.assign(state, { profile: 'gostreamcore', view: 'profile', editing: null, editingPreset: null, pastOpen: false, renaming: null });
  render();
  toast('Demo data reset to the seeded examples');
}

/* ══════════════ Helpers ══════════════ */

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function P() { return DB.profiles[state.profile]; }
function presetByName(name) { return P().presets.find((p) => p.name === name); }
function eventBySlug(slug) { return P().events.find((e) => e.slug === slug); }
function refCount(presetName) {
  return Object.values(P().configs).filter((c) => c.preset === presetName).length;
}
function healDefaultPreset() {
  // A dangling default (e.g. after a rename/delete raced a click) silently
  // breaks everything downstream — heal it to the first Preset.
  if (!presetByName(P().defaultPreset)) P().defaultPreset = P().presets[0].name;
}
function ensureConfig(slug) {
  healDefaultPreset();
  if (!P().configs[slug]) P().configs[slug] = { preset: P().defaultPreset, overrides: {}, spotlight: '' };
  const cfg = P().configs[slug];
  if (!presetByName(cfg.preset)) cfg.preset = P().defaultPreset; // heal a dangling reference
  return cfg;
}
function effective(cfg) {
  const base = presetByName(cfg.preset) || P().presets[0];
  const out = {};
  for (const f of FIELDS) out[f] = (f in cfg.overrides) ? cfg.overrides[f] : base[f];
  return out;
}
function eventOverlayUrl(slug) {
  const cfg = ensureConfig(slug);
  const eff = effective(cfg);
  const sp = new URLSearchParams({ event: slug });
  if (eff.theme !== 'classic') sp.set('theme', eff.theme);
  if (eff.mode !== 'pass') sp.set('mode', eff.mode);
  if (String(eff.scale) !== '1') sp.set('scale', eff.scale);
  if (String(eff.height) !== '100') sp.set('height', eff.height);
  const raw = [...P().spotlights, ...String(cfg.spotlight || '').split(',').map((s) => s.trim()).filter(Boolean)];
  const seen = new Set(), spots = raw.filter((s) => { const k = s.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  if (spots.length) sp.set('spotlight', spots.join(','));
  return `${OVERLAY_BASE}?${sp}`;
}
function liveLinkUrl() {
  const ll = P().liveLink;
  const base = presetByName(P().defaultPreset) || P().presets[0] || {};
  const sp = new URLSearchParams({ user: state.profile });
  if (ll.idle) sp.set('idle', ll.horizon);
  // The real Live Link carries its full settings encoded in the URL itself
  // (it never reads localStorage). Fake that with a short settings blob.
  const blob = btoa(JSON.stringify([base.theme, base.mode, base.scale, base.height, ll.idle, ll.horizon, P().spotlights]))
    .replace(/[+/=]/g, '').slice(0, 16);
  sp.set('s', blob);
  return `${OVERLAY_BASE}?${sp}`;
}
function avatarColor(name) { return DB.profiles[name] ? DB.profiles[name].color : '#5ed18a'; }

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.innerHTML = '<span class="ok">✓</span>' + esc(msg);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function copyText(text, msg) {
  try { navigator.clipboard.writeText(text); } catch (e) { /* prototype */ }
  toast(msg);
}
function openModal(html) { $('#modal').innerHTML = html; $('#modal-scrim').classList.add('open'); }
function closeModal() { $('#modal-scrim').classList.remove('open'); }

/* ══════════════ Render: top bar + sidebar ══════════════ */

function renderTopbar() {

      ${name === state.profile ? '<span class="p-check">✓</span>' : ''}
    </button>`;
  }).join('') + `<button class="profile-item p-manage" data-act="manage-profile">
      <span class="p-gear" aria-hidden="true">⚙</span>
      <span><span class="p-name">Manage profile…</span>
        <span class="p-sub">Standing Spotlights and default Preset for ${esc(state.profile)}</span></span>
    </button>`;
}

function renderSidebar() {
  $('#nc-trains').textContent = P().events.length;
  $('#nc-presets').textContent = P().presets.length;
  $$('.nav-item').forEach((el) => {
    const nav = el.dataset.nav;

    el.classList.toggle('active', Boolean(active) && nav !== 'livelink');
  });
}

/* ══════════════ Render: My Raid Trains ══════════════ */

function miniTrain(ev) {
  const max = 8, shown = Math.min(ev.slots, max);
  let h = '<span class="mini-train" aria-hidden="true"><span class="mt-e"></span>';
  for (let i = 0; i < shown; i++) {
    const open = i >= ev.filled;
    const bg = open ? '' : `style="background:${CAR_COLORS[i % CAR_COLORS.length]}"`;
    h += `<span class="mt-c${open ? ' open' : ''}" ${bg}></span>`;
  }
  if (ev.slots > max) h += `<span class="mt-more">+${ev.slots - max}</span>`;
  return h + '</span>';
}

function eventCard(ev) {
  const cfg = P().configs[ev.slug];
  const nOvr = cfg ? Object.keys(cfg.overrides).length : 0;
  const cfgChip = cfg
    ? `<span class="chip-cfg" title="This train has a saved Raid Train Config">${esc(cfg.preset)}${nOvr ? ` +${nOvr}` : ''}</span>`
    : '';
  const past = ev.status === 'past';
  return `<div class="card event-card${ev.status === 'live' ? ' is-live' : ''}${past ? ' past' : ''}">
    <div class="event-main">
      <div class="event-title-row">
        ${past ? '<span class="stamp">Departed</span>' : ''}
        <span class="event-title">${esc(ev.title)}</span>
        ${ev.status === 'live' ? '<span class="chip-live"><span class="dot"></span>LIVE NOW</span>' : ''}
        ${ev.organized ? '<span class="chip-org" title="You organise this raid train">Organiser</span>' : ''}
        ${cfgChip}
      </div>
      <div class="event-meta">${esc(ev.when)} · <b>${ev.filled}/${ev.slots}</b> slots filled · by ${esc(ev.organiser)}</div>
      ${past ? '' : miniTrain(ev)}
    </div>
    <div class="event-actions">
      <button class="icon-btn" data-act="refresh" data-slug="${esc(ev.slug)}" title="Refresh from RaidPal">⟳</button>
      <button class="icon-btn" data-act="copy-link" data-slug="${esc(ev.slug)}" title="Copy overlay link for this train">⧉</button>
      <button class="btn sm" data-act="open-config" data-slug="${esc(ev.slug)}">Configure</button>
    </div>
  </div>`;
}

function liveLinkCard() {
  const ll = P().liveLink;
  const base = presetByName(P().defaultPreset);
  return `<section class="card live-link" id="live-link-card">

function renderTrains(flashLiveLink) {
  const evs = P().events;

  if (past.length) {
    h += `<button class="past-divider${state.pastOpen ? ' open' : ''}" data-act="toggle-past">

/* ══════════════ Render: Raid Train Config editor ══════════════ */

function overrideBadge(field) {
  const cfg = ensureConfig(state.editing);
  if (!(field in cfg.overrides)) return '';
  return `<span class="ovr-badge">Overrides preset</span>
    <button class="ovr-revert" data-act="revert" data-field="${field}" title="Revert to the preset value" aria-label="Revert ${esc(DEF_BY_KEY[field].label)} to the preset value">↺</button>`;
}
function fieldLabelValue(def, v) {
  if (def.type === 'check') return v ? 'on' : 'off';
  if (def.type === 'select') return def.options[v] ?? String(v);
  return String(v) === '' ? 'blank' : String(v);
}
function presetValueHint(field) {
  const cfg = ensureConfig(state.editing);
  const base = presetByName(cfg.preset);
  if (!base || !(field in cfg.overrides)) return '';
  return `Preset value: ${esc(fieldLabelValue(DEF_BY_KEY[field], base[field]))}`;
}

/* Generic field renderer, shared by both editors.
   prefix 'f' = Raid Train Config editor (override badges + revert);
   prefix 'p' = Preset editor (plain fields). */
function renderField(def, value, prefix) {
  const isCfg = prefix === 'f';
  const dattr = isCfg ? 'data-field' : 'data-pfield';
  const id = `${prefix}-${def.key}`;
  let control = '';
  if (def.type === 'select') {
    control = `<select id="${id}" ${dattr}="${def.key}">${Object.entries(def.options)
      .map(([k, v]) => `<option value="${esc(k)}"${String(value) === String(k) ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
  } else if (def.type === 'range') {
    control = `<div class="range-row"><input type="range" id="${id}" ${dattr}="${def.key}" min="${def.min}" max="${def.max}" step="${def.step}" value="${esc(value)}"><span class="range-out" id="${id}-out">${esc(value)}</span></div>`;
  } else if (def.type === 'number') {
    control = `<input type="number" id="${id}" ${dattr}="${def.key}"${def.min != null ? ` min="${def.min}"` : ''}${def.max != null ? ` max="${def.max}"` : ''}${def.step != null ? ` step="${def.step}"` : ''} value="${esc(value)}"${def.placeholder ? ` placeholder="${esc(def.placeholder)}"` : ''}>`;
  } else if (def.type === 'check') {
    control = `<label class="check-row"><input type="checkbox" id="${id}" ${dattr}="${def.key}"${value ? ' checked' : ''}><span>${esc(def.checkText || '')}</span></label>`;
  } else {
    control = `<input type="text" id="${id}" ${dattr}="${def.key}" value="${esc(value)}"${def.placeholder ? ` placeholder="${esc(def.placeholder)}"` : ''} autocomplete="off">`;
  }
  const head = `<div class="field-head"><label for="${id}">${esc(def.label)}</label>${isCfg ? `<span class="ovr-slot" id="ovr-${def.key}">${overrideBadge(def.key)}</span>` : ''}</div>`;
  const hint = isCfg
    ? `<div class="hint" id="ph-${def.key}">${presetValueHint(def.key) || esc(def.hint || '')}</div>`
    : (def.hint ? `<div class="hint">${esc(def.hint)}</div>` : '');
  return `<div class="field">${head}${control}${hint}</div>`;
}
function groupOverrideCount(gid, cfg) {
  return FIELD_DEFS.filter((d) => d.group === gid && (d.key in cfg.overrides)).length;
}
function renderGroup(g, values, prefix, cfg) {
  const fields = FIELD_DEFS.filter((d) => d.group === g.id)
    .map((d) => renderField(d, values[d.key], prefix)).join('');
  const n = cfg ? groupOverrideCount(g.id, cfg) : 0;
  return `<details class="fgroup"${g.id === 'look' ? ' open' : ''}>
    <summary><span class="g-label">${esc(g.label)}</span><span class="g-ovr" id="g-ovr-${g.id}">${n ? `${n} overridden` : ''}</span><span class="g-chev" aria-hidden="true">▾</span></summary>
    <div class="fgroup-body">${fields}</div>
  </details>`;
}

/* Targeted refresh after a field edit (keeps focus / slider drag alive). */
function refreshEditorChrome() {
  const cfg = ensureConfig(state.editing);
  const eff = effective(cfg);
  for (const def of FIELD_DEFS) {
    const f = def.key;
    const slot = $('#ovr-' + f);
    if (slot) slot.innerHTML = overrideBadge(f);
    const ph = $('#ph-' + f);
    if (ph) {
      const hint = presetValueHint(f);
      ph.innerHTML = hint || esc(def.hint || '');
    }
    if (def.type === 'range') {
      const out = $(`#f-${f}-out`);
      if (out) out.textContent = eff[f];
    }
  }
  for (const g of GROUPS) {
    const tag = $('#g-ovr-' + g.id);
    if (tag) {
      const n = groupOverrideCount(g.id, cfg);
      tag.textContent = n ? `${n} overridden` : '';
    }
  }
  const url = $('#cfg-url');
  if (url) url.value = eventOverlayUrl(state.editing);
  // Re-render the toolbar reset link by count
  const nOvr = Object.keys(cfg.overrides).length;
  const bar = $('.cfg-toolbar');
  if (bar) {
    const existing = $('.reset-all', bar);
    if (nOvr && !existing) {
      const b = document.createElement('button');
      b.className = 'reset-all'; b.dataset.act = 'reset-overrides';
      b.textContent = `Reset ${nOvr} override${nOvr === 1 ? '' : 's'}`;
      bar.appendChild(b);
    } else if (existing) {
      if (!nOvr) existing.remove();
      else existing.textContent = `Reset ${nOvr} override${nOvr === 1 ? '' : 's'}`;
    }
  }
}

/* ══════════════ Render: Preset Library ══════════════ */

function presetSummary(p) {
  const bits = [THEMES[p.theme], p.mode === 'pass' ? 'Pass' : 'Marquee', `size ${p.scale}`];
  if (String(p.height) !== '100') bits.push(`Y ${p.height}`);
  const nonDefault = FIELDS.filter((f) => !['theme', 'mode', 'scale', 'height'].includes(f)
    && String(p[f]) !== String(SETTING_DEFAULTS[f])).length;
  if (nonDefault) bits.push(`+${nonDefault} more`);
  return bits.map((b) => `<span class="sum-chip">${esc(b)}</span>`).join('');
}

function renderPresets() {
  const rows = P().presets.map((p) => {
    const used = refCount(p.name);
    const isDefault = p.name === P().defaultPreset;
    const nameCell = state.renaming === p.name
      ? `<input type="text" id="rename-input" value="${esc(p.name)}" data-old="${esc(p.name)}" autocomplete="off">`
      : `<span class="preset-name">${esc(p.name)}</span>`;
    return `<div class="card preset-row">
      <div class="preset-info" data-act="edit-preset" data-name="${esc(p.name)}" title="Open this Preset">
        <div class="preset-name-row">
          ${nameCell}
          ${isDefault ? '<span class="chip-default">Default</span>' : ''}
        </div>
        <div class="preset-sum">${presetSummary(p)}</div>
        <div class="preset-used">${used ? `Used by <b>${used}</b> Raid Train Config${used === 1 ? '' : 's'}` : 'Not used by any Raid Train Config yet'}</div>
      </div>
      <div class="preset-actions">
        <button class="icon-btn star-btn${isDefault ? ' on' : ''}" data-act="make-default" data-name="${esc(p.name)}" title="${isDefault ? 'This is the default Preset' : 'Make this the default Preset'}" aria-label="${isDefault ? 'This is the default Preset' : 'Make this the default Preset'}">${isDefault ? '★' : '☆'}</button>
        <button class="icon-btn" data-act="edit-preset" data-name="${esc(p.name)}" title="Edit — settings and rename" aria-label="Edit preset ${esc(p.name)}">${ICONS.pencil}</button>
        <button class="icon-btn accent" data-act="dup-preset" data-name="${esc(p.name)}" title="Duplicate, then rename the copy" aria-label="Duplicate preset ${esc(p.name)}">${ICONS.copy}</button>
        <button class="icon-btn destructive" data-act="del-preset" data-name="${esc(p.name)}" title="Delete this Preset" aria-label="Delete preset ${esc(p.name)}">${ICONS.trash}</button>
      </div>
    </div>`;
  }).join('');
  $('#main').innerHTML = `
    <h2 class="view-title">Preset Library</h2>
    <p class="view-sub">Presets are saved settings — no event attached. Raid Train Configs point at a Preset and override only what differs. Click a Preset to edit it, or duplicate one to branch a new look in seconds.</p>
    ${rows || '<div class="empty">No Presets yet.</div>'}`;
  const input = $('#rename-input');
  if (input) { input.focus(); input.select(); }
}

function commitRename(input) {
  const oldName = input.dataset.old;
  const newName = input.value.trim();
  state.renaming = null;
  // Post-duplicate intent is always "now customize it": any commit (Enter or
  // blur, renamed or kept as-is) drops straight into the new Preset's editor.
  // Escape is the explicit opt-out and stays in the library (see keydown).
  if (!newName || newName === oldName) {
    state.editingPreset = oldName;
    render();
    return;
  }
  if (P().presets.some((p) => p.name === newName)) {
    toast('A Preset with that name already exists');
    renderPresets();
    return;
  }
  const p = presetByName(oldName);
  p.name = newName;
  if (P().defaultPreset === oldName) P().defaultPreset = newName;
  for (const c of Object.values(P().configs)) if (c.preset === oldName) c.preset = newName;
  state.editingPreset = newName;
  render();
  toast(`Saved as "${newName}" — customize it below`);
}

/* ══════════════ Render: Preset editor ══════════════ */

function renderPresetEditor() {
  const p = presetByName(state.editingPreset);
  if (!p) { state.editingPreset = null; renderPresets(); return; }
  const used = refCount(p.name);
  const isDefault = p.name === P().defaultPreset;
  $('#main').innerHTML = `
    <button class="back-link" data-act="back-presets">← Preset Library</button>
    <div class="editor-head-row">
      <input type="text" class="preset-title-input" id="preset-title-input" value="${esc(p.name)}" data-old="${esc(p.name)}" autocomplete="off" title="Rename this Preset">
      ${isDefault
        ? '<span class="chip-default" title="This is the default Preset — new Raid Train Configs and your Live Link start from it">✓ Default</span>'
        : `<button class="btn sm" data-act="make-default-editor" data-name="${esc(p.name)}">Make default</button>`}
    </div>
    <p class="view-sub">${used
      ? `Used by <b style="color:var(--accent-dim)">${used}</b> Raid Train Config${used === 1 ? '' : 's'} — changes here flow to ${used === 1 ? 'it' : 'them'}, except fields a train has overridden.`
      : 'Not used by any Raid Train Config yet.'}</p>

    <section class="card">
      <h2 class="card-h">Preset settings</h2>
      ${GROUPS.map((g) => renderGroup(g, p, 'p', null)).join('')}
      <div class="hint" style="margin-top:12px">Spotlights are not part of a Preset — standing Spotlights live in <a href="#" data-act="goto-profile">Profile settings</a>, extras on each train's Raid Train Config.</div>
    </section>`;
}

function commitPresetTitleRename(input) {
  const oldName = input.dataset.old;
  const newName = input.value.trim();
  if (!newName || newName === oldName) { input.value = oldName; return; }
  if (P().presets.some((q) => q.name === newName)) {
    toast('A Preset with that name already exists');
    input.value = oldName;
    return;
  }
  const p = presetByName(oldName);
  p.name = newName;
  if (P().defaultPreset === oldName) P().defaultPreset = newName;
  for (const c of Object.values(P().configs)) if (c.preset === oldName) c.preset = newName;
  state.editingPreset = newName;
  input.dataset.old = newName;
  // CRITICAL: this commit patches data WITHOUT a re-render (so an in-flight
  // click still lands). Refresh every element in the editor that carries the
  // old name, or that click acts on a Preset that no longer exists — which is
  // exactly how "Make default" used to orphan the default pointer.
  for (const el of document.querySelectorAll(`#main [data-name="${CSS.escape(oldName)}"]`)) el.dataset.name = newName;
  toast(`Renamed to "${newName}"`);
}

/* ══════════════ Master render ══════════════ */

function render(opts) {
  healDefaultPreset();
  renderTopbar();
  renderSidebar();
  if (state.editing) renderEditor();
  else if (state.editingPreset) renderPresetEditor();
  else if (state.view === 'presets') renderPresets();
  else if (state.view === 'profile') renderProfile();
  else if (state.view === 'manual') renderManual();
  else renderTrains(opts && opts.flashLiveLink);
}

/* ══════════════ Events ══════════════ */

// Sidebar nav
$$('.nav-item').forEach((el) => el.addEventListener('click', () => {
  const nav = el.dataset.nav;
  state.renaming = null;
  state.editingPreset = null;
  if (nav === 'livelink') { state.view = 'trains'; state.editing = null; render({ flashLiveLink: true }); return; }
  state.view = nav;
  state.editing = null;
  render();
}));

// Profile menu
const pbtn = $('#profile-btn'), pmenu = $('#profile-menu');
pbtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = pmenu.classList.toggle('open');
  pbtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => {
  if (!pmenu.contains(e.target)) { pmenu.classList.remove('open'); pbtn.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { pmenu.classList.remove('open'); closeModal(); }
});
function addProfile() {
  const input = $('#profile-add-input');
  const name = input.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!name) return;
  if (!DB.profiles[name]) {
    DB.profiles[name] = {
      color: '#5ed18a', spotlights: [], defaultPreset: 'House Default',
      liveLink: { idle: false, horizon: 'next3' },
      presets: [{ name: 'House Default', ...SETTING_DEFAULTS }],
      configs: {}, events: [],
    };
    DB.order.push(name);
  }
  input.value = '';
  state.profile = name;
  state.editing = null; state.editingPreset = null; state.view = 'trains';
  state.pastOpen = false; state.renaming = null;
  pmenu.classList.remove('open');
  render();
  toast(`Now acting as ${name}`);
}
$('#profile-add-btn').addEventListener('click', addProfile);
$('#profile-add-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') addProfile(); });
$('#profile-menu').addEventListener('click', (e) => {
  const item = e.target.closest('[data-act]');
  if (!item) { e.stopPropagation(); return; }
  if (item.dataset.act === 'switch-profile') {
    state.profile = item.dataset.name;
    state.editing = null; state.editingPreset = null; state.view = 'trains';
    state.pastOpen = false; state.renaming = null;
    pmenu.classList.remove('open');
    render();
    toast(`Now acting as ${state.profile}`);
  } else if (item.dataset.act === 'manage-profile') {
    state.view = 'profile'; state.editing = null; state.editingPreset = null; state.renaming = null;
    pmenu.classList.remove('open');
    render();
  }
});

// Main-content delegation: clicks
$('#main').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'toggle-past') {
    state.pastOpen = !state.pastOpen;
    el.classList.toggle('open', state.pastOpen);
    const list = $('.past-list');
    if (list) list.hidden = !state.pastOpen;
    return;
  }
  if (act === 'refresh') {
    el.classList.add('spin');
    setTimeout(() => { el.classList.remove('spin'); toast('Lineup refreshed from RaidPal'); }, 800);
    return;
  }
  if (act === 'copy-link') { copyText(eventOverlayUrl(el.dataset.slug), 'Overlay link copied'); return; }
  if (act === 'open-config') { state.editing = el.dataset.slug; ensureConfig(state.editing); render(); return; }
  if (act === 'back') { state.editing = null; render(); return; }
  if (act === 'copy-live') { copyText(liveLinkUrl(), 'Live Link copied — paste it into OBS'); return; }
  if (act === 'copy-cfg-url') { copyText(eventOverlayUrl(state.editing), 'Overlay link copied'); return; }
  if (act === 'goto-presets') { e.preventDefault(); state.view = 'presets'; state.editing = null; state.editingPreset = null; render(); return; }
  if (act === 'goto-profile') { e.preventDefault(); state.view = 'profile'; state.editing = null; state.editingPreset = null; render(); return; }

  if (act === 'revert') {
    const cfg = ensureConfig(state.editing);
    delete cfg.overrides[el.dataset.field];
    renderEditor();
    return;
  }
  if (act === 'reset-overrides') {
    ensureConfig(state.editing).overrides = {};
    renderEditor();
    toast('All overrides reset to the Preset');
    return;
  }

  if (act === 'dup-preset') {
    const src = presetByName(el.dataset.name);
    let name = `${src.name} copy`, n = 2;
    while (P().presets.some((p) => p.name === name)) name = `${src.name} copy ${n++}`;
    const copy = { ...src, name };
    P().presets.splice(P().presets.indexOf(src) + 1, 0, copy);
    state.renaming = name;           // straight into rename — dupe+rename is one flow
    renderPresets();
    renderSidebar();
    return;
  }
  if (act === 'edit-preset') {
    if (e.target.id === 'rename-input') return; // inline rename in progress — don't navigate
    state.renaming = null;
    state.editingPreset = el.dataset.name;
    render();
    return;
  }
  if (act === 'back-presets') { state.editingPreset = null; render(); return; }
  if (act === 'make-default') {
    if (!presetByName(el.dataset.name)) { renderPresets(); return; } // stale click — refresh, never dangle
    P().defaultPreset = el.dataset.name;
    renderPresets();
    toast(`"${el.dataset.name}" is now the default Preset`);
    return;
  }
  if (act === 'make-default-editor') {
    if (!presetByName(el.dataset.name)) { render(); return; } // stale click — refresh, never dangle
    P().defaultPreset = el.dataset.name;
    render();
    toast(`"${el.dataset.name}" is now the default Preset`);
    return;
  }
  if (act === 'add-spot') {
    const inp = document.getElementById('spot-input');
    const name = inp.value.trim().replace(/,+/g, '');
    if (!name) return;
    if (!P().spotlights.some((s) => s.toLowerCase() === name.toLowerCase())) P().spotlights.push(name);
    inp.value = '';
    renderProfile();
    document.getElementById('spot-input').focus();
    toast(`"${name}" will glow on every train`);
    return;
  }
  if (act === 'rm-spot') {
    P().spotlights = P().spotlights.filter((s) => s !== el.dataset.name);
    renderProfile();
    return;
  }
  if (act === 'del-preset') {
    const name = el.dataset.name;
    const used = refCount(name);
    const isDefault = name === P().defaultPreset;
    const usedLine = used
      ? `<p><b>${used} Raid Train Config${used === 1 ? '' : 's'}</b> reference${used === 1 ? 's' : ''} this Preset. ${used === 1 ? 'It' : 'They'} will fall back to your default Preset.</p>`
      : '<p>No Raid Train Configs reference this Preset.</p>';
    const defaultLine = isDefault ? '<p><b>This is your default Preset.</b> Another Preset will become the default.</p>' : '';
    openModal(`
      <h3>Delete "${esc(name)}"?</h3>
      ${usedLine}
      ${defaultLine}
      <div class="m-actions">
        <button class="btn" data-mact="cancel">Cancel</button>
        <button class="btn danger-solid" data-mact="confirm-del" data-name="${esc(name)}">Delete Preset</button>
      </div>`);
    return;
  }
  if (act === 'reset-demo') { resetDemo(); return; }
  if (act === 'manual-open') { toast('Out of scope for this prototype'); return; }
});

// Main-content delegation: field edits (input for live feel, change for selects)
function handleFieldEdit(el) {
  if (!state.editing || !el.dataset.field) return;
  const cfg = ensureConfig(state.editing);
  const base = presetByName(cfg.preset) || P().presets[0]; // never crash on a dangling ref
  const f = el.dataset.field;
  const def = DEF_BY_KEY[f];
  const val = def && def.type === 'check' ? el.checked : el.value;
  if (f === 'spotlight') {
    // Pure per-train field — not part of the Preset, so no override machinery.
    cfg.spotlight = val;
  } else if (String(val) === String(base[f])) {
    delete cfg.overrides[f];
  } else {
    cfg.overrides[f] = val;
  }
  refreshEditorChrome();
}
$('#main').addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.field) handleFieldEdit(el);
  if (el.dataset && el.dataset.pfield && state.editingPreset) {
    // Direct edit of the Preset itself — flows to every referencing Raid Train
    // Config that hasn't overridden the field (they read the Preset live).
    const p = presetByName(state.editingPreset);
    const def = DEF_BY_KEY[el.dataset.pfield];
    p[el.dataset.pfield] = def && def.type === 'check' ? el.checked : el.value;
    const out = $(`#p-${el.dataset.pfield}-out`);
    if (out) out.textContent = el.value;
  }
});
$('#main').addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'set-preset') {
    ensureConfig(state.editing).preset = el.value;
    renderEditor();
    return;
  }
  if (el.id === 'll-idle-toggle') {
    P().liveLink.idle = el.checked;
    $('#ll-horizon').classList.toggle('dim', !el.checked);
    $('#ll-url').value = liveLinkUrl();
    toast(el.checked ? 'Idle card on — re-copy your Live Link' : 'Idle card off — re-copy your Live Link');
    return;
  }
  if (el.id === 'll-horizon') {
    P().liveLink.horizon = el.value;
    $('#ll-url').value = liveLinkUrl();
    toast('Horizon updated — re-copy your Live Link');
    return;
  }
  if (el.id === 'default-preset-select') {
    P().defaultPreset = el.value;
    toast(`"${el.value}" is now the default Preset`);
    return;
  }
});

// Rename commit (Enter / blur), via delegation since the input is re-rendered
$('#main').addEventListener('keydown', (e) => {
  if (e.target.id === 'rename-input') {
    if (e.key === 'Enter') commitRename(e.target);
    if (e.key === 'Escape') { state.renaming = null; renderPresets(); }
  }
  if (e.target.id === 'preset-title-input') {
    if (e.key === 'Enter') e.target.blur(); // commit via focusout
    if (e.key === 'Escape') { e.target.value = e.target.dataset.old; e.target.blur(); }
  }
  if (e.target.id === 'spot-input' && e.key === 'Enter') {
    const btn = document.querySelector('[data-act="add-spot"]');
    if (btn) btn.click();
  }
});
$('#main').addEventListener('focusout', (e) => {
  if (e.target.id === 'rename-input' && state.renaming) commitRename(e.target);
  if (e.target.id === 'preset-title-input' && state.editingPreset) commitPresetTitleRename(e.target);
});

// Modal
$('#modal-scrim').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) { closeModal(); return; }
  const el = e.target.closest('[data-mact]');
  if (!el) return;
  if (el.dataset.mact === 'cancel') { closeModal(); return; }
  if (el.dataset.mact === 'confirm-del') {
    const name = el.dataset.name;
    P().presets = P().presets.filter((p) => p.name !== name);
    if (!P().presets.length) P().presets.push({ name: 'House Default', ...SETTING_DEFAULTS });
    if (P().defaultPreset === name) P().defaultPreset = P().presets[0].name;
    for (const c of Object.values(P().configs)) if (c.preset === name) c.preset = P().defaultPreset;
    closeModal();
    renderPresets();
    renderSidebar();
    toast(`Deleted "${name}"`);
  }
});

render();
</script>
</body>
</html>

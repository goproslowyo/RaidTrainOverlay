<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaidTrainOverlay — Configurator</title>
  <!--
    The Configurator: an app shell over the streamer's own RaidPal raid trains.

    A Profile is a bare Twitch login; its My Raid Trains list comes from the
    RaidPal user endpoint (src/my-raid-trains.js, ~6h cache). Each train gets a
    Raid Train Config — a Preset reference plus a sparse per-field override diff
    — and the Live Link folds all of that into ONE URL keyed to the username.

    Everything local lives in this page's own localStorage; the Overlay never
    reads it (the URL is the only thing it consumes). Thin wiring only: the
    settings schema, both editors' form, the train list, the Live Link URL and
    every store are testable modules under src/.

    Direction contract (v2, user-pinned from the "App redesign for simplicity"
    Claude Design project; no seed roll — the direction was chosen by hand):
    THESIS: one app at two ages, not a wizard bolted onto a tool. First visit
      is three stops ending at a working Live Link; every visit after is
      Simple / Everything, and stop 2 IS Simple's look card.
    OWN-WORLD: warm sodium on deep slate (--rt-* tokens, assets/app.css),
      Public Sans + DM Mono, pill controls, checkerboard OBS stages.
    STORY: a streamer arrives knowing only their Twitch name and leaves with
      one URL pasted into OBS that never needs editing again.
    FIRST VIEWPORT: setup = the stop rail over one centred question; home =
      decisions left, Live Link + live preview right, one primary action.
    FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
  -->
  <!-- Tokens only (#34's Q4) — the landing page shares this exact block, so the
       two pages that are meant to look like one product cannot drift apart
       again. Layout stays inline, per page. The palette is the v2 redesign's
       warm sodium system (see assets/app.css). -->
  <link rel="stylesheet" href="./assets/app.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400..700&family=DM+Mono:ital,wght@0,300;0,400;0,500&display=swap">
  <style>
    * { box-sizing: border-box; }
    /* Any class that sets `display` (`.seg`, `.btn`, …) beats the UA's [hidden]
       rule — the same trap as the landing's .stage-ph — so the stage-dependent
       chrome (view seg, stop rail, skip button) needs the override or both
       stages' controls paint at once. */
    [hidden] { display: none !important; }
    /* Dark native controls, scoped to the CONTROLS — not :root — on purpose: a dark
       :root forces the transparent preview iframe to an opaque white backdrop. */
    input, select, textarea { color-scheme: dark; font: inherit; }
    html, body { margin: 0; }
    body {
      /* The same warm sodium haze the landing page opens with — the two pages
         share one token block so they can share one atmosphere. */
      background: radial-gradient(1200px 500px at 70% -200px, #1d1710 0%, transparent 60%), var(--rt-base);
      color: var(--rt-ink);
      font: 15px/1.55 var(--rt-font-ui);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--rt-info); text-decoration: none; }
    a:hover { color: var(--rt-sodium-300); text-decoration: underline; }
    button { font: inherit; cursor: pointer; }
    ::selection { background: var(--rt-sodium-edge); color: var(--rt-ink); }
    input[type=text], input[type=number], select, textarea {
      width: 100%; height: var(--rt-control-h); padding: 0 11px; border-radius: var(--rt-radius-sm);
      border: 1px solid var(--rt-line-strong); background: var(--rt-surface-2); color: var(--rt-ink);
    }
    textarea { height: auto; padding: 9px 11px; }
    input:focus, select:focus, textarea:focus, button:focus-visible, [role=radio]:focus-visible {
      outline: 2px solid var(--rt-focus); outline-offset: 2px;
    }
    input[type=range] { width: 100%; accent-color: var(--rt-accent); height: 24px; padding: 0; border: 0; background: transparent; }
    input:disabled, select:disabled { cursor: not-allowed; opacity: .5; }

    /* ── Primitives (shared with the prototype's vocabulary) ──────────── */
    .mono { font-family: var(--rt-font-mono); }
    .eyebrow {
      font: 700 11.5px/1 var(--rt-font-ui); letter-spacing: .09em; text-transform: uppercase;
      color: var(--rt-sodium-300);
    }
    .t1 { font: 700 26px/1.18 var(--rt-font-ui); letter-spacing: -.6px; margin: 0; }
    .dim { color: var(--rt-ink-2); }
    .faint { color: var(--rt-ink-3); }
    .sm { font-size: 13.5px; line-height: 1.5; }
    .cap { font-size: 12.5px; line-height: 1.45; }

    .okdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rt-ok); box-shadow: 0 0 8px var(--rt-ok); flex: none; }
    .finishnote b svg, #toast .ok svg, .p-check svg, .ok-ic svg, .chip-default svg { vertical-align: -2px; }

    /* ── Top bar ──────────────────────────────────────────────────────── */
    .top {
      display: flex; align-items: center; gap: 16px;
      padding: 13px 26px; border-bottom: 1px solid var(--rt-line);
      background: var(--rt-surface);
      position: sticky; top: 0; z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand h1 { font: 700 16px/1 var(--rt-font-ui); letter-spacing: -.35px; margin: 0; white-space: nowrap; }
    .brand h1 .a { color: var(--rt-sodium-500); }
    .brand-train { display: flex; align-items: flex-end; gap: 3px; }
    .brand-train i { display: block; width: 13px; height: 9px; border-radius: 2px; border: 1px solid rgba(0, 0, 0, .45); }
    .brand-train i:nth-child(1) { width: 16px; height: 12px; background: #C96A12; border-color: var(--rt-sodium-300); }
    .brand-train i:nth-child(2) { background: #1E3A5F; }
    .brand-train i:nth-child(3) { background: #4A2B6B; }
    /* Setup-stage meta: which stop, spelled out. */
    .top-meta {
      margin-left: auto; font: 500 12px/1.3 var(--rt-font-mono); letter-spacing: .14em;
      text-transform: uppercase; color: var(--rt-ink-3); text-align: right;
    }

    /* Segmented control (Simple / Everything). */
    .seg {
      display: inline-flex; padding: 3px; gap: 3px; border-radius: var(--rt-radius-sm);
      background: var(--rt-well); border: 1px solid var(--rt-line);
    }
    .seg button {
      height: 30px; padding: 0 14px; border: 0; border-radius: 5px; background: transparent;
      color: var(--rt-ink-2); font: 600 13px/1 var(--rt-font-ui);
    }
    .seg button[aria-pressed=true] { background: var(--rt-accent); color: var(--rt-on-accent); font-weight: 700; }
    .seg.wide { display: flex; }
    .seg.wide button { flex: 1; }

    /* ── Profile switcher ─────────────────────────────────────────────── */
    /* min-width:0 is load-bearing, not tidiness. A flex item won't shrink below
       its min-content width by default, and a Twitch login is one unbreakable
       word — so a 25-char login made the pill an immovable 200px and shoved the
       whole top bar off a phone screen. The pill gives way instead; the name
       ellipsises and the avatar (which carries the initial) never shrinks.
       The button's max-width:100% below is load-bearing too — a button is
       shrink-to-fit and will happily size past a flex-shrunk wrapper. */
    .profile-wrap { position: relative; min-width: 0; }
    .top > .profile-wrap { margin-left: auto; }
    .top .top-meta + .profile-wrap, .top .seg ~ .profile-wrap { margin-left: 0; }
    .profile-btn {
      display: flex; align-items: center; gap: 9px; max-width: 100%; height: var(--rt-control-h);
      background: var(--rt-surface-2); border: 1px solid var(--rt-line); border-radius: var(--rt-radius-pill);
      color: var(--rt-ink); padding: 0 13px 0 5px; font: 600 13px/1 var(--rt-font-ui); transition: border-color .15s;
    }
    .profile-btn:hover { border-color: var(--rt-line-strong); }
    .profile-btn .pb-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      font: 800 12px/1 var(--rt-font-ui); color: #FFE7C6;
      background: linear-gradient(140deg, var(--rt-sodium-600), var(--rt-sodium-700));
    }
    .profile-btn .chev { color: var(--rt-ink-3); font-size: 11px; flex: none; }
    .profile-menu {
      position: absolute; right: 0; top: calc(100% + 8px); width: 320px; z-index: 60;
      background: var(--rt-surface); border: 1px solid var(--rt-line); border-radius: var(--rt-radius-lg);
      box-shadow: var(--rt-shadow-md); padding: 8px; display: none;
    }
    .profile-menu.open { display: block; animation: pop .14s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
    .menu-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--rt-ink-3); padding: 6px 10px 4px; font-weight: 700;
    }
    .profile-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: 0; border-radius: var(--rt-radius-sm); padding: 8px 10px; color: var(--rt-ink); text-align: left;
    }
    .profile-item:hover { background: var(--rt-surface-2); }
    .profile-item .p-name { font-weight: 700; }
    .profile-item .p-sub { display: block; color: var(--rt-ink-2); font-size: 12px; font-weight: 400; }
    .profile-item .p-check { margin-left: auto; color: var(--rt-ok); font-weight: 700; }
    .profile-add { display: flex; gap: 6px; padding: 8px 6px 4px; border-top: 1px solid var(--rt-line); margin-top: 6px; }
    .profile-add input { flex: 1; height: 32px; font-size: 13px; }
    .profile-add button {
      padding: 0 12px; border-radius: var(--rt-radius-sm); border: 1px solid var(--rt-line-strong);
      background: var(--rt-surface-2); color: var(--rt-ink); font-weight: 600; white-space: nowrap;
    }
    .profile-add button:hover { border-color: var(--rt-ink-3); }
    .profile-hint { color: var(--rt-ink-3); font-size: 11.5px; padding: 4px 10px 6px; }
    .p-manage { border-top: 1px solid var(--rt-line); margin-top: 6px; }
    .p-gear { width: 26px; text-align: center; color: var(--rt-ink-3); font-size: 15px; flex: none; }

    /* ── The setup journey's stop rail (Variant D, first visit) ───────── */
    .stops { display: flex; padding: 0 26px; border-bottom: 1px solid var(--rt-line); background: var(--rt-surface); }
    .stop {
      flex: 1; display: flex; align-items: center; gap: 12px; padding: 15px 0; background: transparent; border: 0;
      border-bottom: 2px solid transparent; margin-bottom: -1px; color: inherit; text-align: left;
    }
    .stop .num {
      width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
      background: var(--rt-surface-2); border: 1px solid var(--rt-line); color: var(--rt-ink-3);
      font: 800 13px/1 var(--rt-font-ui);
    }
    .stop .tt { display: grid; gap: 1px; min-width: 0; }
    .stop .tt b { font: 600 14px/1.2 var(--rt-font-ui); color: var(--rt-ink-2); }
    .stop .tt span { font: 500 12px/1.2 var(--rt-font-mono); color: var(--rt-ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stop.done .num { background: var(--rt-ok-tint); border-color: var(--rt-ok-edge); color: var(--rt-ok); }
    .stop.here { border-bottom-color: var(--rt-accent); }
    .stop.here .num { background: var(--rt-accent); border-color: var(--rt-accent); color: var(--rt-on-accent); }
    .stop.here .tt b { color: var(--rt-ink); font-weight: 700; }
    .stop.here .tt span { color: var(--rt-sodium-300); }

    /* The graduation ribbon — shown once, the moment setup lands on home. */
    .landed { padding: 12px var(--rt-gutter); background: var(--rt-ok-tint); border-bottom: 1px solid var(--rt-ok-edge); }
    .landed-inner { max-width: var(--rt-shell-max); margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .landed-inner .ok-ic { color: var(--rt-ok); display: flex; }

    /* ── Shell ────────────────────────────────────────────────────────── */
    .shell { display: flex; gap: 26px; max-width: var(--rt-shell-max); margin: 0 auto; padding: 26px var(--rt-gutter) 60px; }
    .side { width: var(--rt-side-width); flex: none; position: sticky; top: 84px; align-self: flex-start; }
    .shell.no-side .side { display: none; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: 1px solid transparent; border-radius: var(--rt-radius-sm);
      padding: 9px 12px; color: var(--rt-ink-2); font: 600 13.5px/1.2 var(--rt-font-ui); text-align: left;
    }
    .nav-item:hover { color: var(--rt-ink); background: var(--rt-surface-2); }
    .nav-item.active { color: var(--rt-ink); background: var(--rt-surface-2); border-color: var(--rt-line); }
    .nav-item .n-count {
      margin-left: auto; font: 400 11px/18px var(--rt-font-mono); color: var(--rt-ink-3);
      background: var(--rt-well); border: 1px solid var(--rt-line); border-radius: var(--rt-radius-pill); padding: 0 8px;
    }
    .nav-item .n-gold { color: var(--rt-sodium-300); }
    .side hr { border: 0; border-top: 1px solid var(--rt-line); margin: 12px 0; }
    .nav-item.secondary { font-size: 13px; }
    .side .side-note { color: var(--rt-ink-3); font-size: 11.5px; padding: 10px 12px 0; line-height: 1.5; }

    main { flex: 1; min-width: 0; }
    .view-title { font-size: 20px; margin: 2px 0 4px; letter-spacing: -.4px; font-weight: 700; }
    .view-sub { color: var(--rt-ink-2); margin: 0 0 18px; font-size: 14px; }
    .view-sub b { color: var(--rt-ink); font-weight: 600; }

    .card {
      background: var(--rt-surface); border: 1px solid var(--rt-line); border-radius: var(--rt-radius-lg);
      padding: 18px 20px; margin-bottom: 16px; min-width: 0;
    }
    h2.card-h {
      font: 700 12.5px/1.3 var(--rt-font-ui); text-transform: uppercase; letter-spacing: .07em;
      color: var(--rt-sodium-300); margin: 0 0 12px;
    }
    .hint { color: var(--rt-ink-2); font-size: 13px; margin-top: 5px; }
    .hint a, .view-sub a, .ll-meta a { color: var(--rt-info); }
    .empty { color: var(--rt-ink-2); text-align: center; padding: 30px 0; font-size: 14px; }
    .meta-warn { color: var(--rt-warn); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: var(--rt-control-h); padding: 0 15px; border-radius: var(--rt-radius-sm);
      border: 1px solid var(--rt-line-strong); background: var(--rt-surface-2); color: var(--rt-ink);
      font: 600 13.5px/1 var(--rt-font-ui); white-space: nowrap; transition: .14s;
    }
    .btn:hover:not(:disabled) { background: var(--rt-surface-3); border-color: var(--rt-ink-3); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.primary, .btn.gold {
      background: var(--rt-accent); border-color: var(--rt-accent); color: var(--rt-on-accent);
      font-weight: 700; box-shadow: var(--rt-glow-sodium);
    }
    .btn.primary:hover:not(:disabled), .btn.gold:hover:not(:disabled) { background: var(--rt-accent-hover); border-color: var(--rt-accent-hover); }
    .btn.sm { height: var(--rt-control-h-sm); padding: 0 11px; font-size: 12.5px; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--rt-ink-2); }
    .btn.ghost:hover:not(:disabled) { background: var(--rt-surface-2); color: var(--rt-ink); border-color: transparent; }
    /* A done action, not an available one — reads as confirmation, not invitation. */
    .btn.okbtn { background: var(--rt-ok-tint); border-color: var(--rt-ok-edge); color: var(--rt-ok); }
    .btn.okbtn:hover:not(:disabled) { background: var(--rt-ok-tint); border-color: var(--rt-ok); }
    .icon-btn {
      width: 30px; height: 30px; border-radius: var(--rt-radius-sm); border: 1px solid var(--rt-line);
      background: var(--rt-surface-2); color: var(--rt-ink-2); font-size: 15px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; flex: none;
    }
    .icon-btn:hover { color: var(--rt-ink); border-color: var(--rt-line-strong); }
    .icon-btn.accent { color: var(--rt-sodium-300); border-color: var(--rt-accent-edge); background: var(--rt-accent-tint); }
    .icon-btn.destructive { color: var(--rt-danger); border-color: var(--rt-danger-edge); }
    .icon-btn.destructive:hover { background: var(--rt-danger-tint); }
    .icon-btn svg { display: block; }
    .icon-btn.spin { animation: spin .8s linear infinite; color: var(--rt-accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back-link {
      display: inline-flex; align-items: center; gap: 7px; background: none; border: 0;
      color: var(--rt-ink-2); font-weight: 600; font-size: 13.5px; padding: 0; margin-bottom: 12px;
    }
    .back-link:hover { color: var(--rt-sodium-300); }

    /* ── Live Link hero ───────────────────────────────────────────────── */
    .live-link {
      border-color: var(--rt-accent-edge);
      background:
        radial-gradient(520px 180px at 12% -40%, var(--rt-sodium-tint), transparent 70%),
        var(--rt-surface);
      box-shadow: var(--rt-glow-sodium);
      position: relative;
    }
    .ll-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .ll-head h2 { font: 700 19px/1.25 var(--rt-font-ui); letter-spacing: -.3px; margin: 0; }
    .ll-badge {
      font-size: 10.5px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
      color: var(--rt-ink-2); border: 1px solid var(--rt-line); background: var(--rt-surface-3);
      border-radius: var(--rt-radius-pill); padding: 2px 9px;
    }
    .ll-sub { color: var(--rt-ink-2); font-size: 13.5px; margin: 0 0 14px; }
    .ll-sub b { color: var(--rt-ink); font-weight: 600; }
    .url-row { display: flex; gap: 8px; min-width: 0; }
    .url-row input {
      flex: 1; min-width: 0; font-family: var(--rt-font-mono);
      font-size: 12.5px; background: var(--rt-well); border-color: var(--rt-sodium-edge); color: var(--rt-sodium-300); padding: 0 12px;
    }
    .url-row .btn { padding-left: 18px; padding-right: 18px; }
    /* The re-copy rule (`configurator.llWarn`): settings ARE the URL, so it
       gets a visible row, not a footnote. */
    .ll-note {
      display: flex; gap: 9px; align-items: flex-start; color: var(--rt-ink-2); font-size: 12.5px;
      margin-top: 11px; padding: 9px 11px; border-radius: var(--rt-radius-sm);
      background: var(--rt-warn-tint); border: 1px solid var(--rt-warn-edge);
    }
    .ll-note .w { color: var(--rt-warn); flex: none; line-height: 1.2; }
    /* The blob is over the cap — this link's per-train settings are already
       broken, so it outranks the standard re-paste note beneath it. */
    .ll-note.bad {
      color: var(--rt-ink); border-color: var(--rt-danger-edge); background: var(--rt-danger-tint);
    }
    .ll-note.bad .w { color: var(--rt-danger); }
    .ll-idle { margin-top: 13px; padding-top: 6px; border-top: 1px dashed var(--rt-line); }
    .ll-meta { color: var(--rt-ink-2); font-size: 12.5px; margin-top: 10px; }

    /* ── The idle-card fields (shared by Simple and the Live Link card) ── */
    .sfield { display: grid; gap: 7px; padding: 13px 0; border-bottom: 1px solid var(--rt-line); }
    .sfield:last-child { border-bottom: 0; padding-bottom: 4px; }
    .sfield .flabel { display: flex; align-items: center; gap: 9px; font: 600 13.5px/1.2 var(--rt-font-ui); }
    /* Helper copy is small (12.5px), so it reads in ink-2 — ink-3 sits under
       the 4.5:1 contrast floor at this size and is reserved for large or
       non-essential marks (stage labels, swatch subtitles). */
    .sfield .fhint { font-size: 12.5px; line-height: 1.45; color: var(--rt-ink-2); }
    .sfield .fhint b { color: var(--rt-ink); }
    .check { display: flex; align-items: center; gap: 9px; font-size: 13.5px; cursor: pointer; }
    .check input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--rt-accent); }
    .rangerow { display: flex; align-items: center; gap: 12px; }
    .rangerow output {
      flex: none; min-width: 46px; text-align: center; font-family: var(--rt-font-mono); font-size: 12.5px;
      color: var(--rt-sodium-300); background: var(--rt-well); border: 1px solid var(--rt-line);
      border-radius: var(--rt-radius-xs); padding: 4px 0;
    }
    /* A number set inside a sentence, so the sentence stays readable. */
    .inlinenum {
      width: 58px !important; height: 28px; padding: 0 6px; text-align: center;
      border-radius: var(--rt-radius-xs); border: 1px solid var(--rt-line-strong);
      background: var(--rt-well); color: var(--rt-sodium-300);
      font-family: var(--rt-font-mono); font-size: 13px;
    }
    .inlinenum:disabled { opacity: .45; color: var(--rt-ink-3); }

    /* The position picker: a 3×3 map of the scene — the one layout where the
       control looks like the thing it controls. */
    .posrow { display: flex; align-items: center; gap: 14px; margin-top: 2px; }
    .posgrid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; flex: none; padding: 4px;
      border: 1px solid var(--rt-line); border-radius: var(--rt-radius-sm); background: var(--rt-well);
      aspect-ratio: 16/9; width: 86px;
    }
    .posdot {
      border: 1px solid transparent; border-radius: 3px; background: var(--rt-surface-2); padding: 0;
      display: grid; place-items: center; transition: .12s;
    }
    .posdot::after { content: ""; width: 5px; height: 5px; border-radius: 1px; background: var(--rt-ink-3); }
    .posdot:hover:not(:disabled) { background: var(--rt-surface-3); }
    .posdot[aria-checked=true] { background: var(--rt-accent-tint); border-color: var(--rt-accent); }
    .posdot[aria-checked=true]::after { background: var(--rt-accent); width: 9px; height: 6px; box-shadow: var(--rt-glow-sodium); }
    .posdot:disabled { opacity: .4; }

    /* ── The idle-state mock preview (checkerboard = OBS transparency) ── */
    .pf { position: relative; border: 1px solid var(--rt-line); border-radius: var(--rt-radius-lg); overflow: hidden; background: var(--rt-well); min-width: 0; }
    .pf .stage {
      position: relative; height: 240px;
      background-color: #0E0F12;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.028) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.028) 75%),
        linear-gradient(45deg, rgba(255,255,255,.028) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.028) 75%);
      background-size: 22px 22px; background-position: 0 0, 11px 11px;
    }
    /* The idle preview's stage plays a stand-in STREAM SCENE rather than the
       transparency checkerboard: the card's whole point between trains is how
       it sits over a scene, and near-black-on-checkerboard makes the opacity
       and blur controls read as broken (nothing visibly changes). Soft glows +
       a faint grid give the card edges and light to be translucent against. */
    .pf .stage.scene {
      height: 280px;
      /* The `background` SHORTHAND on purpose: the base .stage rule tiles its
         checkerboard at 22px, and inherited background-size would tile these
         big radials into thousands of bright cells (a washed-out grid). The
         shorthand resets size/position for every layer. */
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 44px),
        radial-gradient(260px 170px at 82% 26%, rgba(127, 182, 255, .13), transparent 70%),
        radial-gradient(460px 280px at 20% 80%, rgba(167, 139, 250, .09), transparent 70%),
        radial-gradient(320px 210px at 55% 40%, rgba(255, 157, 46, .06), transparent 70%),
        linear-gradient(160deg, #1A2231 0%, #131A26 45%, #0E1420 100%) #10161F;
    }
    .pf .pf-cap { padding: 8px 12px; border-top: 1px solid var(--rt-line); color: var(--rt-ink-3); font-size: 11.5px; display: flex; gap: 8px; align-items: center; }
    .pf .stagelabel {
      position: absolute; top: 9px; left: 11px; font: 500 10px/1 var(--rt-font-mono); letter-spacing: .14em;
      text-transform: uppercase; color: var(--rt-ink-3);
    }
    /* The mock idle card itself — the same skin the Overlay paints. */
    .up {
      border: 1px solid rgba(255, 255, 255, .09); border-radius: 9px; padding: 9px 11px;
      background: rgba(9, 12, 17, var(--upop, .88)); backdrop-filter: blur(8px); color: #EDF1F7;
      box-shadow: 0 6px 22px rgba(0, 0, 0, .45); min-width: 210px;
      /* Never wider than the anchor allows — a long train name ellipsises
         inside the card (see .row .nm), it must not stretch the card. */
      max-width: 100%;
    }
    .up .uphead { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; margin-bottom: 5px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
    .up .lbl { font: 700 8.5px/1 var(--rt-font-mono); letter-spacing: .2em; text-transform: uppercase; color: #FFC578; }
    .up .upcount { margin-left: auto; font: 500 8.5px/1 var(--rt-font-mono); color: #71808F; letter-spacing: .06em; }
    .up .uprows { display: grid; gap: 1px; }
    .up .row { display: flex; align-items: baseline; gap: 9px; font-size: 11.5px; padding: 2.5px 0; }
    .up .row.enter { animation: rowin .62s cubic-bezier(.22, .61, .36, 1) both; }
    @keyframes rowin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .up .row .tm { font-family: var(--rt-font-mono); color: #FFC578; font-size: 10.5px; flex: none; min-width: 56px; }
    /* flex:1 + min-width:0 is what makes the ellipsis real: a flex item's
       min-width defaults to its content, so without it a long name refuses to
       shrink and bursts the card instead of truncating. */
    .up .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* One-line variant: a real marquee, duplicated so the loop has no seam.
       Sized to take most of the scene's width — a ticker squeezed into a
       sliver shows one word at a time and reads as broken. */
    .up.ticker { display: flex; align-items: center; gap: 11px; border-radius: 999px; padding: 8px 16px; flex: 1 1 auto; min-width: 0; }
    .up.ticker .lbl { flex: none; }
    .tickwrap { overflow: hidden; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent); }
    .tickrun { display: inline-flex; white-space: nowrap; animation: tickmarquee var(--tickdur, 34s) linear infinite; }
    /* The gap lives inside each lap (plus a matching trailing pad), never on
       .tickrun — a gap astride the -50% point would jump the loop half a gap. */
    .ticklap { display: inline-flex; gap: 10px; align-items: baseline; padding-right: 10px; }
    .tickrun .tick { display: inline-flex; align-items: baseline; gap: 7px; font-size: 12.5px; }
    .tickrun .tick .tm { font-family: var(--rt-font-mono); color: #FFC578; font-size: 11px; }
    .tickrun .tsep { color: #4C5A6B; }
    @keyframes tickmarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .tickrun { animation: none; } .up .row.enter { animation: none; } }

    /* ── Event cards ──────────────────────────────────────────────────── */
    .event-card { display: flex; align-items: flex-start; gap: 16px; padding: 15px 18px; }
    .event-main { flex: 1; min-width: 0; }
    .event-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .event-title { font-size: 15.5px; font-weight: 700; letter-spacing: -.2px; }
    .event-meta { color: var(--rt-ink-2); font-size: 13px; margin-top: 2px; }
    .event-meta b { color: var(--rt-ink); font-weight: 600; }

    .chip-live {

    .chip-org {

    .mini-train .mt-c { width: 13px; height: 10px; border-radius: 2px; border: 1px solid rgba(0, 0, 0, .4); background: var(--car-bg, #1e3a5f); }
    .mini-train .mt-c[style*="--car:1"] { --car-bg: #5b2a78; }
    .mini-train .mt-c[style*="--car:2"] { --car-bg: #14361f; }
    .mini-train .mt-c[style*="--car:3"] { --car-bg: #6b3d12; }
    .mini-train .mt-c[style*="--car:4"] { --car-bg: #3d1f42; }
    .mini-train .mt-c[style*="--car:5"] { --car-bg: #173a3a; }
    .mini-train .mt-c.open { background: transparent; border: 1px dashed var(--rt-line-strong); }
    .mini-train .mt-more { color: var(--rt-ink-3); font-size: 10.5px; padding-left: 3px; align-self: center; }

    .past-divider {
      display: flex; align-items: center; gap: 14px; width: 100%;
      background: none; border: 0; color: var(--rt-ink-2); font-size: 13px; font-weight: 600;
      padding: 10px 4px; margin: 4px 0;
    }
    .past-divider::before, .past-divider::after { content: ""; flex: 1; border-top: 2px dashed var(--rt-line); }
    .past-divider:hover { color: var(--rt-ink); }

    .past-divider.open .pd-chev { transform: rotate(180deg); }

    .stamp {
      font-size: 9.5px; font-weight: 800; letter-spacing: .14em; color: var(--rt-ink-2);
      border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 7px;
      transform: rotate(-5deg); user-select: none;

    /* ── Preview ──────────────────────────────────────────────────────── */
    .preview-frame {
      width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--rt-line); border-radius: var(--rt-radius-md);
      overflow: hidden; position: relative; background-color: #0E0F12;
      /* Checkerboard = "this is transparent" (what OBS composites over your scene). */
      background-image:
        linear-gradient(45deg, #191d24 25%, transparent 25%, transparent 75%, #191d24 75%),
        linear-gradient(45deg, #191d24 25%, transparent 25%, transparent 75%, #191d24 75%);
      background-size: 28px 28px; background-position: 0 0, 14px 14px;
    }
    .preview-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .preview-placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; color: var(--rt-ink-2); font-size: 15px;

      font-weight: 600; backdrop-filter: blur(3px);

    .preview-btn.is-rolling { background: var(--rt-accent); color: var(--rt-on-accent); border-color: var(--rt-accent); }
    .preview-caption { color: var(--rt-ink-2); font-size: 13px; margin: 8px 2px 0; min-height: 18px; }

    /* ── Settings form (src/settings-form.js) ─────────────────────────── */
    details.fgroup { border: 1px solid var(--rt-line); border-radius: var(--rt-radius-md); margin-bottom: 10px; background: var(--rt-surface); overflow: hidden; }
    details.fgroup:last-of-type { margin-bottom: 0; }
    details.fgroup summary {
      display: flex; align-items: center; gap: 10px; list-style: none; cursor: pointer;
      padding: 12px 14px; user-select: none;
    }
    details.fgroup summary::-webkit-details-marker { display: none; }
    .g-label { font: 700 12px/1.2 var(--rt-font-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--rt-sodium-300); }
    details.fgroup summary:hover .g-label { color: var(--rt-ink); }
    .g-ovr {
      font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      color: var(--rt-override); border: 1px solid var(--rt-override-edge); background: var(--rt-override-tint);
      border-radius: var(--rt-radius-pill); padding: 1px 8px;
    }
    .g-ovr:empty { display: none; }
    .g-chev { margin-left: auto; color: var(--rt-ink-3); font-size: 11px; transition: transform .15s; }
    details.fgroup[open] .g-chev { transform: rotate(180deg); }
    .fgroup-body { padding: 6px 14px 14px; border-top: 1px solid var(--rt-line); }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .field-head { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; min-height: 24px; }
    .field-head label { font-weight: 600; }
    .ovr-slot { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
    .ovr-badge {
      font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
      color: var(--rt-override); border: 1px solid var(--rt-override-edge); background: var(--rt-override-tint);
      border-radius: var(--rt-radius-pill); padding: 2px 9px; animation: pop .15s ease;
    }
    .ovr-revert {
      width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--rt-override-edge);
      background: transparent; color: var(--rt-override); font-size: 13px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ovr-revert:hover { background: var(--rt-override-tint); }
    .range-row { display: flex; align-items: center; gap: 12px; }
    .range-out { min-width: 3ch; text-align: right; color: var(--rt-sodium-300); font-variant-numeric: tabular-nums; font-weight: 700; font-family: var(--rt-font-mono); font-size: 13px; }
    .check-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
    .check-row input { width: 17px; height: 17px; accent-color: var(--rt-accent); flex: none; }

    .preset-ref { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .preset-ref select { width: 260px; }
    .preset-ref .lbl { font-weight: 700; font-size: 14px; }
    .editor-head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 2px; }
    .editor-head-row h2 { font-size: 19px; margin: 0; letter-spacing: -.3px; }
    .cfg-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .cfg-toolbar .reset-all {
      margin-left: auto; background: none; border: 0; color: var(--rt-override); font-size: 13px; font-weight: 600; padding: 0;
    }
    .cfg-toolbar .reset-all:hover { text-decoration: underline; }
    .spot-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; align-items: center; }
    .spot-chip {
      font-size: 12px; color: var(--rt-ink-2); border: 1px solid var(--rt-line);
      background: var(--rt-well); border-radius: var(--rt-radius-pill); padding: 2.5px 11px;
    }
    .spot-chip b { color: var(--rt-sodium-300); font-weight: 600; }

    /* ── Preset library ───────────────────────────────────────────────── */
    .preset-row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; }
    .preset-info { flex: 1; min-width: 0; cursor: pointer; }
    .preset-info:hover .preset-name { color: var(--rt-sodium-300); }
    .preset-name-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .preset-name { font-size: 15px; font-weight: 700; }
    .preset-name-row input { width: 230px; height: 32px; font-size: 14px; font-weight: 700; }
    .chip-default {
      font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
      color: var(--rt-sodium-300); border: 1px solid var(--rt-accent-edge); background: var(--rt-accent-tint);
      border-radius: var(--rt-radius-pill); padding: 1.5px 9px;
    }
    .preset-sum { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .sum-chip {
      font-size: 11.5px; color: var(--rt-ink-2); border: 1px solid var(--rt-line);
      background: var(--rt-well); border-radius: var(--rt-radius-pill); padding: 1.5px 10px;
    }
    .preset-used { color: var(--rt-ink-3); font-size: 12px; margin-top: 6px; }
    .preset-used b { color: var(--rt-sodium-300); font-weight: 600; }

    .star-btn { color: var(--rt-ink-3); font-size: 16px; }
    .star-btn.on { color: var(--rt-sodium-500); border-color: var(--rt-accent-edge); }

      width: auto !important; min-width: 200px; max-width: 420px; height: 38px;

      padding: 0 9px; margin-left: -9px; color: var(--rt-ink);
    }

    /* ── Profile settings ─────────────────────────────────────────────── */
    .spot-edit-list { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }

    }

      color: var(--rt-ink-2); font-size: 10px; line-height: 1;

    /* ── One-off link view ────────────────────────────────────────────── */
    .source-toggle { display: inline-flex; border: 1px solid var(--rt-line); border-radius: var(--rt-radius-sm); overflow: hidden; margin-bottom: 14px; }
    .src-btn { border: 0; border-radius: 0; background: var(--rt-surface-2); color: var(--rt-ink-2); font-weight: 600; padding: 8px 16px; }
    .src-btn + .src-btn { border-left: 1px solid var(--rt-line); }
    .src-btn.active { background: var(--rt-accent); color: var(--rt-on-accent); }
    .status-dot { font-size: 13px; margin-top: 4px; min-height: 18px; }
    .status-dot.ok { color: var(--rt-ok); }
    .status-dot.bad { color: var(--rt-danger); }
    .status-dot.checking { color: var(--rt-ink-2); }
    ol.obs { padding-left: 20px; margin: 0; }
    ol.obs li { margin-bottom: 8px; }
    code { background: var(--rt-surface-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: var(--rt-font-mono); }

    /* ── The setup journey + Simple view layouts ──────────────────────── */
    /* Content + its sticky reference rail. minmax(0,1fr) constrains the TRACK;
       the ITEM still defaults to min-width:auto and will happily overflow it.
       Both halves are needed — the Live Link is one long unbreakable word.
       Rail widths are modifier CLASSES, never inline styles — an inline
       grid-template-columns would beat the phone media query below. */
    .split { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 26px; align-items: start; }
    .split.narrow { grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; }
    .split.wide { grid-template-columns: minmax(0, 1fr) 400px; }
    .split.tight { grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; }
    .split > * { min-width: 0; }
    /* A single-column grid stack: the default `auto` track sizes to its widest
       child's min-content, so an unconstrained stack re-introduces the same
       overflow one level down. Every vertical stack in a split column uses this. */
    .stack { display: grid; gap: 18px; align-content: start; grid-template-columns: minmax(0, 1fr); }
    .railcol { display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); align-content: start; }
    .railcol.sticky { position: sticky; top: 92px; }
    /* Two nowrap buttons in a row will always beat a narrow column. Let them wrap. */
    .navrow { display: flex; gap: 10px; flex-wrap: wrap; }
    .navrow .btn { white-space: normal; text-align: left; }
    .navrow .btn.push { margin-left: auto; }
    .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
    .duo > * { min-width: 0; }
    .setup-narrow { max-width: 620px; margin: 40px auto; display: grid; gap: 20px; }

    /* Theme picker. A `1fr` track still refuses to go below its content
       min-content width, so a long theme subtitle silently widens the whole
       column: minmax(0,1fr) plus min-width:0 on the tile is the fix. */
    .themes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .themeb { min-width: 0; display: grid; gap: 6px; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
    .themeb .nm, .themeb .subm { min-width: 0; overflow-wrap: anywhere; }
    .themeb .sw {
      position: relative; height: 52px; border-radius: var(--rt-radius-sm); border: 1px solid var(--rt-line);
      display: flex; align-items: flex-end; padding: 6px; gap: 3px; overflow: hidden; transition: .14s;
    }
    .themeb:hover .sw { border-color: var(--rt-line-strong); }
    .themeb[aria-pressed=true] .sw { border: 2px solid var(--rt-accent); box-shadow: var(--rt-glow-sodium); }
    .themeb .sw .tick {
      position: absolute; top: 5px; right: 5px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--rt-accent); color: var(--rt-on-accent); display: grid; place-items: center;
    }
    .themeb .nm { font: 650 11.5px/1.2 var(--rt-font-ui); }
    .themeb .subm { font: 400 10.5px/1.2 var(--rt-font-ui); color: var(--rt-ink-3); }

    /* Radio cards (the Pass / Marquee decision). */
    .radio {
      cursor: pointer; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; width: 100%; text-align: left;
      border-radius: var(--rt-radius-md); border: 1px solid var(--rt-line); background: var(--rt-surface-2); color: inherit;
    }
    .radio .mark { width: 16px; height: 16px; flex: none; margin-top: 2px; border-radius: 50%; border: 1px solid var(--rt-line-strong); background: var(--rt-surface); }
    .radio[aria-checked=true] { border-color: var(--rt-accent-edge); background: var(--rt-accent-tint); }
    .radio[aria-checked=true] .mark { border: 5px solid var(--rt-accent); background: var(--rt-on-accent); }

    /* Option 1d — the OBS handoff, four illustrated steps. */
    .obsv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .obsv .shot { height: 66px; border: 1px solid var(--rt-line); border-radius: 8px; background: var(--rt-well); padding: 6px; }
    .obsv .k { font: 500 10.5px/1 var(--rt-font-mono); letter-spacing: .1em; color: var(--rt-sodium-300); }
    .obsv .cp { font-size: 12.5px; line-height: 1.45; color: var(--rt-ink-2); }
    .obsv b { color: var(--rt-ink); font-weight: 650; }
    .obsv .bar { height: 7px; border-radius: 2px; background: var(--rt-surface-3); }

    /* The end of stop 3's reading column. Always visible and always clickable —
       the point of the copy state is to say which action is NEXT, never to hide
       the way out. It only gains emphasis once the link has been copied. */
    .finishbar {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 15px 18px; border-radius: var(--rt-radius-lg);
      border: 1px solid var(--rt-line); background: var(--rt-surface);
      transition: border-color .2s, background .2s;
    }
    .finishbar.ready { border-color: var(--rt-ok-edge); background: linear-gradient(180deg, var(--rt-ok-tint), transparent 70%), var(--rt-surface); }
    .finishnote { flex: 1; min-width: 220px; font-size: 13.5px; line-height: 1.5; }
    .finishnote b { color: var(--rt-ok); }

    /* ── Toast + modal ────────────────────────────────────────────────── */
    #toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: var(--rt-surface-3); border: 1px solid var(--rt-line-strong); color: var(--rt-ink);
      border-radius: var(--rt-radius-pill); padding: 9px 20px; font-size: 14px; font-weight: 600;
      box-shadow: var(--rt-shadow-md); opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 90;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast .ok { color: var(--rt-ok); margin-right: 6px; }
    #modal-scrim {
      position: fixed; inset: 0; background: rgba(0, 0, 0, .6); backdrop-filter: blur(2px);
      display: none; align-items: center; justify-content: center; z-index: 80;
    }
    #modal-scrim.open { display: flex; }
    .modal {
      background: var(--rt-surface); border: 1px solid var(--rt-line); border-radius: var(--rt-radius-lg);
      width: 460px; max-width: calc(100vw - 40px); padding: 20px 22px; box-shadow: var(--rt-shadow-lg);
    }
    .modal h3 { margin: 0 0 8px; font-size: 16px; }
    .modal p { margin: 0 0 6px; color: var(--rt-ink-2); font-size: 14px; }
    .modal p b { color: var(--rt-warn); }
    .modal .m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn.danger-solid { background: var(--rt-danger-tint); border-color: var(--rt-danger-edge); color: var(--rt-danger); }
    .btn.danger-solid:hover:not(:disabled) { background: rgba(255, 107, 107, .2); border-color: var(--rt-danger); }
    /* The outline destructive: offers the action, doesn't confirm it. The
       modal's danger-solid is the button that actually deletes. */
    .btn.destructive { background: transparent; border-color: var(--rt-danger-edge); color: var(--rt-danger); }
    .btn.destructive:hover:not(:disabled) { background: var(--rt-danger-tint); border-color: var(--rt-danger); }
    .cfg-danger {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rt-line);
    }
    .cfg-danger .hint { margin: 0; flex: 1; min-width: 220px; }
    /* #41's cleanup notice. Informational, not a warning — the cleanup is the
       expected outcome, so it must not read like something went wrong. */
    .cleanup-note {
      display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap;
      margin-bottom: 12px; border-color: var(--rt-info-edge);
    }
    .cleanup-body { flex: 1; min-width: 240px; }
    .cleanup-head { font-weight: 650; margin-bottom: 4px; }
    .cleanup-counts { color: var(--rt-ink-2); font-size: 13px; }
    .cleanup-slugs { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
    .cleanup-slugs code {
      font-size: 11.5px; color: var(--rt-ink-2); background: var(--rt-well);
      border: 1px solid var(--rt-line); border-radius: 5px; padding: 2px 6px;
    }
    .cleanup-actions { display: flex; gap: 8px; align-items: center; flex: none; }

    @media (max-width: 1100px) {
      .themes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .obsv { grid-template-columns: repeat(2, 1fr); }
      .split { grid-template-columns: minmax(0, 1fr) 340px; }
    }
    /* Below this the two-column shapes stop being two columns. The page
       assumes a desktop (OBS on a second monitor) but must not look broken on
       a phone — #48 was exactly this bug. */
    @media (max-width: 860px) {
      .split, .split.narrow, .split.wide, .split.tight, .duo { grid-template-columns: minmax(0, 1fr); }
      .railcol.sticky { position: static; }
      .shell { flex-direction: column; gap: 12px; padding: 18px 16px 48px; }
      .side { width: auto; position: static; display: flex; flex-wrap: wrap; gap: 4px; }
      .side hr, .side .side-note { display: none; }
      .nav-item { width: auto; }
      .top { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
      .top .seg { order: 3; width: 100%; }
      .top .seg button { flex: 1; }
      .stops { padding: 0 14px; overflow-x: auto; }
      .stop { flex: none; min-width: 190px; padding-right: 18px; }
      .setup-narrow { margin: 20px auto; }
      .themes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .obsv { grid-template-columns: minmax(0, 1fr); }
    }
    /* Phone and small-tablet widths. The brand alone wants ~300px, so the top
       bar sheds the part that says the least (#48): the wordmark still says
       whose product this is, and the pill keeps a readable name. */
    @media (max-width: 600px) {
      .top-meta { display: none; }
    }
    @media (max-width: 420px) {
      .brand-train { display: none; }
    }
  </style>
</head>

<script type="module">
  import { extractSlug, buildOverlayQuery } from './src/configurator.js';
  import { mountManualEditor } from './src/manual-editor.js';
  import { decodeLineup } from './src/lineup-codec.js';
  import { instantToZonedWallClock, snapDuration } from './src/manual-lineup.js';
  import { parseStreamers, serializeStreamers, addStreamers, removeStreamer, listStreamers } from './src/streamers.js';
  import { loadEvent, normalizeUser } from './src/raidpal-client.js';
  import { parseConfig } from './src/config.js';
  import { createPreviewFrame } from './src/preview-frame.js';
  import { resolveLocale, loadMessages, makeT } from './src/i18n/index.js';
  import { localizeDom } from './src/i18n/dom.js';
  import {
    parsePresetLibrary, serializePresetLibrary, createPreset, duplicatePreset, renamePreset,
    updatePresetSettings, deletePreset, getPreset, listPresets,
  } from './src/preset-library.js';
  import {
    parseProfiles, serializeProfiles, addProfile, removeProfile, setActiveProfile, listProfiles,
    activeProfile, setDefaultPreset, addSpotlight, removeSpotlight, upsertTrainConfig, getTrainConfig, deleteTrainConfig,
    resolveTrainSettings, countPresetReferences, materializePreset, liveLinkPrefs, setLiveLinkPrefs,
    isSetupDone, markSetupDone, pruneOrphanedConfigs, restoreTrainConfigs,
  } from './src/profiles.js';
  import { filterUpcoming, upcomingPages, visibleUpcoming, CARD_MAX_ROWS } from './src/live-link.js';
  import { anchorStyle } from './src/upcoming-card.js';
  import { loadMyRaidTrains, loadEventDetails, refreshEventDetail, userCacheKey } from './src/my-raid-trains.js';
  import { buildLiveLink, baseSettings } from './src/live-link-url.js';
  import {
    SETTINGS_DEFAULTS, SETTING_FIELDS, THEME_OPTION_KEYS, applySettings, diffSettings, normalizeSettings,
  } from './src/settings-schema.js';
  import { mountSettingsForm } from './src/settings-form.js';
  import { classifyTrains, trainCardHtml, whenLabel } from './src/train-list.js';
  import { encodeBackup, decodeBackup } from './src/backup.js';

  // Sibling Overlay URL, derived from where THIS page lives — works under
  // `python3 -m http.server` locally and on a GitHub Pages subpath alike.
  const OVERLAY_BASE = new URL('overlay.html', window.location.href).href;
  // The built-in demo lineup: previewed with no RaidPal fetch, so it never 404s.
  const DEMO_EVENT = 'demo';

  const LIBRARY_KEY = 'raidtrainoverlay.configurator.presets.v2';
  const PROFILES_KEY = 'raidtrainoverlay.configurator.profiles.v1';
  const STREAMERS_KEY = 'raidtrainoverlay.configurator.streamers';

  // The idle card's horizons, in the `upcoming=` grammar the Overlay parses,
  // each pointing at its catalog key rather than an English label.
  const HORIZON_KEYS = {
    '3': 'configurator.horizon3', '5': 'configurator.horizon5', '2w': 'configurator.horizon2w',
    '1m': 'configurator.horizon1m', 'all': 'configurator.horizonAll',
  };

  // Swatch palettes for the Simple theme grid, keyed by the REAL Theme enum
  // (THEME_OPTION_KEYS). Approximate by design — the live preview beside the
  // grid shows the real art; these only have to be recognizably different.
  // [bg1, bg2, engine, carA, carB, cornerRadius]
  const THEME_SWATCHES = {
    classic: ['#3A2410', '#12161C', '#C96A12', '#1E3A5F', '#4A2B6B', 2],
    flat: ['#1B2430', '#10161E', '#F2A63B', '#3C6E9F', '#4F8A6B', 2],
    synthwave: ['#2A0B3E', '#0B0620', '#FF3D9A', '#28E0F0', '#7A3DF0', 2],
    ticket: ['#E3D6B8', '#BFAE8A', '#8A5A2B', '#A88C5A', '#6E5433', 2],
    wood: ['#8A5A2B', '#4A2F14', '#D99B4E', '#B8683A', '#7FA05A', 5],
    comic: ['#F2EAD8', '#D6CBB4', '#E23B3B', '#2E4EA8', '#F2C33B', 2],
    departures: ['#0B0E13', '#141A22', '#FF9D2E', '#2A3340', '#2A3340', 1],
    paper: ['#F4F1E8', '#DAD4C4', '#8A7A5C', '#B5A788', '#9C8E70', 1],
    tron: ['#04161C', '#010A0E', '#2CE8F5', '#0E7C88', '#1AB4C4', 1],
    pixel: ['#16202B', '#0A0F14', '#8ED14F', '#4FA3D1', '#D14F8E', 0],
    highvibes: ['#12300F', '#061405', '#6FBF3B', '#D9C43B', '#3B8F5E', 5],
    jazz: ['#241A12', '#0D0906', '#C9A227', '#7A4B2A', '#3E2A1C', 3],
    bullet: ['#101A2E', '#050A14', '#4FA8FF', '#E8EEF7', '#1C4E8A', 6],
    lava: ['#2A0A16', '#0B0308', '#FF5E3A', '#FFB03A', '#8A1E3C', 7],
    pride: ['#1A1030', '#08040F', '#E4463B', '#F2A63B', '#3B7FE4', 2],
    shuffle: ['#2A2033', '#0C0A12', '#FF9D2E', '#3C6E9F', '#7A3DF0', 3],
  };

  // The idle card's nine scene anchors, in reading order — the same grammar
  // parseConfig's `uppos` accepts.
  const POSITIONS = [
    ['tl', 'configurator.posTl'], ['tc', 'configurator.posTc'], ['tr', 'configurator.posTr'],
    ['ml', 'configurator.posMl'], ['mc', 'configurator.posMc'], ['mr', 'configurator.posMr'],
    ['bl', 'configurator.posBl'], ['bc', 'configurator.posBc'], ['br', 'configurator.posBr'],
  ];
  // The Overlay's own defaults for the idle-card knobs (config.js) — what a
  // null pref means, and what the controls show before a pref is stored.
  const IDLE_DEFAULTS = { uppos: 'bc', upop: '0.88', upcycle: '12', upscroll: '34', upstyle: 'card' };
  // The scroll-speed slider reads left-slow → right-fast while the value is a
  // DURATION (bigger = slower), so it is stored flipped: value = FLIP − slider.
  // Lap range 24s (fastest — still readable) to 120s (a genuinely lazy crawl);
  // FLIP = min + max, so the flip maps the range onto itself.
  const UPSCROLL_MIN = 24;
  const UPSCROLL_MAX = 120;
  const UPSCROLL_FLIP = UPSCROLL_MIN + UPSCROLL_MAX;

  const ICONS = {
    pencil: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.7l2 2L5.4 12.6l-2.9.9.9-2.9z"/><path d="m9.9 4.1 2 2"/></svg>',
    copy: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.2"/><path d="M10.5 3.5v-.4a1 1 0 0 0-1-1H3.6a1 1 0 0 0-1 1v5.8a1 1 0 0 0 1 1h.4"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11"/><path d="M5.5 4.5V3.2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.3"/><path d="m4.3 4.5.6 8.6a1 1 0 0 0 1 .9h4.2a1 1 0 0 0 1-.9l.6-8.6"/><path d="M6.7 7.3v3.9M9.3 7.3v3.9"/></svg>',
  };

  // Inline icons drawn in one stroke weight — never Unicode glyphs standing in
  // for an icon system. ICONS above keeps the editor's 14px set; these are the
  // shell's sized icons (checks, chevrons, transport controls, the warn mark).
  const ICON_PATHS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    chev: '<path d="m6 9 6 6 6-6"/>',
    warn: '<path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8h.01"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
    starOutline: '<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  };
  const ICON_FILLS = {
    play: '<path d="M8 5.5v13l11-6.5z"/>',
    stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/>',
    star: '<path d="m12 3 2.9 5.9 6.5 1-4.7 4.6 1.1 6.5L12 17.9 6.2 21l1.1-6.5-4.7-4.6 6.5-1z"/>',
  };
  const icon = (name, size = 14) => (ICON_PATHS[name]
    ? `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`
    : `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICON_FILLS[name]}</svg>`);

  // The bound translator. start() replaces this before the first render, so the
  // stub only ever covers the module's own evaluation; every string on the page
  // — this file's views, the settings form, the train cards, the Build-by-hand
  // editor — resolves through it.
  let t = (key) => key;
  // The resolved locale, handed to Intl so dates and clock times in the train
  // list read the same way as the words around them. undefined = the browser's.
  let pageLocale;

  const $ = (sel, root) => (root ?? document).querySelector(sel);
  const $$ = (sel, root) => [...(root ?? document).querySelectorAll(sel)];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /** t() for a string that lands in HTML as text or in an attribute. */
  const te = (key, params) => esc(t(key, params));
  /**
   * A Theme's display name in the current locale. An unregistered theme (a
   * hand-edited backup blob, a Theme retired since the Preset was saved) has no
   * key, so it renders as its stored value — NOT through t(), which would treat
   * the value as a message key and could resolve it to an unrelated string.
   */
  const themeLabel = (theme) => (THEME_OPTION_KEYS[theme] ? t(THEME_OPTION_KEYS[theme]) : String(theme));
  /**
   * Two-form plural: a locale gets its own singular and plural strings rather
   * than English's "s" glued on in code, which is wrong in most of the eleven
   * languages here. Not full CLDR plural categories — a machine-translated
   * draft can't be trusted with six Lithuanian forms — but honest for one/many.
   */
  const plural = (n, oneKey, otherKey, params) => t(n === 1 ? oneKey : otherKey, { n, ...params });

  // ── Stores (localStorage adapters around the pure modules) ─────────────
  let library = parsePresetLibrary(localStorage.getItem(LIBRARY_KEY));
  let profiles = parseProfiles(localStorage.getItem(PROFILES_KEY));
  let streamers = parseStreamers(localStorage.getItem(STREAMERS_KEY));
  const saveLibrary = () => localStorage.setItem(LIBRARY_KEY, serializePresetLibrary(library));
  const saveProfiles = () => localStorage.setItem(PROFILES_KEY, serializeProfiles(profiles));
  const saveStreamers = () => localStorage.setItem(STREAMERS_KEY, serializeStreamers(streamers));

  const state = {
    // Variant D's two ages of the same app. `setup` is the three-stop journey
    // (first visit, or "Run setup again"); `home` is Simple / Everything.
    stage: 'home',         // setup | home
    stop: 1,               // setup: which stop (1..3)
    homeView: 'simple',    // home: simple | everything
    copied: false,         // setup stop 3: has the Live Link been copied here
    themesOpen: false,     // Simple/stop 2: theme grid expanded past one row
    justLanded: false,     // show the graduation ribbon once after setup
    idlePage: 0,           // which page the idle-card mock preview is showing
    view: 'trains',        // trains | presets | profile | oneoff
    editing: null,         // Event slug — the Raid Train Config editor is open
    editingPreset: null,   // Preset id — the Preset editor is open
    renaming: null,        // Preset id in inline rename (library rows)
    pastOpen: false,
    // My Raid Trains data for the ACTIVE Profile.
    feed: { status: 'idle', events: [], details: {}, error: null, login: null },
    // #41 cleanup. `cleanup` is the standing notice ({ removed, at }) or null —
    // it persists until the streamer dismisses it, so a Configurator left in a
    // background tab still reports what happened when they come back to it.
    // `cleanupRan` throttles the automatic pass to once per session; `kept` is
    // the undo's suppression set. Both are deliberately memory-only.
    cleanup: null,
    cleanupRan: false,
    kept: new Set(),
  };

  const me = () => activeProfile(profiles);
  const myProfile = () => (me() ? profiles.profiles[me()] : null);

  // ── Toast + modal ──────────────────────────────────────────────────────
  let toastTimer = null;
  function toast(message) {
    const el = $('#toast');
    el.innerHTML = `<span class="ok">${icon('check', 13)}</span>${esc(message)}`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }
  async function copyText(text, message) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Non-secure contexts (plain http://) have no clipboard API — fall back
      // to selecting a scratch input so the copy still works locally.
      const scratch = document.createElement('input');
      scratch.value = text;
      document.body.appendChild(scratch);
      scratch.select();
      document.execCommand('copy');
      scratch.remove();
    }
    toast(message);
  }
  const openModal = (html) => { $('#modal').innerHTML = html; $('#modal-scrim').classList.add('open'); };
  const closeModal = () => $('#modal-scrim').classList.remove('open');

  // ── Preset helpers ─────────────────────────────────────────────────────
  /** The Preset a Raid Train Config resolves to: its own, else the Profile default. */
  function presetFor(config) {
    return getPreset(library, config?.presetId ?? myProfile()?.defaultPresetId ?? null);
  }
  /** A Profile always needs SOMETHING to start from — seed a default Preset on first use. */
  function ensureStarterPreset(login) {
    if (myProfile()?.defaultPresetId && getPreset(library, myProfile().defaultPresetId)) return;
    const existing = listPresets(library);
    const id = existing.length > 0
      ? existing[0].id
      : (() => { const made = createPreset(library, t('configurator.starterPresetName'), SETTINGS_DEFAULTS); library = made.library; saveLibrary(); return made.id; })();
    profiles = setDefaultPreset(profiles, login, id);
    saveProfiles();
  }
  /** Settings + Spotlights for a train, defaulting to the Profile's base for an unconfigured one. */
  function trainSettings(slug) {
    const login = me();
    if (!login) return { settings: normalizeSettings({}), spotlight: [] };
    const config = getTrainConfig(profiles, login, slug);
    if (config) {
      const resolved = resolveTrainSettings(library, profiles, login, slug);
      return { settings: normalizeSettings(resolved.settings), spotlight: resolved.spotlight };
    }
    return { settings: baseSettings(library, profiles, login), spotlight: [...(myProfile()?.spotlight ?? [])] };
  }
  /** The copyable Overlay URL pinned to ONE train. */
  function trainOverlayUrl(slug) {
    const { settings, spotlight } = trainSettings(slug);
    const query = buildOverlayQuery({ ...settings, event: slug, spotlight: spotlight.join(',') });
    return `${OVERLAY_BASE}?${query}`;
  }
  /**
   * The feed's events, but ONLY when this read is trustworthy — a fresh
   * `ready` with no error and nothing served from a stale cache. Everything
   * downstream treats these as positive evidence about when trains end (#31),
   * so a doubtful read must contribute none.
   */
  function goodFeedEvents() {
    const f = state.feed;
    return f.status === 'ready' && !f.stale && !f.error ? f.events : null;
  }
  /**
   * …and whether that read actually reached RaidPal (#39). `goodFeedEvents`
   * cannot tell: `loadMyRaidTrains` serves a cache hit inside its 6h window
   * with no error and no stale flag, so a feed can look perfectly healthy and
   * still be a six-hour-old snapshot nobody re-checked. That is fine for an end
   * time — a recorded fact — but absence from it is an inference, and pruning a
   * train's overrides on a stale inference is silent data loss.
   */
  const feedVerified = () => goodFeedEvents() != null && state.feed.fromCache === false;
  /**
   * Drop Configs for trains that are over and gone (#41), and offer them back.
   *
   * Runs on every EXPLICIT refresh and at most once otherwise, so a session
   * that opens the Configurator repeatedly does not keep re-testing the same
   * rule against the same feed. The guards that make it safe all live in
   * pruneOrphanedConfigs; the only judgement here is WHEN to ask it.
   *
   * `kept` is the session-scoped suppression behind the notice's undo. Without
   * it the next verified read would delete exactly what the streamer just asked
   * us to keep — possibly before they finished reading the notice. It lives in
   * memory and dies with the page, matching the undo's own lifetime: nothing
   * new is written to disk to remember a decision we believe was already right.
   */
  function cleanUpOrphans({ force = false } = {}) {
    if (!force && state.cleanupRan) return;
    if (!feedVerified()) return;
    state.cleanupRan = true;
    const { store, removed } = pruneOrphanedConfigs(profiles, me(), {
      events: goodFeedEvents(), verified: true, now: Date.now(),
    });
    if (removed.length === 0) return;
    // The prune is blind to `kept` by design — it answers "is this reachable?",
    // not "did the streamer overrule us?". So put the held ones straight back.
    const held = removed.filter((r) => state.kept.has(r.slug));
    const fresh = removed.filter((r) => !state.kept.has(r.slug));
    if (fresh.length === 0) return;
    profiles = held.length ? restoreTrainConfigs(store, me(), held) : store;
    saveProfiles();
    // `login` is what makes the notice safe to leave on screen: everything it
    // offers to undo belongs to ONE Profile, and `me()` can change underneath it.
    state.cleanup = { removed: fresh, login: me() };
  }
  /** When the feed says this train ends, as epoch ms — only from a good read. */
  function feedEndsAt(slug) {
    const event = (goodFeedEvents() ?? []).find((e) => e.slug === slug);
    return event ? event.endtime.getTime() : null;
  }
  /** The Live Link plus its size verdict (#33) and its train coverage (#31). */
  const liveLink = () => {
    const link = buildLiveLink(library, profiles, me(), {
      now: Date.now(), events: goodFeedEvents(), verified: feedVerified(),
    });
    return { ...link, url: link.query ? `${OVERLAY_BASE}?${link.query}` : '' };
  };
  const liveLinkUrl = () => liveLink().url;

  // ── My Raid Trains feed ────────────────────────────────────────────────
  /**
   * Load the active Profile's trains: the user record first (cache-first, ~6h),
   * then each Event's detail SEQUENTIALLY, repainting cards as they settle. A
   * failed read serves the stale cache and says so — it is never "you left the
   * train".
   */
  /** The last-good user record for a login, straight from my-raid-trains' cache, or null. */
  function cachedUser(login) {
    try {
      const raw = localStorage.getItem(userCacheKey(login));
      if (raw == null) return null;
      const entry = JSON.parse(raw);
      return entry?.payload ? normalizeUser(entry.payload) : null;
    } catch {
      return null;
    }
  }

  async function loadFeed({ force = false } = {}) {
    const login = me();
    if (!login) { state.feed = { status: 'idle', events: [], details: {}, error: null, login: null }; return; }
    state.feed = { status: 'loading', events: [], details: {}, error: null, login };
    renderMain();
    try {
      const result = await loadMyRaidTrains(login, { fetchImpl: fetch.bind(window), storage: localStorage, force });
      if (me() !== login) return; // the Profile switched while we were away
      if (result.notFound) {
        // "No such user" is a 204 — but the undocumented API also answers a bad
        // moment (an HTML error page, a truncated body) with something that isn't
        // `{ user: … }`, which reads here as the same thing. my-raid-trains keeps the
        // last-good cache for exactly this reason, so serve it: a streamer with 13
        // trains must never be told they have no profile because one read went odd.
        const cached = cachedUser(login);
        state.feed = cached
          ? { ...state.feed, status: 'ready', events: cached.events, stale: 'notfound' }
          : { ...state.feed, status: 'notfound' };
        renderMain();
        return;
      }
      // `fromCache` rides along so the Live Link can tell a verified read from a
      // cache hit (#39). This is the ONLY assignment that sets it: loadFeed
      // rebuilds state.feed from scratch on entry, so a later `...state.feed`
      // spread can only ever carry THIS call's value — and the notFound/error
      // paths that do spread it are already excluded by goodFeedEvents()
      // returning null, which feedVerified() requires first.
      state.feed = {
        ...state.feed, status: 'ready', events: result.user.events,
        error: result.error ?? null, fromCache: result.fromCache === true,
      };
      cleanUpOrphans({ force });
      renderMain();
      await loadEventDetails(result.user.events, {
        fetchImpl: fetch.bind(window),
        storage: localStorage,
        onDetail: (detail) => {
          if (me() !== login) return;
          state.feed.details[detail.slug] = detail;
          paintCard(detail.slug);
        },
      });
    } catch (error) {
      if (me() !== login) return;
      state.feed = { ...state.feed, status: 'error', error };
      renderMain();
    }
  }

  /** An Event detail → the `{ slots, filled }` the card's mini-train draws. */
  function detailCounts(slug) {
    const entry = state.feed.details[slug];
    if (!entry?.event) return null;
    const slots = entry.event.slots.length;
    return { slots, filled: entry.event.slots.filter((s) => s.occupied).length };
  }

  function cardView(event, status, now) {
    const config = me() ? getTrainConfig(profiles, me(), event.slug) : null;
    const preset = config ? presetFor(config) : null;
    // Count what the editor would show, not the raw stored keys: a Config that has
    // been materialized carries all fifteen fields, most of which no longer differ
    // from its base. Counting raw keys had the card saying "+15" over an editor
    // saying "Reset 1 override".
    const base = normalizeSettings(preset?.settings ?? {});
    const liveOverrides = config ? diffSettings(base, applySettings(base, config.overrides)) : {};
    return {
      event,
      status,
      when: whenLabel(event, now, pageLocale, t),
      detail: detailCounts(event.slug),
      error: state.feed.details[event.slug]?.error ?? null,
      config: config
        ? { presetName: preset?.name ?? t('configurator.customPreset'), overrideCount: Object.keys(liveOverrides).length }
        : null,
    };
  }

  /** Repaint ONE card in place — the progressive detail loads must not rebuild the view. */
  function paintCard(slug) {
    const existing = $(`.event-card[data-slug="${CSS.escape(slug)}"]`);
    const event = state.feed.events.find((e) => e.slug === slug);
    if (!existing || !event) return;
    const now = Date.now();
    const { live, upcoming } = classifyTrains([event], now);
    const status = live.length ? 'live' : upcoming.length ? 'upcoming' : 'past';
    existing.outerHTML = trainCardHtml(cardView(event, status, now), t);
  }

  // ── Views ──────────────────────────────────────────────────────────────
  function renderTopbar() {
    const login = me();
    $('#pb-avatar').textContent = login ? login[0].toUpperCase() : '+';
    // The label ellipsises on a narrow window, so hand the full login to the
    // tooltip — a screen reader still reads the whole name out of the DOM, but
    // a sighted phone user has no other way to see past the clip.
    $('#pb-name').textContent = login ?? t('configurator.addProfile');
    $('#pb-name').title = login ?? '';
    const rows = listProfiles(profiles).map((name) => {
      const p = profiles.profiles[name];

        <span class="avatar">${esc(name[0].toUpperCase())}</span>
        <span><span class="p-name">${esc(name)}</span>
          <span class="p-sub">${esc(plural(trains, 'configurator.profileConfigsOne', 'configurator.profileConfigsMany'))}</span></span>

  function renderSidebar() {
    $('#nc-trains').textContent = state.feed.status === 'ready' ? String(state.feed.events.length) : '';
    $('#nc-presets').textContent = String(listPresets(library).length);
    for (const el of $$('.nav-item')) {
      const nav = el.dataset.nav;

  /**

   * would otherwise need localizing three times and could drift.)

  function previewFrameHtml() {
    return `<div class="preview-frame">
          <iframe id="preview" title="${te('configurator.previewTitle')}"></iframe>
          <div class="preview-controls">
            <button type="button" id="preview-roll" class="preview-btn">${icon('play', 12)}&nbsp;${te('configurator.rollIt')}</button>
            <button type="button" id="preview-still" class="preview-btn" hidden>${icon('stop', 12)}&nbsp;${te('configurator.recenter')}</button>
          </div>
        </div>
        <div class="preview-caption" id="preview-caption"></div>`;
  }

  const resetOverridesLabel = (n) => plural(n, 'configurator.resetOverridesOne', 'configurator.resetOverridesMany');

  // ── View: My Raid Trains ───────────────────────────────────────────────
  /**
   * The Live Link card. `idle: true` (Everything's trains view) carries the
   * full idle-card group — the same partial Simple's "Between trains" section
   * renders, so the two surfaces can never drift; `idle: false` (Simple's
   * rail, setup stop 3) leaves the idle group to the section that owns it.
   */
  function liveLinkCardHtml({ idle = true } = {}) {
    const base = getPreset(library, myProfile()?.defaultPresetId ?? null);
    const link = liveLink();
    // The blob is over the cap the Overlay decodes against, so this URL's
    // per-train settings are already unreadable (#33). Say so here — it is the

    const tooBig = link.oversize
      ? `<div class="ll-note bad"><span class="w" aria-hidden="true">${icon('warn', 15)}</span><span>${te('configurator.llTooBig', {
        chars: link.blobChars, max: link.maxBlobChars, trains: link.trainCount,

      : '';
    return `<section class="card live-link" id="live-link-card">

      <p class="ll-sub">${t('configurator.llSub')}</p>

      </div>
      ${tooBig}
      <div class="ll-note"><span class="w" aria-hidden="true">${icon('warn', 15)}</span><span>${te('configurator.llWarn')}</span></div>
      ${idle ? `<div class="ll-idle">${idleControlsHtml()}</div>` : ''}
      <div class="ll-meta">${esc(link.trainCount === 0
        ? t('configurator.llCoversNone')
        : plural(link.trainCount, 'configurator.llCoversOne', 'configurator.llCoversMany'))}</div>
      <div class="ll-meta">${t('configurator.llStyledBy', {
        preset: `<b>${esc(base?.name ?? t('configurator.noneYet'))}</b>${base ? ` (${esc(themeLabel(normalizeSettings(base.settings).theme))})` : ''}`,
      })}</div>

  /** The upcoming-only URL: the Live Link with ?uponly=1 riding along. */
  function upOnlyUrl() {

    if (!link.query) return '';

    params.set('uponly', '1');
    return `${OVERLAY_BASE}?${params.toString()}`;

  /**
   * The Live Link view (Everything): the one URL your stream uses, its idle

   * own page, no longer stacked on top of My Raid Trains.

  function liveLinkViewHtml() {

    return `<h2 class="view-title">${te('configurator.navLiveLink')}</h2>

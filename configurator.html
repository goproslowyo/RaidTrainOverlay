  function trainsViewHtml() {
    if (!me()) {
      return `<h2 class="view-title">${te('configurator.navTrains')}</h2>
        <p class="view-sub">${te('configurator.trainsSubAnon')}</p>
        <section class="card">
          <h2 class="card-h">${te('configurator.getStarted')}</h2>
          <div class="spot-add">
            <input type="text" id="onboard-input" placeholder="${te('configurator.yourTwitchUsername')}" autocomplete="off">
            <button type="button" class="btn primary" data-act="onboard">${te('configurator.showMyTrains')}</button>
          </div>
          <div class="hint">${te('configurator.onboardHint')}</div>
        </section>
        <section class="card">
          <h2 class="card-h">${te('configurator.noRaidpalProfile')}</h2>
          <div class="hint">${t('configurator.noRaidpalProfileHint')}</div>
        </section>`;
    }
    const head = `<h2 class="view-title">${te('configurator.navTrains')}</h2>
      <p class="view-sub">${t('configurator.trainsSubFor', { login: `<b>${esc(me())}</b>` })}</p>`;
    if (state.feed.status === 'loading') return `${head}<div class="empty">${te('configurator.trainsLoading')}</div>`;
    if (state.feed.status === 'notfound') {
      return `${head}<section class="card"><h2 class="card-h">${te('configurator.unknownUser')}</h2>
        <div class="hint">${t('configurator.unknownUserHint', { login: `<b>${esc(me())}</b>` })}
        <button type="button" class="btn sm" data-act="refresh-all" style="margin-left:8px">${te('configurator.tryAgain')}</button></div></section>`;
    }
    if (state.feed.status === 'error') {
      return `${head}<section class="card"><h2 class="card-h">${te('configurator.raidpalUnreachable')}</h2>
        <div class="hint">${esc(state.feed.error?.message ?? t('configurator.requestFailed'))} ${te('configurator.settingsSafe')}
        <button type="button" class="btn sm" data-act="refresh-all">${te('configurator.retry')}</button></div></section>`;
    }
    const now = Date.now();
    const { live, upcoming, past } = classifyTrains(state.feed.events, now);
    const staleNote = state.feed.stale === 'notfound'
      ? t('configurator.staleNotFound', { login: `<b>${esc(me())}</b>` })
      : state.feed.error ? t('configurator.staleError') : '';
    const stale = staleNote
      ? `<div class="hint" style="margin:-6px 0 12px">${staleNote}
           <button type="button" class="btn sm" data-act="refresh-all" style="margin-left:6px">${te('configurator.tryAgain')}</button></div>`
      : '';
    const cleanup = cleanupNoticeHtml(now);
    const cards = [...live, ...upcoming].map((e) => trainCardHtml(cardView(e, live.includes(e) ? 'live' : 'upcoming', now), t)).join('');
    const emptyNote = (live.length + upcoming.length) === 0
      ? `<div class="empty">${te('configurator.noTrains')}</div>` : '';
    const ended = past.length > 0
      ? `<button type="button" class="past-divider${state.pastOpen ? ' open' : ''}" data-act="toggle-past">
           ${esc(plural(past.length, 'configurator.endedOne', 'configurator.endedMany'))} <span class="pd-chev" aria-hidden="true">${icon('chev', 12)}</span>
         </button>
         <div class="past-list"${state.pastOpen ? '' : ' hidden'}>${past.map((e) => trainCardHtml(cardView(e, 'past', now), t)).join('')}</div>`
      : '';
    return `${head}${stale}${cleanup}${cards}${emptyNote}${ended}`;
  }

  /**
   * The standing notice for a cleanup that happened (#41).
   *
   * Split by what we can honestly claim. A Config with a past `endsAt` DID end
   * — the schedule ran out, whatever happened afterwards — so "ended" is a
   * fact. Everything else only earns "no longer on your schedule", because
   * CONTEXT.md is explicit that the store cannot tell a deleted train from a
   * renamed one. In practice the second bucket is empty today: the prune's own
   * guard requires a past `endsAt`, so nothing without one can reach here. The
   * line is kept because that guard is the piece most likely to be relaxed, and
   * a relaxation that silently started calling renamed trains "ended" is
   * exactly the wrong-word-in-shipped-UI bug #38 just finished cleaning up.
   *
   * Sticky by design: no timer, dismiss only. A Configurator sitting in a
   * background tab during a stream must still be able to report this when the
   * streamer comes back to it, which a 2.2s toast cannot do.
   */
  function cleanupNoticeHtml(now) {
    // Never show another Profile's notice: its undo would write THAT Profile's
    // Configs into THIS one, and leave the originals gone.
    if (state.cleanup && state.cleanup.login !== me()) return '';
    const removed = state.cleanup?.removed ?? [];
    if (removed.length === 0) return '';
    const ended = removed.filter((r) => typeof r.config?.endsAt === 'number' && r.config.endsAt < now).length;
    const gone = removed.length - ended;
    const counts = [
      ended ? plural(ended, 'configurator.cleanupEndedOne', 'configurator.cleanupEndedMany', { n: `<b>${ended}</b>` }) : '',
      gone ? plural(gone, 'configurator.cleanupGoneOne', 'configurator.cleanupGoneMany', { n: `<b>${gone}</b>` }) : '',
    ].filter(Boolean).join(' · ');
    const slugs = removed.map((r) => `<code>${esc(r.slug)}</code>`).join(' ');
    return `<section class="card cleanup-note">
      <div class="cleanup-body">
        <div class="cleanup-head">${te('configurator.cleanupHead')}</div>
        <div class="cleanup-counts">${counts}</div>
        <div class="cleanup-slugs">${slugs}</div>
      </div>
      <div class="cleanup-actions">
        <button type="button" class="btn sm" data-act="cleanup-keep">${te('configurator.cleanupKeep')}</button>
        <button type="button" class="btn sm ghost" data-act="cleanup-dismiss">${te('configurator.cleanupDismiss')}</button>
      </div>
    </section>`;
  }

  // ── View: Raid Train Config editor ─────────────────────────────────────
  function configEditorHtml() {
    const slug = state.editing;
    const event = state.feed.events.find((e) => e.slug === slug);
    const config = getTrainConfig(profiles, me(), slug);
    const overrideCount = Object.keys(config?.overrides ?? {}).length;
    const presetId = config?.presetId ?? myProfile()?.defaultPresetId ?? null;
    const options = listPresets(library)
      .map((p) => `<option value="${esc(p.id)}"${p.id === presetId ? ' selected' : ''}>${esc(p.name)}${p.id === myProfile()?.defaultPresetId ? ' (default)' : ''}</option>`)
      .join('');
    const now = Date.now();
    const isLive = event ? classifyTrains([event], now).live.length > 0 : false;
    return `<button type="button" class="back-link" data-act="back-trains">← ${te('configurator.navTrains')}</button>
      <div class="editor-head-row">
        <h2>${esc(event?.title ?? slug)}</h2>
        ${isLive ? `<span class="chip-live"><span class="dot"></span>${te('configurator.chipLive')}</span>` : ''}
        ${event?.organiser ? `<span class="chip-org">${te('configurator.chipOrganiser')}</span>` : ''}
      </div>
      <p class="view-sub">${event ? esc(whenLabel(event, now, pageLocale, t)) : esc(slug)}</p>

      <section class="card">
        ${previewFrameHtml()}
      </section>

  // ── Variant D: shared partials for Simple and the setup journey ────────
  /** The Profile's upcoming trains (soonest first), for the idle mock + counts. */
  function upcomingTrains() {
    if (state.feed.status !== 'ready') return [];
    return classifyTrains(state.feed.events, Date.now()).upcoming;
  }
  /** The effective idle-card knob values: stored prefs over the Overlay defaults. */
  function idleValues() {
    const prefs = me() ? liveLinkPrefs(profiles, me()) : {};
    const out = { ...IDLE_DEFAULTS, upcoming: prefs.upcoming ?? null };
    for (const key of Object.keys(IDLE_DEFAULTS)) {
      if (prefs[key] != null) out[key] = String(prefs[key]);
    }
    return out;
  }
  /** A horizon key ('3', '2w', …) → the trains it reaches, via the REAL grammar. */
  function horizonTrains(h) {
    return filterUpcoming(upcomingTrains(), parseConfig(`upcoming=${encodeURIComponent(h)}`).upcoming, new Date());
  }
  /** The soonest upcoming train, or null. */
  const nextTrain = () => upcomingTrains()[0] ?? null;

  const fmtDep = (date) => new Intl.DateTimeFormat(pageLocale, { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(date);

  /**
   * Rows for the idle mock: the real feed, or labeled examples before it
   * loads. Example departures are synthesized as real near-future instants and
   * run through the same formatter as real rows, so they localize; only the
   * train names are literals (proper nouns, like the demo lineup's).
   */
  function idleMockRows() {
    const real = upcomingTrains();
    if (real.length > 0) return { rows: real.map((e) => [fmtDep(e.starttime), e.title]), example: false };
    const DAY_MS = 24 * 60 * 60_000;
    const at = (days, hour) => { const d = new Date(Date.now() + days * DAY_MS); d.setHours(hour, 0, 0, 0); return d; };
    return {
      rows: [
        [fmtDep(at(1, 21)), 'House Is A Feeling'],
        [fmtDep(at(3, 20)), 'Trainwreck Lucky 13'],
        [fmtDep(at(6, 18)), 'Sunday Slow Burn'],
      ],
      example: true,
    };
  }

  /* The mock's anchor styles come from the Overlay's own grammar
     (upcoming-card.js anchorStyle) — one source of truth, so the picker can
     never promise a position the Overlay doesn't paint. */

  /**
   * The [time, name] rows the mock actually shows for a horizon — the
   * horizon-filtered feed, or the labeled examples before it loads. The cycle
   * hint derives its page math from THIS list, so the hint can never
   * contradict the mock's own page badge beside it.
   */
  function idleMockList(horizon) {
    const { rows, example } = idleMockRows();
    const matched = example ? rows : horizonTrains(horizon).map((e) => [fmtDep(e.starttime), e.title]);
    return matched.length > 0 ? matched : rows;
  }

  /** The idle-card mock itself (the same skin the Overlay paints). */
  function idleMockHtml() {
    const v = idleValues();
    const horizon = v.upcoming ?? '3';
    const list = idleMockList(horizon);
    if (v.upstyle === 'ticker') {
      const run = list.map(([tm, nm]) => `<span class="tick"><span class="tm">${esc(tm)}</span>${esc(nm)}</span>`).join('<span class="tsep">•</span>');
      // Two identical LAP spans (each closing with its separator + a matching
      // pad) so the -50% loop is seamless — the same discipline as the real
      // ticker in upcoming-card.js.
      const lapHtml = `<span class="ticklap">${run}<span class="tsep">•</span></span>`;
      return `<div style="${anchorStyle(v.uppos, 12)}">
        <div class="up ticker" style="--upop:${esc(v.upop)};--tickdur:${esc(v.upscroll)}s">
          <span class="lbl">${te('overlay.upcoming')}</span>
          <span class="tickwrap"><span class="tickrun">${lapHtml}${lapHtml}</span></span>
        </div></div>`;
    }
    // The same paging the Overlay ships (live-link.js) — the mock must
    // demonstrate the behaviour, not a re-implementation of it.
    const pages = upcomingPages(list);
    const page = ((state.idlePage % pages) + pages) % pages;
    const win = visibleUpcoming(list, page);
    const rowsHtml = win.map(([tm, nm]) => `
      <div class="row enter"><span class="tm">${esc(tm)}</span><span class="nm">${esc(nm)}</span></div>`).join('');
    return `<div style="${anchorStyle(v.uppos, 12)}">
      <div class="up" style="--upop:${esc(v.upop)}">
        <div class="uphead">
          <span class="lbl">${te('overlay.upcoming')}</span>
          ${pages > 1 ? `<span class="upcount">${page + 1} / ${pages}</span>` : ''}
        </div>
        <div class="uprows">${rowsHtml}</div>
      </div></div>`;
  }

  /* Sixteen swatches at once was the single biggest thing making "Simple" not
     simple. Show one row, keep the CURRENT theme in it however far down the
     list it lives, and put the rest behind one button that folds back up. */
  function themeGridHtml() {
    const FIRST_ROW = 5;
    const current = baseSettings(library, profiles, me()).theme;
    const all = Object.keys(THEME_OPTION_KEYS);
    let shown = all;
    if (!state.themesOpen) {
      shown = all.slice(0, FIRST_ROW);
      if (!shown.includes(current)) shown = [...all.slice(0, FIRST_ROW - 1), current];
    }
    const tiles = shown.map((id) => {
      const [bg1, bg2, engine, carA, carB, r] = THEME_SWATCHES[id] ?? THEME_SWATCHES.classic;
      return `<button type="button" class="themeb" data-act="theme" data-id="${esc(id)}" aria-pressed="${id === current}">
        <span class="sw" style="background:linear-gradient(160deg,${bg1},${bg2})">
          <span style="width:14px;height:11px;border-radius:${r}px;background:${engine}"></span>
          <span style="width:11px;height:9px;border-radius:${r}px;background:${carA}"></span>
          <span style="width:11px;height:9px;border-radius:${r}px;background:${carB}"></span>
          <span style="width:11px;height:9px;border-radius:${r}px;background:${carB};opacity:.5"></span>
          ${id === current ? `<span class="tick">${icon('check', 10)}</span>` : ''}
        </span>
        <span class="nm">${esc(themeLabel(id))}</span>
      </button>`;
    }).join('');
    const toggle = `<button type="button" class="btn ghost sm" data-act="themesmore" style="margin-top:10px;padding-left:0">
      ${state.themesOpen ? te('configurator.themesShowFewer') : te('configurator.themesShowAll', { n: all.length })} ${icon('chev', 13)}
    </button>`;
    return `<div class="themes">${tiles}</div>${toggle}`;
  }

  // The idle mock's page clock. Runs only while a paging card mock is on
  // screen; render() re-arms it so the hold time tracks the setting live.
  let idleMockTimer = null;
  function scheduleIdleMock() {
    clearTimeout(idleMockTimer);
    const v = idleValues();
    if (v.upcoming == null || v.upstyle !== 'card') return;
    const mock = document.getElementById('idle-mock');
    if (!mock) return;
    idleMockTimer = setTimeout(() => {
      state.idlePage += 1;
      const el = document.getElementById('idle-mock');
      if (el) el.innerHTML = idleMockHtml();
      scheduleIdleMock();
    }, Number(v.upcycle) * 1000);
  }

  /** Simple/stop-2 write path: edits land on the Profile's default Preset. */
  function writeBaseSetting(key, value) {
    if (!me()) { toast(t('configurator.toastAddProfileFirst')); return; }
    ensureStarterPreset(me());
    const id = myProfile().defaultPresetId;
    library = updatePresetSettings(library, id, { ...baseSettings(library, profiles, me()), [key]: value });
    saveLibrary();
  }

  /** Refresh Simple/stop-2 chrome in place (preview, URL, summary) after an edit. */
  function refreshSimpleChrome() {
    const s = baseSettings(library, profiles, me());
    previewCaption(s);
    preview?.render(buildOverlayQuery({ ...s, event: DEMO_EVENT }), DEMO_EVENT);
    const url = $('#ll-url');
    if (url) url.value = liveLinkUrl();
    const summary = $('#simple-summary');
    if (summary) summary.textContent = simpleSummary();
  }

  /**
   * Repaint just the "Between trains" section (or, where it isn't on screen —
   * Everything's Live Link view — the whole main). renderMain would rebuild
   * the preview IFRAME too, which reloads the overlay and reads as a flicker
   * on every idle-knob commit.
   */
  function repaintIdle() {
    const section = $('#idle-section');
    if (section) {
      section.outerHTML = idleSectionHtml();
      scheduleIdleMock();
    } else {
      renderMain();
    }
  }

  /** Same discipline for the look card: repaint it without touching the iframe. */
  function repaintLook() {
    const card = $('#look-card');
    if (card) card.outerHTML = lookCardHtml();
    else renderMain();
    refreshSimpleChrome();
    renderChrome(); // the setup stop rail's subtitle carries the look
  }

  /** Idle-knob write path: per-Profile Live Link prefs, never the Preset. */
  function writeIdlePref(key, value) {
    if (!me()) { toast(t('configurator.toastAddProfileFirst')); return; }
    profiles = setLiveLinkPrefs(profiles, me(), { [key]: value });
    saveProfiles();
    const url = $('#ll-url');
    if (url) url.value = liveLinkUrl();
    const uponly = $('#ll-uponly-url');
    if (uponly) uponly.value = upOnlyUrl();
  }

  // ── Master render ──────────────────────────────────────────────────────
  let preview = null;
  let settingsForm = null;
  let pendingImport = null;

  function renderMain() {
    // Every view is rebuilt wholesale, so the controllers bound to the old DOM
    // go with it — drop the references or they'd write into a detached tree.
    preview = null;
    settingsForm = null;
    manualEditor = null;
    const main = $('#main');
    if (state.stage === 'setup') main.innerHTML = setupHtml();
    else if (state.editing) main.innerHTML = configEditorHtml();
    else if (state.editingPreset) main.innerHTML = presetEditorHtml();
    else if (state.homeView === 'simple') main.innerHTML = simpleViewHtml();
    else if (state.view === 'livelink') main.innerHTML = liveLinkViewHtml();
    else if (state.view === 'presets') main.innerHTML = presetsViewHtml();
    else if (state.view === 'profile') main.innerHTML = profileViewHtml();
    else if (state.view === 'oneoff') main.innerHTML = oneOffViewHtml();
    else main.innerHTML = trainsViewHtml();
    renderSidebar();
    wireView();
  }

  /** The stage-dependent chrome around #main: seg, stop rail, ribbon, side nav. */
  function renderChrome() {
    const setup = state.stage === 'setup';
    const seg = $('#view-seg');
    seg.hidden = setup;
    for (const b of seg.querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b.dataset.view === state.homeView));
    }
    const meta = $('#top-meta');
    meta.hidden = !setup;
    if (setup) meta.textContent = t('configurator.setupMeta', { n: state.stop });
    $('#skip-setup').hidden = !setup;
    $('#resetup').hidden = setup;
    const stops = $('#stops');
    stops.hidden = !setup;
    if (setup) stops.innerHTML = stopRailHtml();
    const landed = $('#landed');
    const showLanded = !setup && state.justLanded;
    landed.hidden = !showLanded;
    if (showLanded) {
      landed.innerHTML = `<div class="landed-inner">
        <span class="ok-ic" aria-hidden="true">${icon('check', 17)}</span>
        <span class="sm"><b>${te('configurator.landedTitle')}</b> <span class="dim">${te('configurator.landedBody')}</span></span>
        <button type="button" class="btn ghost sm" style="margin-left:auto" id="landed-dismiss">${te('configurator.landedDismiss')}</button>
      </div>`;
      $('#landed-dismiss').addEventListener('click', () => { state.justLanded = false; landed.hidden = true; });
    }
    // Setup and Simple both run without the side nav — the nav IS Everything.
    $('#shell').classList.toggle('no-side', setup || (state.homeView === 'simple' && !state.editing && !state.editingPreset));
  }

  function render() {
    renderTopbar();
    renderChrome();
    renderMain();
  }

  /** Wire the pieces that only exist inside the view just rendered. */
  function wireView() {
    const rename = $('#rename-input');
    if (rename) { rename.focus(); rename.select(); }
    if (state.stage === 'setup') {
      if (state.stop === 2) { preview = mountPreview(); refreshSimpleChrome(); }
      scheduleIdleMock();
      return;
    }
    if (state.editing) wireConfigEditor();
    else if (state.editingPreset) wirePresetEditor();
    else if (state.homeView === 'simple') { preview = mountPreview(); refreshSimpleChrome(); scheduleIdleMock(); }
    else if (state.view === 'oneoff') wireOneOff();
  }

  function mountPreview() {
    const iframe = $('#preview');
    if (!iframe) return null;
    return createPreviewFrame({
      iframe, rollBtn: $('#preview-roll'), stillBtn: $('#preview-still'),
      overlayBase: OVERLAY_BASE, t: (k, p) => t(k, p),
    });
  }
  function previewCaption(settings) {
    const caption = $('#preview-caption');
    if (!caption) return;
    const s = normalizeSettings(settings);
    caption.textContent = s.mode === 'pass'
      ? t('configurator.captionPass', { mins: parseConfig(`interval=${encodeURIComponent(s.interval)}`).interval })
      : t('configurator.captionMarquee');
  }

  // ── Wiring: Raid Train Config editor ───────────────────────────────────
  function wireConfigEditor() {
    const slug = state.editing;
    const login = me();
    preview = mountPreview();

    const basisFor = (config) => normalizeSettings(getPreset(library, config.presetId ?? myProfile()?.defaultPresetId ?? null)?.settings ?? {});
    /**
     * The stored Config, with its overrides re-diffed against the CURRENT base.
     * A Config can arrive carrying fields that no longer differ — materializing
     * a deleted Preset bakes in all fifteen — and a field that matches the base
     * is not an override. Normalizing on read keeps the badges, the group tags
     * and the "Reset N overrides" count telling the same story.
     */
    const readConfig = () => {
      const stored = getTrainConfig(profiles, login, slug)
        ?? { presetId: myProfile()?.defaultPresetId ?? null, overrides: {}, spotlight: [] };
      const base = basisFor(stored);
      return { ...stored, overrides: diffSettings(base, applySettings(base, stored.overrides)) };
    };

    function persist(config) {
      // Stamp when this Event ends while we can still see it in a good read.
      // Once it leaves the feed the store is the only thing that remembers,
      // and that memory is what lets the Live Link drop it on positive
      // evidence rather than on absence (#31).
      profiles = upsertTrainConfig(profiles, login, slug, {
        ...config, endsAt: feedEndsAt(slug) ?? config.endsAt ?? null,
      });
      saveProfiles();
      refreshEditorChrome();
    }
    function refreshEditorChrome() {
      const config = readConfig();
      const count = Object.keys(config.overrides ?? {}).length;
      const reset = $('.reset-all');
      if (reset) {
        reset.hidden = count === 0;
        reset.textContent = resetOverridesLabel(count);
      }
      const url = $('#cfg-url');
      if (url) url.value = trainOverlayUrl(slug);
      // The chip on the train's card carries the override count. An auto-prune
      // (#31) removes the record entirely, so without this the stale "+0"
      // artifact just persists in the DOM. No-ops when the card isn't mounted.
      paintCard(slug);
      const { settings, spotlight } = trainSettings(slug);
      previewCaption(settings);
      preview?.render(buildOverlayQuery({ ...settings, event: slug, spotlight: spotlight.join(',') }), slug);
    }

    settingsForm = mountSettingsForm({
      root: $('#settings-root'),
      prefix: 'cfg',
      t: (k, p) => t(k, p),
      getState: () => {
        const config = readConfig();
        const base = basisFor(config);
        return { values: applySettings(base, config.overrides), base };
      },
      onChange: (key, value) => {
        const config = readConfig();
        const base = basisFor(config);
        const next = applySettings(base, { ...config.overrides, [key]: value });
        persist({ ...config, overrides: diffSettings(base, next) });
      },
      onRevert: (key) => {
        const config = readConfig();
        const overrides = { ...config.overrides };
        delete overrides[key];
        persist({ ...config, overrides });
      },
    });

    $('#cfg-preset')?.addEventListener('change', (e) => {
      // Switching Preset must not change what's on stream: re-diff the SAME
      // effective settings against the new base, so a train pinned to tron
      // stays on tron — and an override the new Preset already satisfies
      // quietly stops being an override.
      const config = readConfig();
      const effective = applySettings(basisFor(config), config.overrides);
      const next = { ...config, presetId: e.target.value || null };
      persist({ ...next, overrides: diffSettings(basisFor(next), effective) });
      settingsForm.sync();
    });
    $('#cfg-spotlight')?.addEventListener('input', (e) => {
      const names = e.target.value.split(',').map((n) => n.trim()).filter(Boolean);
      persist({ ...readConfig(), spotlight: names });
    });

    refreshEditorChrome();
  }

  // ── Wiring: Preset editor ──────────────────────────────────────────────
  function wirePresetEditor() {
    const id = state.editingPreset;
    preview = mountPreview();
    const settingsOf = () => normalizeSettings(getPreset(library, id)?.settings ?? {});
    function refreshChrome() {
      const settings = settingsOf();
      previewCaption(settings);
      preview?.render(buildOverlayQuery({ ...settings, event: DEMO_EVENT }), DEMO_EVENT);
    }
    settingsForm = mountSettingsForm({
      root: $('#settings-root'),
      prefix: 'pst',
      t: (k, p) => t(k, p),
      getState: () => ({ values: settingsOf(), base: null }),
      onChange: (key, value) => {
        library = updatePresetSettings(library, id, { ...settingsOf(), [key]: value });
        saveLibrary();
        refreshChrome();
      },
    });
    refreshChrome();
  }

  // ── Wiring: One-off link ───────────────────────────────────────────────
  function harvestStreamers() {
    if (oneOff.source !== 'manual') return;
    const handles = oneOff.manual.djs.map((d) => (d.handle || '').trim()).filter(Boolean);
    if (handles.length === 0) return;
    streamers = addStreamers(streamers, handles);
    saveStreamers();
    manualEditor?.refresh();
  }

  function wireOneOff() {
    preview = mountPreview();
    settingsForm = mountSettingsForm({
      root: $('#settings-root'),
      prefix: 'one',
      t: (k, p) => t(k, p),
      getState: () => ({ values: oneOff.settings, base: null }),
      onChange: (key, value) => { oneOff.settings = normalizeSettings({ ...oneOff.settings, [key]: value }); refreshOneOff(); },
    });

    const setSource = (next) => {
      oneOff.source = next;
      $('#src-raidpal').classList.toggle('active', next === 'raidpal');
      $('#src-manual').classList.toggle('active', next === 'manual');
      $('#src-raidpal').setAttribute('aria-pressed', String(next === 'raidpal'));
      $('#src-manual').setAttribute('aria-pressed', String(next === 'manual'));
      $('#raidpal-source').hidden = next !== 'raidpal';
      $('#manual-source').hidden = next !== 'manual';
      if (next === 'manual' && !manualEditor) {
        manualEditor = mountManualEditor({
          root: $('#manual-source'), state: oneOff.manual, onChange: refreshOneOff, t: (k, p) => t(k, p),
          getStreamers: () => listStreamers(streamers),
          onForgetStreamer: (h) => { streamers = removeStreamer(streamers, h); saveStreamers(); },
          onAddStreamer: (h) => { streamers = addStreamers(streamers, [h]); saveStreamers(); },
        });
      }
      refreshOneOff();
    };
    $('#src-raidpal').addEventListener('click', () => setSource('raidpal'));
    $('#src-manual').addEventListener('click', () => setSource('manual'));
    $('#f-event').addEventListener('input', (e) => { oneOff.event = e.target.value; refreshOneOff(); });
    $('#one-spotlight').addEventListener('input', (e) => { oneOff.spotlight = e.target.value; refreshOneOff(); });
    $('#f-event').addEventListener('blur', () => {
      const slug = extractSlug(oneOff.event);
      if (slug && slug !== oneOff.event.trim()) { oneOff.event = slug; $('#f-event').value = slug; refreshOneOff(); }
    });
    if (oneOff.source === 'manual' && !manualEditor) setSource('manual');
    else refreshOneOff();
  }

  // Re-validate a slug against RaidPal only when it CHANGES; every other tweak
  // just re-renders the preview in place — no refetch on a theme change.
  let validatedSlug = null;
  let validateToken = 0;
  let oneOffTimer = null;
  function refreshOneOff() {
    const formState = { source: oneOff.source, event: oneOff.event, manual: oneOff.manual, ...oneOff.settings, spotlight: oneOff.spotlight };
    const query = buildOverlayQuery(formState);
    const params = new URLSearchParams(query);
    const urlBox = $('#oneoff-url');
    const copyBtn = $('[data-act="copy-oneoff"]');
    const hasSource = params.has('event') || params.has('lineup');
    if (urlBox) { urlBox.value = hasSource ? `${OVERLAY_BASE}?${query}` : ''; }
    if (copyBtn) copyBtn.disabled = !hasSource;
    previewCaption(oneOff.settings);

    clearTimeout(oneOffTimer);
    oneOffTimer = setTimeout(async () => {
      const status = $('#slug-status');
      if (oneOff.source === 'manual') {
        if (status) { status.textContent = ''; status.className = 'status-dot'; }
        if (oneOff.manual.djs.some((d) => (d.handle || '').trim())) {
          preview?.render(query, params.get('lineup'));
        }
        return;
      }
      const slug = extractSlug(oneOff.event);
      if (!slug) {
        // Empty field → preview the built-in demo so the page is never blank, while
        // the copy URL stays empty (the demo must never leak into a copied link).
        if (status) { status.textContent = t('configurator.slugDemo'); status.className = 'status-dot ok'; }
        preview?.render(buildOverlayQuery({ ...formState, event: DEMO_EVENT }), DEMO_EVENT);
        return;
      }
      if (slug === DEMO_EVENT || slug === validatedSlug) {
        if (status) { status.textContent = t('configurator.slugFound', { slug }); status.className = 'status-dot ok'; }
        preview?.render(query, slug);
        return;
      }
      if (status) { status.textContent = t('configurator.slugChecking'); status.className = 'status-dot checking'; }
      const token = ++validateToken;
      try {
        await loadEvent(slug);
        if (token !== validateToken) return;
        validatedSlug = slug;
        if (status) { status.textContent = t('configurator.slugFound', { slug }); status.className = 'status-dot ok'; }
        preview?.render(query, slug);
      } catch {
        if (token !== validateToken) return;
        validatedSlug = null;
        if (status) { status.textContent = t('configurator.slugNotFound', { slug }); status.className = 'status-dot bad'; }
        preview?.reset();
      }
    }, 350);
  }

  // ── Navigation ─────────────────────────────────────────────────────────
  function go(view, opts = {}) {
    state.view = view;
    // Presets, Profile settings and the one-off door are Everything territory;
    // only the trains root keeps whichever frame (Simple/Everything) is up.
    if (view !== 'trains') state.homeView = 'everything';
    state.editing = null;
    state.editingPreset = null;
    state.renaming = opts.renaming ?? null;
    render();
  }

  for (const el of $$('.nav-item')) {
    el.addEventListener('click', () => go(el.dataset.nav));
  }

  // ── Profile menu ───────────────────────────────────────────────────────
  const profileBtn = $('#profile-btn');
  const profileMenu = $('#profile-menu');
  profileBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = profileMenu.classList.toggle('open');
    profileBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (!profileMenu.contains(e.target)) { profileMenu.classList.remove('open'); profileBtn.setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { profileMenu.classList.remove('open'); closeModal(); } });

  /**
   * Add (or switch to) a Profile, seed it a Preset, and load its trains.
   * `toStop` lands in the setup journey at that stop (the stop-1 Next button).
   * Otherwise a Profile that has never finished setup gets the journey from
   * stop 1 — the persisted-flag first-run rule — and a set-up one goes home.
   */
  function useProfile(rawLogin, { toStop = null } = {}) {
    const login = (rawLogin ?? '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    if (login === '') return;
    profiles = addProfile(profiles, login);
    profiles = setActiveProfile(profiles, login);
    saveProfiles();
    ensureStarterPreset(login);
    state.pastOpen = false;
    // All three cleanup fields are per-Profile: the notice belongs to the
    // Profile it was raised for, `cleanupRan` would otherwise let only the
    // session's FIRST Profile ever clean automatically, and `kept` is keyed by
    // slug alone — two Profiles joined to the same train share one.
    state.cleanup = null;
    state.cleanupRan = false;
    state.kept = new Set();
    if (toStop != null || !isSetupDone(profiles, login)) {
      state.stage = 'setup';
      state.stop = toStop ?? 1;
      state.copied = false;
      state.editing = null;
      state.editingPreset = null;
      render();
    } else {
      state.stage = 'home';
      go('trains');
    }
    loadFeed();
  }
  $('#profile-add-btn').addEventListener('click', () => {
    useProfile($('#profile-add-input').value);
    $('#profile-add-input').value = '';
    profileMenu.classList.remove('open');
  });
  $('#profile-add-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#profile-add-btn').click(); });
  profileMenu.addEventListener('click', (e) => {
    const item = e.target.closest('[data-act]');
    if (!item) { e.stopPropagation(); return; }
    profileMenu.classList.remove('open');
    if (item.dataset.act === 'switch-profile') { useProfile(item.dataset.name); toast(t('configurator.toastActingAs', { name: item.dataset.name })); }
    if (item.dataset.act === 'manage-profile') go('profile');
  });

  // ── Main-content actions (delegated: the views are re-rendered wholesale) ──
  $('#main').addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    // ── Variant D: setup + Simple actions ──
    if (act === 'theme') { writeBaseSetting('theme', el.dataset.id); repaintLook(); return; }
    if (act === 'themesmore') { state.themesOpen = !state.themesOpen; repaintLook(); return; }
    if (act === 'dispmode') { writeBaseSetting('mode', el.dataset.id); repaintLook(); return; }
    if (act === 'played') { writeBaseSetting('hidefinished', el.dataset.id === 'hide'); repaintLook(); return; }
    if (act === 'foot') {
      // `card` is the Overlay default — stored as null so the URL stays lean.
      writeIdlePref('upstyle', el.dataset.id === 'ticker' ? 'ticker' : null);
      toast(t('configurator.toastIdleUpdated'));
      repaintIdle();
      return;
    }
    if (act === 'uppos') {
      writeIdlePref('uppos', el.dataset.id === 'bc' ? null : el.dataset.id);
      toast(t('configurator.toastIdleUpdated'));
      repaintIdle();
      return;
    }
    if (act === 'stop') {
      e.preventDefault();
      const n = Number(el.dataset.id);
      if (n > 1 && !me()) { toast(t('configurator.toastAddProfileFirst')); return; }
      state.stop = n;
      render();
      return;
    }
    if (act === 'setup-next-1') {
      const value = $('#setup-login')?.value ?? '';
      if (value.trim() === '') { $('#setup-login')?.focus(); return; }
      useProfile(value, { toStop: 2 });
      return;
    }
    if (act === 'graduate') {
      if (!me()) { toast(t('configurator.toastAddProfileFirst')); return; }
      profiles = markSetupDone(profiles, me());
      saveProfiles();
      state.stage = 'home';
      state.homeView = 'simple';
      state.view = 'trains';
      state.editing = null;
      state.editingPreset = null;
      state.justLanded = true;
      render();
      return;
    }
    if (act === 'goto-everything') {
      state.homeView = 'everything';
      go('trains');
      return;
    }

    if (act === 'onboard') { useProfile($('#onboard-input').value); return; }
    if (act === 'goto-oneoff') { e.preventDefault(); go('oneoff'); return; }
    if (act === 'goto-presets') { e.preventDefault(); go('presets'); return; }
    if (act === 'goto-profile') { e.preventDefault(); go('profile'); return; }
    if (act === 'back-trains') { go('trains'); return; }
    if (act === 'back-presets') { go('presets'); return; }
    if (act === 'refresh-all') { loadFeed({ force: true }); return; }

    if (act === 'cleanup-keep') {
      const removed = state.cleanup?.removed ?? [];
      if (removed.length === 0 || state.cleanup.login !== me()) return;
      profiles = restoreTrainConfigs(profiles, me(), removed);
      saveProfiles();
      // Suppress for the session, or the next verified read deletes exactly
      // what was just asked for — possibly before the toast has faded.
      for (const { slug } of removed) state.kept.add(slug);
      state.cleanup = null;
      render();
      toast(plural(removed.length, 'configurator.toastCleanupKeptOne', 'configurator.toastCleanupKeptMany', { n: removed.length }));
      return;
    }

    if (act === 'cleanup-dismiss') { state.cleanup = null; render(); return; }

    if (act === 'toggle-past') {
      state.pastOpen = !state.pastOpen;
      el.classList.toggle('open', state.pastOpen);
      const list = $('.past-list');
      if (list) list.hidden = !state.pastOpen;
      return;
    }
    if (act === 'refresh-train') {
      el.classList.add('spin');
      const detail = await refreshEventDetail(el.dataset.slug, { fetchImpl: fetch.bind(window), storage: localStorage });
      state.feed.details[detail.slug] = detail;
      paintCard(detail.slug);
      toast(t(detail.error ? 'configurator.toastRefreshFailed' : 'configurator.toastRefreshed'));
      return;
    }
    if (act === 'copy-train-link') { copyText(trainOverlayUrl(el.dataset.slug), t('configurator.toastLinkCopied')); return; }
    if (act === 'open-config') {
      state.editing = el.dataset.slug;
      state.editingPreset = null;
      render();
      return;
    }
    if (act === 'copy-live') {
      const url = liveLinkUrl();
      if (!url) { toast(t('configurator.toastAddProfileFirst')); return; }
      copyText(url, t('configurator.toastLiveLinkCopied'));
      // Stop 3's finish bar promotes Finish the moment the link is copied —
      // Copy and Finish are a sequence, and this is the handover.
      if (state.stage === 'setup' && !state.copied) { state.copied = true; renderMain(); }
      return;
    }
    if (act === 'copy-uponly') {
      const url = upOnlyUrl();
      if (!url) { toast(t('configurator.toastAddProfileFirst')); return; }
      copyText(url, t('configurator.toastLinkCopied'));
      return;
    }
    if (act === 'copy-cfg-url') { copyText($('#cfg-url').value, t('configurator.toastLinkCopied')); return; }
    if (act === 'copy-oneoff') {
      const url = $('#oneoff-url').value;
      if (!url) return;
      copyText(url, t('configurator.toastLinkCopied'));
      harvestStreamers();
      return;
    }
    if (act === 'reset-overrides') {
      const config = getTrainConfig(profiles, me(), state.editing);
      profiles = upsertTrainConfig(profiles, me(), state.editing, { ...config, overrides: {} });
      saveProfiles();
      render();
      toast(t('configurator.toastOverridesReset'));
      return;
    }

    if (act === 'forget-config') {
      const slug = state.editing;
      const config = getTrainConfig(profiles, me(), slug);
      if (!config) return;
      const count = Object.keys(config.overrides ?? {}).length;
      // What it drops TO is the Profile's default Preset, not this Config's own
      // reference — with the record gone, resolveTrainSettings has nothing else
      // to read. No default means normalizeSettings({}): classic theme, pass
      // mode. That is the sharp edge, so the confirm names it outright.
      const preset = getPreset(library, myProfile()?.defaultPresetId ?? null);
      openModal(`<h3>${te('configurator.cfgForgetHead')}</h3>
        <p>${plural(count, 'configurator.cfgForgetCountOne', 'configurator.cfgForgetCountMany', { n: `<b>${count}</b>` })}</p>
        <p>${preset
          ? t('configurator.cfgForgetDropsToPreset', { name: `<b>${esc(preset.name)}</b>` })
          : te('configurator.cfgForgetDropsToDefaults')}</p>
        <p>${te('configurator.cfgForgetLinksNote')}</p>
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-forget" data-slug="${esc(slug)}">${te('configurator.cfgForgetConfirm')}</button>
        </div>`);
      return;
    }

    // ── Preset library ──
    if (act === 'new-preset') {
      const made = createPreset(library, t('configurator.newPresetName'), SETTINGS_DEFAULTS);
      library = made.library;
      saveLibrary();
      go('presets', { renaming: made.id });
      return;
    }
    if (act === 'dup-preset') {
      const made = duplicatePreset(library, el.dataset.id);
      library = made.library;
      saveLibrary();
      go('presets', { renaming: made.id }); // dupe → rename → editor is ONE flow
      return;
    }
    if (act === 'edit-preset') {
      if (e.target.id === 'rename-input') return; // an inline rename is in progress
      state.renaming = null;
      state.editingPreset = el.dataset.id;
      state.editing = null;
      render();
      return;
    }
    if (act === 'make-default' || act === 'make-default-editor') {
      if (!me()) { toast(t('configurator.toastAddProfileFirst')); return; }
      if (!getPreset(library, el.dataset.id)) { render(); return; } // a stale click must never dangle the default
      profiles = setDefaultPreset(profiles, me(), el.dataset.id);
      saveProfiles();
      render();
      toast(t('configurator.toastNowDefault', { name: getPreset(library, el.dataset.id).name }));
      return;
    }
    if (act === 'del-preset') {
      const preset = getPreset(library, el.dataset.id);
      if (!preset) return;
      const { configs, defaults } = countPresetReferences(profiles, el.dataset.id);
      openModal(`<h3>${te('configurator.delPresetHead', { name: preset.name })}</h3>
        ${configs
          ? `<p>${plural(configs, 'configurator.delPresetUsedOne', 'configurator.delPresetUsedMany', { n: `<b>${configs}</b>` })}</p>`
          : `<p>${te('configurator.delPresetUnused')}</p>`}
        ${defaults ? `<p>${plural(defaults, 'configurator.delPresetDefaultOne', 'configurator.delPresetDefaultMany')}</p>` : ''}
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-del" data-id="${esc(el.dataset.id)}">${te('configurator.delPresetConfirm')}</button>
        </div>`);
      return;
    }

    // ── Profile settings ──
    if (act === 'add-spot') {
      const input = $('#spot-input');
      const name = input.value.trim().replace(/,/g, '');
      if (!name) return;
      profiles = addSpotlight(profiles, me(), name);
      saveProfiles();
      render();
      $('#spot-input')?.focus();
      toast(t('configurator.toastSpotlightAdded', { name }));
      return;
    }
    if (act === 'rm-spot') {
      profiles = removeSpotlight(profiles, me(), el.dataset.name);
      saveProfiles();
      render();
      return;
    }
    if (act === 'export-backup') {
      const blob = await encodeBackup({ presets: library, profiles, streamers });
      $('#backup-blob').value = blob;
      copyText(blob, t('configurator.toastBackupCopied'));
      return;
    }
    if (act === 'import-backup') {
      const decoded = await decodeBackup($('#backup-blob').value.trim());
      if (!decoded) { toast(t('configurator.toastBadBackup')); return; }
      openModal(`<h3>${te('configurator.restoreHead')}</h3>
        <p>${t('configurator.restoreCounts', {
          presets: `<b>${Object.keys(decoded.presets).length}</b>`,
          profiles: `<b>${listProfiles(decoded.profiles).length}</b>`,
        })}</p>
        <p>${t('configurator.restoreWarn')}</p>
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-import">${te('configurator.restoreConfirm')}</button>
        </div>`);
      pendingImport = decoded;
      return;
    }
    if (act === 'remove-profile') {
      openModal(`<h3>${te('configurator.removeProfileHead', { login: me() })}</h3>
        <p>${te('configurator.removeProfileBody')}</p>
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-remove-profile">${te('configurator.removeProfileConfirm')}</button>
        </div>`);
      return;
    }
  });

  // Simple/stop-2 look edits + idle-knob drags. Ranges refresh chrome in
  // place on `input` (a re-render mid-drag would eat the thumb); the commit
  // toast and any layout-changing rebuild wait for `change` below.
  $('#main').addEventListener('input', (e) => {
    const el = e.target;
    const act = el.dataset?.act;
    if (act === 'size') {
      writeBaseSetting('scale', el.value);
      const out = el.closest('.rangerow')?.querySelector('output');
      if (out) out.textContent = `${Number(el.value).toFixed(1)}x`;
      refreshSimpleChrome();
      return;
    }
    if (act === 'interval') {
      if (el.value !== '') writeBaseSetting('interval', el.value);
      refreshSimpleChrome();
      renderChrome();
      return;
    }
    if (act === 'open') {
      writeBaseSetting('openslots', el.checked);
      refreshSimpleChrome();
      return;
    }
    if (el.id === 'll-op') {
      writeIdlePref('upop', el.value);
      const out = el.closest('.rangerow')?.querySelector('output');
      if (out) out.textContent = `${Math.round(Number(el.value) * 100)}%`;
      // Live, without rebuilding the mock — a rebuild would replay the row
      // animation on every tick of the drag.
      $('#idle-mock .up')?.style.setProperty('--upop', el.value);
      return;
    }
    if (el.id === 'll-cycle') {
      writeIdlePref('upcycle', el.value);
      const out = el.closest('.rangerow')?.querySelector('output');
      if (out) out.textContent = `${el.value}s`;
      return;
    }
    if (el.id === 'll-scroll') {
      // The slider is inverted (right = faster), so convert back to a duration.
      const duration = String(UPSCROLL_FLIP - Number(el.value));
      writeIdlePref('upscroll', duration);
      const out = el.closest('.rangerow')?.querySelector('output');
      if (out) out.textContent = `${duration}s`;
      $('#idle-mock .up.ticker')?.style.setProperty('--tickdur', `${duration}s`);
      return;
    }
  });

  // Live Link idle-card controls (change events, so they live on their own).
  $('#main').addEventListener('change', (e) => {
    if (e.target.id === 'll-idle-toggle') {
      const horizon = $('#ll-horizon');
      writeIdlePref('upcoming', e.target.checked ? (horizon?.value ?? '3') : null);
      toast(t(e.target.checked ? 'configurator.toastIdleOn' : 'configurator.toastIdleOff'));
      repaintIdle();
      return;
    }
    if (e.target.id === 'll-horizon') {
      writeIdlePref('upcoming', e.target.value);
      toast(t('configurator.toastHorizonUpdated'));
      repaintIdle();
      return;
    }
    // The knob drags above commit here: repaint the section so the derived
    // hints (page math, cycle caption) catch up, and say the URL changed —
    // never renderMain, which would reload the preview iframe (a flicker).
    if (['ll-op', 'll-cycle', 'll-scroll'].includes(e.target.id)) {
      toast(t('configurator.toastIdleUpdated'));
      repaintIdle();
      return;
    }
    if (e.target.dataset?.act === 'interval') { repaintLook(); return; }
    if (e.target.id === 'default-preset-select') {
      profiles = setDefaultPreset(profiles, me(), e.target.value || null);
      saveProfiles();
      toast(t('configurator.toastDefaultUpdated'));
    }
  });

  // ── Variant D top-bar chrome ───────────────────────────────────────────
  $('#view-seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]');
    if (!b || b.dataset.view === state.homeView) return;
    state.homeView = b.dataset.view;
    state.editing = null;
    state.editingPreset = null;
    state.view = 'trains';
    render();
  });
  $('#skip-setup').addEventListener('click', () => {
    // Skipping IS completing, as far as first-run detection goes — the setup
    // journey must never reappear for a Profile that has waved it away.
    if (me()) {
      profiles = markSetupDone(profiles, me());
      saveProfiles();
      state.homeView = 'simple';
    } else {
      state.homeView = 'everything'; // anonymous home has its onboarding card
    }
    state.stage = 'home';
    state.view = 'trains';
    render();
  });
  $('#resetup').addEventListener('click', () => {
    state.stage = 'setup';
    state.stop = 1;
    state.copied = false;
    state.justLanded = false;
    render();
  });
  // The stop rail sits above #main, outside its delegated listener — every
  // stop is a door, so it needs its own.
  $('#stops').addEventListener('click', (e) => {
    const el = e.target.closest('[data-act="stop"]');
    if (!el) return;
    const n = Number(el.dataset.id);
    if (n > 1 && !me()) { toast(t('configurator.toastAddProfileFirst')); return; }
    state.stop = n;
    render();
  });

  // ── Preset renaming (inline in the library, and the editor's title) ─────
  function commitRename(input) {
    const id = input.dataset.id;
    const name = input.value.trim();
    state.renaming = null;
    if (name && name !== getPreset(library, id)?.name) {
      library = renamePreset(library, id, name);
      saveLibrary();
    }
    // Post-duplicate intent is always "now customize it": any commit drops
    // straight into the new Preset's editor. Escape stays in the library.
    state.editingPreset = id;
    render();
  }
  $('#main').addEventListener('keydown', (e) => {
    if (e.target.id === 'rename-input') {
      if (e.key === 'Enter') commitRename(e.target);
      if (e.key === 'Escape') { state.renaming = null; render(); }
      return;
    }
    if (e.target.id === 'preset-title-input') {
      if (e.key === 'Enter') e.target.blur();
      if (e.key === 'Escape') { e.target.value = getPreset(library, e.target.dataset.id)?.name ?? ''; e.target.blur(); }
      return;
    }
    if (e.target.id === 'spot-input' && e.key === 'Enter') $('[data-act="add-spot"]')?.click();
    if (e.target.id === 'onboard-input' && e.key === 'Enter') $('[data-act="onboard"]')?.click();
  });
  $('#main').addEventListener('focusout', (e) => {
    if (e.target.id === 'rename-input' && state.renaming) commitRename(e.target);
    if (e.target.id === 'preset-title-input') {
      const id = e.target.dataset.id;
      const name = e.target.value.trim();
      const current = getPreset(library, id);
      if (!current || !name || name === current.name) { e.target.value = current?.name ?? ''; return; }
      library = renamePreset(library, id, name);
      saveLibrary();
      toast(t('configurator.toastRenamed', { name }));
      // Patch the label in place rather than re-rendering: an in-flight click on
      // "Make default" must still land on a Preset that exists.
      e.target.value = getPreset(library, id).name;
    }
  });

  // ── Modal actions ──────────────────────────────────────────────────────
  $('#modal-scrim').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) { closeModal(); return; }
    const el = e.target.closest('[data-mact]');
    if (!el) return;
    const act = el.dataset.mact;
    if (act === 'cancel') { closeModal(); pendingImport = null; return; }
    if (act === 'confirm-del') {
      const id = el.dataset.id;
      const name = getPreset(library, id)?.name ?? '';
      // Bake the Preset into every referencing Config FIRST, so nothing dangles
      // and nothing changes on stream — then drop it from the library.
      profiles = materializePreset(profiles, library, id);
      library = deletePreset(library, id);
      saveProfiles();
      saveLibrary();
      closeModal();
      go('presets');
      toast(t('configurator.toastDeleted', { name }));
      return;
    }
    if (act === 'confirm-forget') {
      // Back to the train list, not the editor: the editor would immediately
      // re-synthesize a default Config from readConfig() and the deletion
      // would read as having done nothing.
      profiles = deleteTrainConfig(profiles, me(), el.dataset.slug);
      saveProfiles();
      closeModal();
      state.editing = null;
      go('trains');
      toast(t('configurator.toastConfigForgotten'));
      return;
    }
    if (act === 'confirm-import') {
      if (!pendingImport) { closeModal(); return; }
      library = pendingImport.presets;
      profiles = pendingImport.profiles;
      streamers = pendingImport.streamers;
      pendingImport = null;
      saveLibrary(); saveProfiles(); saveStreamers();
      closeModal();
      go('trains');
      loadFeed();
      toast(t('configurator.toastBackupRestored'));
      return;
    }
    if (act === 'confirm-remove-profile') {
      profiles = removeProfile(profiles, me());
      saveProfiles();
      closeModal();
      go('trains');
      if (me()) loadFeed();
      toast(t('configurator.toastProfileRemoved'));
    }
  });

  // ── Init ───────────────────────────────────────────────────────────────
  // A landing-page door (`?theme=…`, `#manual`) or an old shared Configurator
  // link opens the one-off view, hydrated from the query. Otherwise the
  // Profile's My Raid Trains is home.
  (async function start() {
    // Bind the translator before anything renders — every view goes through it,
    // and an unbound `t` would paint raw message keys.
    const search = window.location.search.replace(/^\?/, '');
    // An explicit ?lang= picks the page's language too; otherwise follow the browser.
    pageLocale = resolveLocale(parseConfig(search).lang, navigator.languages);
    const messages = await loadMessages(pageLocale);
    t = makeT(messages);
    // The header, sidebar and profile menu are authored as static markup, so they
    // localize through data-i18n rather than a template literal. Everything below
    // #main is rendered by render() and already reads through `t`.
    document.documentElement.lang = pageLocale;
    document.title = t('configurator.title');
    localizeDom(document, messages);
    // A query string means "build a one-off link from these params" — EXCEPT
    // `lang`, which selects the page's own language and says nothing about
    // which view to open. Counting it opened the One-off view for `?lang=de`,
    // so the localized My Raid Trains / Preset / Profile views were unreachable
    // by URL at all (a German browser reached them, a German link never did).
    const viewParams = new URLSearchParams(search);
    viewParams.delete('lang');
    const wantsOneOff = [...viewParams.keys()].length > 0 || window.location.hash === '#manual';
    if (wantsOneOff) {
      const config = parseConfig(search);
      const params = new URLSearchParams(search);
      oneOff.event = config.event ?? '';
      oneOff.spotlight = params.get('spotlight') ?? '';   // raw, so the form keeps the typed casing
      oneOff.settings = normalizeSettings({
        theme: config.theme,
        mode: config.mode,
        interval: String(config.interval),
        speed: String(config.speed),
        track: config.track,
        trackfadein: String(config.trackfadein),
        trackfadeout: String(config.trackfadeout),
        scale: String(config.scale),
        height: String(config.height),
        refresh: config.refresh ? String(config.refresh) : '',
        openslots: config.openslots,
        hidefinished: config.hidefinished,
        enginedim: config.enginedim,
        tz: params.get('tz') ?? '',
        lang: config.lang ?? '',
      });
      if (config.lineup) {
        const model = decodeLineup(config.lineup);
        if (model) {
          const durations = (model.d ?? []).map((x) => snapDuration(x.d));
          const gcd = (a, b) => (b ? gcd(b, a % b) : a);
          const base = durations.length ? durations.reduce((g, n) => gcd(g, n), 0) : 60;
          Object.assign(oneOff.manual, {
            title: model.t,
            organiser: model.o?.n ?? '',
            zone: model.z || detectedZone,
            startISO: model.s ? instantToZonedWallClock(model.s, model.z || detectedZone) : freshStartISO(),
            slotMins: base,
            djs: (model.d ?? []).map((x, i) => ({ handle: x.h, slots: Math.max(1, Math.round(durations[i] / base)) })),
          });
          oneOff.source = 'manual';
        }
      }
      if (window.location.hash === '#manual') oneOff.source = 'manual';
      state.view = 'oneoff';
      state.homeView = 'everything';
    }
    // First-run detection (Variant D): a persisted per-Profile flag, set by
    // finishing or skipping the setup journey — never inferred from data. No
    // Profile at all is also a first run. A one-off door skips the question.
    if (!wantsOneOff && (!me() || !isSetupDone(profiles, me()))) {
      state.stage = 'setup';
      state.stop = 1;
    }
    render();
    if (!wantsOneOff && me()) loadFeed();
  })();
</script>
</body>
</html>

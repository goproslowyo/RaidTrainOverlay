<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaidTrainOverlay — Configurator</title>
  <!--
    The Configurator: an app shell over the streamer's own RaidPal raid trains.

    A Profile is a bare Twitch login; its My Raid Trains list comes from the
    RaidPal user endpoint (src/my-raid-trains.js, ~6h cache). Each train gets a
    Raid Train Config — a Preset reference plus a sparse per-field override diff
    — and the Live Link folds all of that into ONE URL keyed to the username.

    Everything local lives in this page's own localStorage; the Overlay never
    reads it (the URL is the only thing it consumes). Thin wiring only: the
    settings schema, both editors' form, the train list, the Live Link URL and
    every store are testable modules under src/.
  -->
  <style>
    :root {
      --bg: #0f1216;
      --panel: #191e25;
      --panel-2: #222834;
      --panel-3: #2a3140;
      --ink: #e7ecf3;
      --muted: #96a2b4;
      --line: #2b313c;
      --accent: #57b6ff;
      --accent-dim: #9ad;
      --gold: #f4c430;
      --live: #ff5a67;
      --ok: #5ed18a;
      --warn: #ffb454;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    /* Dark native controls, scoped to the CONTROLS — not :root — on purpose: a dark
       :root forces the transparent preview iframe to an opaque white backdrop. */
    input, select, textarea { color-scheme: dark; }
    html, body { margin: 0; }
    body {
      background: radial-gradient(1200px 500px at 70% -200px, #1a2230 0%, transparent 60%), var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    a { color: var(--accent); }
    button { font: inherit; cursor: pointer; }
    input[type=text], input[type=number], select, textarea {
      width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--ink); font: inherit;
    }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input:disabled, select:disabled { cursor: not-allowed; }

    /* ── Top bar ──────────────────────────────────────────────────────── */
    .top {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 28px; border-bottom: 1px solid var(--line);
      background: rgba(15, 18, 22, .85); backdrop-filter: blur(6px);
      position: sticky; top: 0; z-index: 40;
    }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.3px; white-space: nowrap; }
    .brand h1 .a { color: var(--gold); }
    .brand .sep { color: var(--line); }
    .brand .app { color: var(--muted); font-size: 14px; font-weight: 600; }
    .brand-train { display: flex; align-items: flex-end; gap: 3px; padding-bottom: 3px; }
    .brand-train i { display: block; width: 14px; height: 9px; border-radius: 2px; border: 1px solid #0007; }
    .brand-train i:nth-child(1) { background: #b45309; border-color: var(--gold); width: 16px; height: 11px; }
    .brand-train i:nth-child(2) { background: #1e3a5f; }
    .brand-train i:nth-child(3) { background: #5b2a78; }

    /* ── Profile switcher ─────────────────────────────────────────────── */
    .profile-wrap { position: relative; margin-left: auto; }
    .profile-btn {
      display: flex; align-items: center; gap: 9px;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
      color: var(--ink); padding: 5px 13px 5px 6px; font-weight: 600; transition: border-color .15s;
    }
    .profile-btn:hover { border-color: var(--accent); }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #0c1016; background: var(--accent);
    }
    .profile-btn .chev { color: var(--muted); font-size: 11px; }
    .profile-menu {
      position: absolute; right: 0; top: calc(100% + 8px); width: 320px; z-index: 60;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 14px 40px #000a; padding: 8px; display: none;
    }
    .profile-menu.open { display: block; animation: pop .14s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
    .menu-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); padding: 6px 10px 4px; font-weight: 700;
    }
    .profile-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--ink); text-align: left;
    }
    .profile-item:hover { background: var(--panel-2); }
    .profile-item .p-name { font-weight: 700; }
    .profile-item .p-sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
    .profile-item .p-check { margin-left: auto; color: var(--ok); font-weight: 700; }
    .profile-add { display: flex; gap: 6px; padding: 8px 6px 4px; border-top: 1px solid var(--line); margin-top: 6px; }
    .profile-add input { flex: 1; padding: 7px 10px; font-size: 13px; }
    .profile-add button {
      padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--ink); font-weight: 600; white-space: nowrap;
    }
    .profile-add button:hover { border-color: var(--accent); }
    .profile-hint { color: var(--muted); font-size: 11.5px; padding: 4px 10px 6px; }
    .p-manage { border-top: 1px solid var(--line); margin-top: 6px; }
    .p-gear { width: 26px; text-align: center; color: var(--muted); font-size: 15px; flex: none; }

    /* ── Shell ────────────────────────────────────────────────────────── */
    .shell { display: flex; gap: 26px; max-width: 1240px; margin: 0 auto; padding: 26px 28px 60px; }
    .side { width: 224px; flex: none; position: sticky; top: 84px; align-self: flex-start; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: 0; border-left: 2px solid transparent; border-radius: 0 8px 8px 0;
      padding: 9px 12px; color: var(--muted); font-weight: 600; text-align: left; font-size: 14.5px;
    }
    .nav-item:hover { color: var(--ink); background: #1a1f27; }
    .nav-item.active { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
    .nav-item .n-count {
      margin-left: auto; font-size: 12px; color: var(--muted);
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; line-height: 18px;
    }
    .nav-item.active .n-count { background: var(--panel-3); }
    .nav-item .n-gold { color: var(--gold); }
    .side hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
    .nav-item.secondary { font-size: 13.5px; }
    .side .side-note { color: var(--muted); font-size: 11.5px; padding: 10px 12px 0; line-height: 1.5; }

    main { flex: 1; min-width: 0; }
    .view-title { font-size: 20px; margin: 2px 0 4px; letter-spacing: -.3px; }
    .view-sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
    .view-sub b { color: var(--ink); font-weight: 600; }

    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 18px 20px; margin-bottom: 16px;
    }
    h2.card-h {
      font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em;
      color: var(--accent-dim); margin: 0 0 12px; font-weight: 700;
    }
    .hint { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }
    .meta-warn { color: var(--warn); }

    .btn {
      padding: 8px 15px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--ink); font-weight: 600; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--accent); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #08121c; }
    .btn.gold { background: var(--gold); border-color: var(--gold); color: #1f2937; font-weight: 700; }
    .btn.sm { padding: 5px 11px; font-size: 13px; }
    .icon-btn {
      width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--muted); font-size: 15px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; flex: none;
    }
    .icon-btn:hover { color: var(--ink); border-color: var(--accent); }
    .icon-btn.accent { color: var(--accent); border-color: #2c4356; background: #57b6ff10; }
    .icon-btn.destructive { color: #d9737c; border-color: #4a262c; }
    .icon-btn.destructive:hover { color: #ffb4ba; background: #52242a; border-color: #7c3540; }
    .icon-btn svg { display: block; }
    .icon-btn.spin { animation: spin .8s linear infinite; color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back-link {
      display: inline-flex; align-items: center; gap: 7px; background: none; border: 0;
      color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 0; margin-bottom: 12px;
    }
    .back-link:hover { color: var(--accent); }

    /* ── Live Link hero ───────────────────────────────────────────────── */
    .live-link {
      border-color: #4a4126;
      background: linear-gradient(180deg, rgba(244, 196, 48, .055), transparent 55%), var(--panel);
      position: relative; overflow: hidden;
    }
    .live-link::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(var(--gold), #a87e0c);
    }
    .live-link.flash { animation: flashcard 1.1s ease; }
    @keyframes flashcard { 0%, 40% { box-shadow: 0 0 0 2px var(--gold), 0 0 34px #f4c43055; } 100% { box-shadow: none; } }
    .ll-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .ll-head h2 { font-size: 16px; margin: 0; color: var(--gold); }
    .ll-badge {
      font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold); border: 1px solid #4a4126; background: #f4c43014; border-radius: 999px; padding: 2px 9px;
    }
    .ll-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
    .ll-sub b { color: var(--ink); font-weight: 600; }
    .url-row { display: flex; gap: 8px; }
    .url-row input {
      flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px; background: #0c0f14; border-color: var(--line); color: var(--accent-dim); padding: 10px 12px;
    }
    .url-row .btn { padding-left: 18px; padding-right: 18px; }
    .ll-note { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 12.5px; margin-top: 9px; }
    .ll-note .w { color: var(--warn); flex: none; }
    /* The blob is over the cap — this link's per-train settings are already
       broken, so it outranks the standard re-paste note beneath it. */
    .ll-note.bad {
      color: var(--ink); border: 1px solid #5a2c2c; background: #ff6b6b12;
      border-radius: 8px; padding: 9px 11px; margin-top: 11px;
    }
    .ll-note.bad .w { color: var(--bad); }
    .ll-idle {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--line);
    }
    .ll-idle label.chk { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .ll-idle input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--gold); }
    .ll-idle select { width: auto; padding: 6px 10px; font-size: 13.5px; }
    .ll-idle select:disabled { opacity: .45; }
    .ll-meta { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
    .ll-meta a { color: var(--accent-dim); }

    /* ── Event cards ──────────────────────────────────────────────────── */
    .event-card { display: flex; align-items: flex-start; gap: 16px; padding: 15px 18px; }
    .event-main { flex: 1; min-width: 0; }
    .event-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .event-title { font-size: 15.5px; font-weight: 700; letter-spacing: -.2px; }
    .event-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .event-meta b { color: var(--ink); font-weight: 600; }
    .event-actions { display: flex; align-items: center; gap: 7px; flex: none; padding-top: 3px; }
    .chip-live {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
      color: var(--live); border: 1px solid #5c2b31; background: #ff5a6714;
      border-radius: 999px; padding: 2px 9px 2px 7px;
    }
    .chip-live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.4s ease infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #ff5a6766; } 55% { box-shadow: 0 0 0 5px #ff5a6700; } }
    .chip-org {
      font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold); border: 1px solid #4a4126; background: #f4c43010; border-radius: 999px; padding: 2px 9px;
    }
    .chip-cfg {
      font-size: 11px; font-weight: 600; color: var(--accent-dim);
      border: 1px solid #2c4356; background: #57b6ff10; border-radius: 999px; padding: 1.5px 9px;
    }
    .event-card.is-live { border-color: #5c2b31; box-shadow: 0 0 22px #ff5a6712; }
    .mini-train { display: inline-flex; align-items: flex-end; gap: 3px; margin-top: 9px; height: 14px; }
    .mini-train .mt-e { width: 15px; height: 12px; border-radius: 2.5px 1.5px 1.5px 2.5px; background: #b45309; border: 1px solid #f4c43088; }
    .mini-train .mt-c { width: 13px; height: 10px; border-radius: 2px; border: 1px solid #0006; background: var(--car-bg, #1e3a5f); }
    .mini-train .mt-c[style*="--car:1"] { --car-bg: #5b2a78; }
    .mini-train .mt-c[style*="--car:2"] { --car-bg: #14361f; }
    .mini-train .mt-c[style*="--car:3"] { --car-bg: #6b3d12; }
    .mini-train .mt-c[style*="--car:4"] { --car-bg: #3d1f42; }
    .mini-train .mt-c[style*="--car:5"] { --car-bg: #173a3a; }
    .mini-train .mt-c.open { background: transparent; border: 1px dashed #4a5568; }
    .mini-train .mt-more { color: var(--muted); font-size: 10.5px; padding-left: 3px; align-self: center; }

    .past-divider {
      display: flex; align-items: center; gap: 14px; width: 100%;
      background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 600;
      padding: 10px 4px; margin: 4px 0;
    }
    .past-divider::before, .past-divider::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
    .past-divider:hover { color: var(--ink); }
    .past-divider .pd-chev { font-size: 11px; transition: transform .18s; display: inline-block; }
    .past-divider.open .pd-chev { transform: rotate(180deg); }
    .event-card.past {
      filter: grayscale(1); opacity: .55; padding: 10px 18px; margin-bottom: 10px;
      transition: opacity .15s, filter .15s;
    }
    .event-card.past:hover { opacity: .9; filter: grayscale(.5); }
    .stamp {
      font-size: 9.5px; font-weight: 800; letter-spacing: .14em; color: var(--muted);
      border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 7px;
      transform: rotate(-5deg); user-select: none;
    }

    /* ── Preview ──────────────────────────────────────────────────────── */
    .preview-frame {
      width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; position: relative; background-color: #0e0f12;
      /* Checkerboard = "this is transparent" (what OBS composites over your scene). */
      background-image:
        linear-gradient(45deg, #20242c 25%, transparent 25%, transparent 75%, #20242c 75%),
        linear-gradient(45deg, #20242c 25%, transparent 25%, transparent 75%, #20242c 75%);
      background-size: 28px 28px; background-position: 0 0, 14px 14px;
    }
    .preview-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .preview-placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; color: var(--muted); font-size: 15px;
    }
    .preview-controls { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; gap: 6px; }
    .preview-btn {
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(14, 15, 18, .82); color: var(--ink); font: inherit; font-size: 13px;
      font-weight: 600; backdrop-filter: blur(3px);
    }
    .preview-btn:hover { border-color: var(--accent); }
    .preview-btn.is-rolling { background: var(--accent); color: #08121c; border-color: var(--accent); }
    .preview-caption { color: var(--muted); font-size: 13px; margin: 8px 2px 0; min-height: 18px; }

    /* ── Settings form (src/settings-form.js) ─────────────────────────── */
    details.fgroup { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 10px; background: #171b22; }
    details.fgroup:last-of-type { margin-bottom: 0; }
    details.fgroup summary {
      display: flex; align-items: center; gap: 10px; list-style: none; cursor: pointer;
      padding: 10px 14px; user-select: none;
    }
    details.fgroup summary::-webkit-details-marker { display: none; }
    .g-label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-dim); font-weight: 700; }
    details.fgroup summary:hover .g-label { color: var(--ink); }
    .g-ovr {
      font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      color: var(--warn); border: 1px solid #5a4426; background: #ffb45412; border-radius: 999px; padding: 1px 8px;
    }
    .g-ovr:empty { display: none; }
    .g-chev { margin-left: auto; color: var(--muted); font-size: 11px; transition: transform .15s; }
    details.fgroup[open] .g-chev { transform: rotate(180deg); }
    .fgroup-body { padding: 6px 14px 14px; border-top: 1px solid var(--line); }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field.dimmed { opacity: .45; }
    .field-head { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; min-height: 24px; }
    .field-head label { font-weight: 600; }
    .ovr-slot { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
    .ovr-badge {
      font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
      color: var(--warn); border: 1px solid #5a4426; background: #ffb45412;
      border-radius: 999px; padding: 2px 9px; animation: pop .15s ease;
    }
    .ovr-revert {
      width: 24px; height: 24px; border-radius: 6px; border: 1px solid #5a4426;
      background: transparent; color: var(--warn); font-size: 13px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ovr-revert:hover { background: #ffb45418; }
    .range-row { display: flex; align-items: center; gap: 12px; }
    .range-out { min-width: 3ch; text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700; }
    .check-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
    .check-row input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }

    .preset-ref { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .preset-ref select { width: 260px; }
    .preset-ref .lbl { font-weight: 700; font-size: 14px; }
    .editor-head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 2px; }
    .editor-head-row h2 { font-size: 19px; margin: 0; letter-spacing: -.3px; }
    .cfg-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .cfg-toolbar .reset-all {
      margin-left: auto; background: none; border: 0; color: var(--warn); font-size: 13px; font-weight: 600; padding: 0;
    }
    .cfg-toolbar .reset-all:hover { text-decoration: underline; }
    .spot-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; align-items: center; }
    .spot-chip {
      font-size: 12px; color: var(--muted); border: 1px solid var(--line);
      background: #0c0f14; border-radius: 999px; padding: 2.5px 11px;
    }
    .spot-chip b { color: var(--accent-dim); font-weight: 600; }

    /* ── Preset library ───────────────────────────────────────────────── */
    .preset-row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; }
    .preset-info { flex: 1; min-width: 0; cursor: pointer; }
    .preset-info:hover .preset-name { color: var(--accent); }
    .preset-name-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .preset-name { font-size: 15px; font-weight: 700; }
    .preset-name-row input { width: 230px; padding: 5px 9px; font-size: 14px; font-weight: 700; }
    .chip-default {
      font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
      color: var(--gold); border: 1px solid #4a4126; background: #f4c43010; border-radius: 999px; padding: 1.5px 9px;
    }
    .preset-sum { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .sum-chip {
      font-size: 11.5px; color: var(--muted); border: 1px solid var(--line);
      background: #0c0f14; border-radius: 999px; padding: 1.5px 10px;
    }
    .preset-used { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .preset-used b { color: var(--accent-dim); font-weight: 600; }
    .preset-actions { display: flex; gap: 7px; flex: none; }
    .star-btn { color: var(--muted); font-size: 16px; }
    .star-btn.on { color: var(--gold); border-color: #4a4126; }
    .preset-title-input {
      width: auto; min-width: 200px; max-width: 420px;
      font-size: 19px; font-weight: 700; letter-spacing: -.3px;
      background: transparent; border: 1px solid transparent; border-radius: 7px;
      padding: 4px 9px; margin-left: -9px; color: var(--ink);
    }
    .preset-title-input:hover { border-color: var(--line); background: var(--panel); }
    .preset-title-input:focus { border-color: var(--accent); background: var(--panel-2); }

    /* ── Profile settings ─────────────────────────────────────────────── */
    .spot-edit-list { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
    .spot-edit-chip {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13px; color: var(--muted); border: 1px solid var(--line);
      background: #0c0f14; border-radius: 999px; padding: 4px 6px 4px 13px;
    }
    .spot-edit-chip b { color: var(--accent-dim); font-weight: 600; }
    .chip-x {
      width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--panel-2);
      color: var(--muted); font-size: 10px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .chip-x:hover { background: #52242a; color: #ffb4ba; }
    .spot-add { display: flex; gap: 8px; max-width: 420px; }
    .backup-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    #backup-blob { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; min-height: 72px; resize: vertical; }

    /* ── One-off link view ────────────────────────────────────────────── */
    .source-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .src-btn { border: 0; border-radius: 0; background: var(--panel-2); color: var(--muted); font-weight: 600; padding: 8px 16px; }
    .src-btn + .src-btn { border-left: 1px solid var(--line); }
    .src-btn.active { background: var(--accent); color: #08121c; }
    .status-dot { font-size: 13px; margin-top: 4px; min-height: 18px; }
    .status-dot.ok { color: var(--ok); }
    .status-dot.bad { color: var(--bad); }
    .status-dot.checking { color: var(--muted); }
    ol.obs { padding-left: 20px; margin: 0; }
    ol.obs li { margin-bottom: 8px; }
    code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }

    /* ── Toast + modal ────────────────────────────────────────────────── */
    #toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: var(--panel-3); border: 1px solid var(--line); color: var(--ink);
      border-radius: 999px; padding: 9px 20px; font-size: 14px; font-weight: 600;
      box-shadow: 0 10px 30px #000a; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 90;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast .ok { color: var(--ok); margin-right: 6px; }
    #modal-scrim {
      position: fixed; inset: 0; background: #0009; backdrop-filter: blur(2px);
      display: none; align-items: center; justify-content: center; z-index: 80;
    }
    #modal-scrim.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      width: 460px; max-width: calc(100vw - 40px); padding: 20px 22px; box-shadow: 0 20px 60px #000c;
    }
    .modal h3 { margin: 0 0 8px; font-size: 16px; }
    .modal p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
    .modal p b { color: var(--warn); }
    .modal .m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn.danger-solid { background: #52242a; border-color: #7c3540; color: #ffb4ba; }
    .btn.danger-solid:hover { background: #6b2d35; }
    /* The outline destructive: offers the action, doesn't confirm it. The
       modal's danger-solid is the button that actually deletes. */
    .btn.destructive { background: transparent; border-color: #4a262c; color: #d9737c; }
    .btn.destructive:hover { background: #52242a; border-color: #7c3540; color: #ffb4ba; }
    .cfg-danger {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line);
    }
    .cfg-danger .hint { margin: 0; flex: 1; min-width: 220px; }

    @media (max-width: 860px) {
      .shell { flex-direction: column; gap: 12px; padding: 18px 16px 48px; }
      .side { width: auto; position: static; display: flex; flex-wrap: wrap; gap: 4px; }
      .side hr, .side .side-note { display: none; }
      .nav-item { width: auto; border-left: 0; border-radius: 8px; }
    }
  </style>
</head>
<body>

<header class="top">
  <div class="brand">

<div class="shell">

  </nav>
  <main id="main"></main>
</div>

<div id="toast"></div>
<div id="modal-scrim"><div class="modal" id="modal"></div></div>

<script type="module">
  import { extractSlug, buildOverlayQuery } from './src/configurator.js';
  import { mountManualEditor } from './src/manual-editor.js';
  import { decodeLineup } from './src/lineup-codec.js';
  import { instantToZonedWallClock, snapDuration } from './src/manual-lineup.js';
  import { parseStreamers, serializeStreamers, addStreamers, removeStreamer, listStreamers } from './src/streamers.js';
  import { loadEvent, normalizeUser } from './src/raidpal-client.js';
  import { parseConfig } from './src/config.js';
  import { createPreviewFrame } from './src/preview-frame.js';
  import { resolveLocale, loadMessages, makeT } from './src/i18n/index.js';
  import { localizeDom } from './src/i18n/dom.js';
  import {
    parsePresetLibrary, serializePresetLibrary, createPreset, duplicatePreset, renamePreset,
    updatePresetSettings, deletePreset, getPreset, listPresets,
  } from './src/preset-library.js';
  import {
    parseProfiles, serializeProfiles, addProfile, removeProfile, setActiveProfile, listProfiles,
    activeProfile, setDefaultPreset, addSpotlight, removeSpotlight, upsertTrainConfig, getTrainConfig, deleteTrainConfig,
    resolveTrainSettings, countPresetReferences, materializePreset, liveLinkPrefs, setLiveLinkPrefs,
  } from './src/profiles.js';
  import { loadMyRaidTrains, loadEventDetails, refreshEventDetail, userCacheKey } from './src/my-raid-trains.js';
  import { buildLiveLink, baseSettings } from './src/live-link-url.js';
  import {
    SETTINGS_DEFAULTS, SETTING_FIELDS, THEME_OPTION_KEYS, applySettings, diffSettings, normalizeSettings,
  } from './src/settings-schema.js';
  import { mountSettingsForm } from './src/settings-form.js';
  import { classifyTrains, trainCardHtml, whenLabel } from './src/train-list.js';
  import { encodeBackup, decodeBackup } from './src/backup.js';

  // Sibling Overlay URL, derived from where THIS page lives — works under
  // `python3 -m http.server` locally and on a GitHub Pages subpath alike.
  const OVERLAY_BASE = new URL('overlay.html', window.location.href).href;
  // The built-in demo lineup: previewed with no RaidPal fetch, so it never 404s.
  const DEMO_EVENT = 'demo';

  const LIBRARY_KEY = 'raidtrainoverlay.configurator.presets.v2';
  const PROFILES_KEY = 'raidtrainoverlay.configurator.profiles.v1';
  const STREAMERS_KEY = 'raidtrainoverlay.configurator.streamers';

  // The idle card's horizons, in the `upcoming=` grammar the Overlay parses,
  // each pointing at its catalog key rather than an English label.
  const HORIZON_KEYS = {
    '3': 'configurator.horizon3', '5': 'configurator.horizon5', '2w': 'configurator.horizon2w',
    '1m': 'configurator.horizon1m', 'all': 'configurator.horizonAll',
  };

  const ICONS = {
    pencil: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.7l2 2L5.4 12.6l-2.9.9.9-2.9z"/><path d="m9.9 4.1 2 2"/></svg>',
    copy: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.2"/><path d="M10.5 3.5v-.4a1 1 0 0 0-1-1H3.6a1 1 0 0 0-1 1v5.8a1 1 0 0 0 1 1h.4"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11"/><path d="M5.5 4.5V3.2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.3"/><path d="m4.3 4.5.6 8.6a1 1 0 0 0 1 .9h4.2a1 1 0 0 0 1-.9l.6-8.6"/><path d="M6.7 7.3v3.9M9.3 7.3v3.9"/></svg>',
  };

  // The bound translator. start() replaces this before the first render, so the
  // stub only ever covers the module's own evaluation; every string on the page
  // — this file's views, the settings form, the train cards, the Build-by-hand
  // editor — resolves through it.
  let t = (key) => key;
  // The resolved locale, handed to Intl so dates and clock times in the train
  // list read the same way as the words around them. undefined = the browser's.
  let pageLocale;

  const $ = (sel, root) => (root ?? document).querySelector(sel);
  const $$ = (sel, root) => [...(root ?? document).querySelectorAll(sel)];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /** t() for a string that lands in HTML as text or in an attribute. */
  const te = (key, params) => esc(t(key, params));
  /**
   * A Theme's display name in the current locale. An unregistered theme (a
   * hand-edited backup blob, a Theme retired since the Preset was saved) has no
   * key, so it renders as its stored value — NOT through t(), which would treat
   * the value as a message key and could resolve it to an unrelated string.
   */
  const themeLabel = (theme) => (THEME_OPTION_KEYS[theme] ? t(THEME_OPTION_KEYS[theme]) : String(theme));
  /**
   * Two-form plural: a locale gets its own singular and plural strings rather
   * than English's "s" glued on in code, which is wrong in most of the eleven
   * languages here. Not full CLDR plural categories — a machine-translated
   * draft can't be trusted with six Lithuanian forms — but honest for one/many.
   */
  const plural = (n, oneKey, otherKey, params) => t(n === 1 ? oneKey : otherKey, { n, ...params });

  // ── Stores (localStorage adapters around the pure modules) ─────────────
  let library = parsePresetLibrary(localStorage.getItem(LIBRARY_KEY));
  let profiles = parseProfiles(localStorage.getItem(PROFILES_KEY));
  let streamers = parseStreamers(localStorage.getItem(STREAMERS_KEY));
  const saveLibrary = () => localStorage.setItem(LIBRARY_KEY, serializePresetLibrary(library));
  const saveProfiles = () => localStorage.setItem(PROFILES_KEY, serializeProfiles(profiles));
  const saveStreamers = () => localStorage.setItem(STREAMERS_KEY, serializeStreamers(streamers));

  const state = {
    view: 'trains',        // trains | presets | profile | oneoff
    editing: null,         // Event slug — the Raid Train Config editor is open
    editingPreset: null,   // Preset id — the Preset editor is open
    renaming: null,        // Preset id in inline rename (library rows)
    pastOpen: false,
    // My Raid Trains data for the ACTIVE Profile.
    feed: { status: 'idle', events: [], details: {}, error: null, login: null },
  };

  const me = () => activeProfile(profiles);
  const myProfile = () => (me() ? profiles.profiles[me()] : null);

  // ── Toast + modal ──────────────────────────────────────────────────────
  let toastTimer = null;
  function toast(message) {
    const el = $('#toast');
    el.innerHTML = `<span class="ok">✓</span>${esc(message)}`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }
  async function copyText(text, message) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Non-secure contexts (plain http://) have no clipboard API — fall back
      // to selecting a scratch input so the copy still works locally.
      const scratch = document.createElement('input');
      scratch.value = text;
      document.body.appendChild(scratch);
      scratch.select();
      document.execCommand('copy');
      scratch.remove();
    }
    toast(message);
  }
  const openModal = (html) => { $('#modal').innerHTML = html; $('#modal-scrim').classList.add('open'); };
  const closeModal = () => $('#modal-scrim').classList.remove('open');

  // ── Preset helpers ─────────────────────────────────────────────────────
  /** The Preset a Raid Train Config resolves to: its own, else the Profile default. */
  function presetFor(config) {
    return getPreset(library, config?.presetId ?? myProfile()?.defaultPresetId ?? null);
  }
  /** A Profile always needs SOMETHING to start from — seed a default Preset on first use. */
  function ensureStarterPreset(login) {
    if (myProfile()?.defaultPresetId && getPreset(library, myProfile().defaultPresetId)) return;
    const existing = listPresets(library);
    const id = existing.length > 0
      ? existing[0].id
      : (() => { const made = createPreset(library, t('configurator.starterPresetName'), SETTINGS_DEFAULTS); library = made.library; saveLibrary(); return made.id; })();
    profiles = setDefaultPreset(profiles, login, id);
    saveProfiles();
  }
  /** Settings + Spotlights for a train, defaulting to the Profile's base for an unconfigured one. */
  function trainSettings(slug) {
    const login = me();
    if (!login) return { settings: normalizeSettings({}), spotlight: [] };
    const config = getTrainConfig(profiles, login, slug);
    if (config) {
      const resolved = resolveTrainSettings(library, profiles, login, slug);
      return { settings: normalizeSettings(resolved.settings), spotlight: resolved.spotlight };
    }
    return { settings: baseSettings(library, profiles, login), spotlight: [...(myProfile()?.spotlight ?? [])] };
  }
  /** The copyable Overlay URL pinned to ONE train. */
  function trainOverlayUrl(slug) {
    const { settings, spotlight } = trainSettings(slug);
    const query = buildOverlayQuery({ ...settings, event: slug, spotlight: spotlight.join(',') });
    return `${OVERLAY_BASE}?${query}`;
  }
  /**
   * The feed's events, but ONLY when this read is trustworthy — a fresh
   * `ready` with no error and nothing served from a stale cache. Everything
   * downstream treats these as positive evidence about when trains end (#31),
   * so a doubtful read must contribute none.
   */
  function goodFeedEvents() {
    const f = state.feed;
    return f.status === 'ready' && !f.stale && !f.error ? f.events : null;
  }
  /**
   * …and whether that read actually reached RaidPal (#39). `goodFeedEvents`
   * cannot tell: `loadMyRaidTrains` serves a cache hit inside its 6h window
   * with no error and no stale flag, so a feed can look perfectly healthy and
   * still be a six-hour-old snapshot nobody re-checked. That is fine for an end
   * time — a recorded fact — but absence from it is an inference, and pruning a
   * train's overrides on a stale inference is silent data loss.
   */
  const feedVerified = () => goodFeedEvents() != null && state.feed.fromCache === false;
  /** When the feed says this train ends, as epoch ms — only from a good read. */
  function feedEndsAt(slug) {
    const event = (goodFeedEvents() ?? []).find((e) => e.slug === slug);
    return event ? event.endtime.getTime() : null;
  }
  /** The Live Link plus its size verdict (#33) and its train coverage (#31). */
  const liveLink = () => {
    const link = buildLiveLink(library, profiles, me(), {
      now: Date.now(), events: goodFeedEvents(), verified: feedVerified(),
    });
    return { ...link, url: link.query ? `${OVERLAY_BASE}?${link.query}` : '' };
  };
  const liveLinkUrl = () => liveLink().url;

  // ── My Raid Trains feed ────────────────────────────────────────────────
  /**
   * Load the active Profile's trains: the user record first (cache-first, ~6h),
   * then each Event's detail SEQUENTIALLY, repainting cards as they settle. A
   * failed read serves the stale cache and says so — it is never "you left the
   * train".
   */
  /** The last-good user record for a login, straight from my-raid-trains' cache, or null. */
  function cachedUser(login) {
    try {
      const raw = localStorage.getItem(userCacheKey(login));
      if (raw == null) return null;
      const entry = JSON.parse(raw);
      return entry?.payload ? normalizeUser(entry.payload) : null;
    } catch {
      return null;
    }
  }

  async function loadFeed({ force = false } = {}) {
    const login = me();
    if (!login) { state.feed = { status: 'idle', events: [], details: {}, error: null, login: null }; return; }
    state.feed = { status: 'loading', events: [], details: {}, error: null, login };
    renderMain();
    try {
      const result = await loadMyRaidTrains(login, { fetchImpl: fetch.bind(window), storage: localStorage, force });
      if (me() !== login) return; // the Profile switched while we were away
      if (result.notFound) {
        // "No such user" is a 204 — but the undocumented API also answers a bad
        // moment (an HTML error page, a truncated body) with something that isn't
        // `{ user: … }`, which reads here as the same thing. my-raid-trains keeps the
        // last-good cache for exactly this reason, so serve it: a streamer with 13
        // trains must never be told they have no profile because one read went odd.
        const cached = cachedUser(login);
        state.feed = cached
          ? { ...state.feed, status: 'ready', events: cached.events, stale: 'notfound' }
          : { ...state.feed, status: 'notfound' };
        renderMain();
        return;
      }
      // `fromCache` rides along so the Live Link can tell a verified read from a
      // cache hit (#39). This is the ONLY assignment that sets it: loadFeed
      // rebuilds state.feed from scratch on entry, so a later `...state.feed`
      // spread can only ever carry THIS call's value — and the notFound/error
      // paths that do spread it are already excluded by goodFeedEvents()
      // returning null, which feedVerified() requires first.
      state.feed = {
        ...state.feed, status: 'ready', events: result.user.events,
        error: result.error ?? null, fromCache: result.fromCache === true,
      };
      renderMain();
      await loadEventDetails(result.user.events, {
        fetchImpl: fetch.bind(window),
        storage: localStorage,
        onDetail: (detail) => {
          if (me() !== login) return;
          state.feed.details[detail.slug] = detail;
          paintCard(detail.slug);
        },
      });
    } catch (error) {
      if (me() !== login) return;
      state.feed = { ...state.feed, status: 'error', error };
      renderMain();
    }
  }

  /** An Event detail → the `{ slots, filled }` the card's mini-train draws. */
  function detailCounts(slug) {
    const entry = state.feed.details[slug];
    if (!entry?.event) return null;
    const slots = entry.event.slots.length;
    return { slots, filled: entry.event.slots.filter((s) => s.occupied).length };
  }

  function cardView(event, status, now) {
    const config = me() ? getTrainConfig(profiles, me(), event.slug) : null;
    const preset = config ? presetFor(config) : null;
    // Count what the editor would show, not the raw stored keys: a Config that has
    // been materialized carries all fifteen fields, most of which no longer differ
    // from its base. Counting raw keys had the card saying "+15" over an editor
    // saying "Reset 1 override".
    const base = normalizeSettings(preset?.settings ?? {});
    const liveOverrides = config ? diffSettings(base, applySettings(base, config.overrides)) : {};
    return {
      event,
      status,
      when: whenLabel(event, now, pageLocale, t),
      detail: detailCounts(event.slug),
      error: state.feed.details[event.slug]?.error ?? null,
      config: config
        ? { presetName: preset?.name ?? t('configurator.customPreset'), overrideCount: Object.keys(liveOverrides).length }
        : null,
    };
  }

  /** Repaint ONE card in place — the progressive detail loads must not rebuild the view. */
  function paintCard(slug) {
    const existing = $(`.event-card[data-slug="${CSS.escape(slug)}"]`);
    const event = state.feed.events.find((e) => e.slug === slug);
    if (!existing || !event) return;
    const now = Date.now();
    const { live, upcoming } = classifyTrains([event], now);
    const status = live.length ? 'live' : upcoming.length ? 'upcoming' : 'past';
    existing.outerHTML = trainCardHtml(cardView(event, status, now), t);
  }

  // ── Views ──────────────────────────────────────────────────────────────
  function renderTopbar() {
    const login = me();
    $('#pb-avatar').textContent = login ? login[0].toUpperCase() : '+';
    $('#pb-name').textContent = login ?? t('configurator.addProfile');
    const rows = listProfiles(profiles).map((name) => {
      const p = profiles.profiles[name];
      const trains = Object.keys(p.trains ?? {}).length;
      return `<button type="button" class="profile-item" data-act="switch-profile" data-name="${esc(name)}">
        <span class="avatar">${esc(name[0].toUpperCase())}</span>
        <span><span class="p-name">${esc(name)}</span>
          <span class="p-sub">${esc(plural(trains, 'configurator.profileConfigsOne', 'configurator.profileConfigsMany'))}</span></span>
        ${name === login ? '<span class="p-check">✓</span>' : ''}
      </button>`;
    }).join('');
    const manage = login

  function renderSidebar() {
    $('#nc-trains').textContent = state.feed.status === 'ready' ? String(state.feed.events.length) : '';

        || (nav === 'profile' && state.view === 'profile')

  // ── View: My Raid Trains ───────────────────────────────────────────────
  function liveLinkCardHtml() {
    const prefs = liveLinkPrefs(profiles, me());
    const on = prefs.upcoming != null;
    const base = getPreset(library, myProfile()?.defaultPresetId ?? null);
    const options = Object.entries(HORIZON_KEYS)
      .map(([k, key]) => `<option value="${k}"${(prefs.upcoming ?? '3') === k ? ' selected' : ''}>${te(key)}</option>`)
      .join('');
    const link = liveLink();
    // The blob is over the cap the Overlay decodes against, so this URL's
    // per-train settings are already unreadable (#33). Say so here — it is the
    // only place the streamer can act on it, and the alternative is finding
    // out on stream.
    const tooBig = link.oversize
      ? `<div class="ll-note bad"><span class="w" aria-hidden="true">⚠</span><span>${te('configurator.llTooBig', {

      return `${head}<section class="card"><h2 class="card-h">${te('configurator.raidpalUnreachable')}</h2>
        <div class="hint">${esc(state.feed.error?.message ?? t('configurator.requestFailed'))} ${te('configurator.settingsSafe')}
        <button type="button" class="btn sm" data-act="refresh-all">${te('configurator.retry')}</button></div></section>`;
    }
    const now = Date.now();
    const { live, upcoming, past } = classifyTrains(state.feed.events, now);
    const staleNote = state.feed.stale === 'notfound'
      ? t('configurator.staleNotFound', { login: `<b>${esc(me())}</b>` })
      : state.feed.error ? t('configurator.staleError') : '';

      ? `<div class="hint" style="margin:-6px 0 12px">${staleNote}
           <button type="button" class="btn sm" data-act="refresh-all" style="margin-left:6px">${te('configurator.tryAgain')}</button></div>`
      : '';

      ? `<div class="empty">${te('configurator.noTrains')}</div>` : '';

      : '';
    return `${head}${stale}${cards}${emptyNote}${ended}`;
  }

  // ── View: Preset Library + Preset editor ───────────────────────────────
  function presetSummaryHtml(settings) {
    const s = normalizeSettings(settings);
    const bits = [
      themeLabel(s.theme),
      t(s.mode === 'pass' ? 'configurator.sumPass' : 'configurator.sumMarquee'),
      t('configurator.sumSize', { v: s.scale }),
    ];
    if (s.height !== '100') bits.push(t('configurator.sumHeight', { v: s.height }));
    const extra = SETTING_FIELDS.filter((def) => !['theme', 'mode', 'scale', 'height'].includes(def.key)
      && String(s[def.key]) !== String(SETTINGS_DEFAULTS[def.key])).length;
    if (extra) bits.push(t('configurator.sumMore', { n: extra }));
    return bits.map((b) => `<span class="sum-chip">${esc(b)}</span>`).join('');
  }

  let preview = null;
  let settingsForm = null;
  let pendingImport = null;

  function renderMain() {
    // Every view is rebuilt wholesale, so the controllers bound to the old DOM
    // go with it — drop the references or they'd write into a detached tree.
    preview = null;
    settingsForm = null;
    manualEditor = null;
    const main = $('#main');
    if (state.editing) main.innerHTML = configEditorHtml();
    else if (state.editingPreset) main.innerHTML = presetEditorHtml();
    else if (state.view === 'presets') main.innerHTML = presetsViewHtml();
    else if (state.view === 'profile') main.innerHTML = profileViewHtml();
    else if (state.view === 'oneoff') main.innerHTML = oneOffViewHtml();
    else main.innerHTML = trainsViewHtml();
    renderSidebar();
    wireView();
  }

  function render(opts = {}) {
    renderTopbar();
    renderMain();
    if (opts.flashLiveLink) {
      const card = $('#live-link-card');
      if (card) {
        card.classList.add('flash');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => card.classList.remove('flash'), 1200);
      }
    }
  }

  /** Wire the pieces that only exist inside the view just rendered. */
  function wireView() {
    const rename = $('#rename-input');
    if (rename) { rename.focus(); rename.select(); }
    if (state.editing) wireConfigEditor();
    else if (state.editingPreset) wirePresetEditor();
    else if (state.view === 'oneoff') wireOneOff();
  }

  function mountPreview() {
    const iframe = $('#preview');
    if (!iframe) return null;
    return createPreviewFrame({
      iframe, rollBtn: $('#preview-roll'), stillBtn: $('#preview-still'),
      overlayBase: OVERLAY_BASE, t: (k, p) => t(k, p),
    });
  }
  function previewCaption(settings) {
    const caption = $('#preview-caption');
    if (!caption) return;
    const s = normalizeSettings(settings);
    caption.textContent = s.mode === 'pass'
      ? t('configurator.captionPass', { mins: parseConfig(`interval=${encodeURIComponent(s.interval)}`).interval })
      : t('configurator.captionMarquee');
  }

  // ── Wiring: Raid Train Config editor ───────────────────────────────────
  function wireConfigEditor() {
    const slug = state.editing;
    const login = me();
    preview = mountPreview();

    const basisFor = (config) => normalizeSettings(getPreset(library, config.presetId ?? myProfile()?.defaultPresetId ?? null)?.settings ?? {});
    /**
     * The stored Config, with its overrides re-diffed against the CURRENT base.
     * A Config can arrive carrying fields that no longer differ — materializing
     * a deleted Preset bakes in all fifteen — and a field that matches the base
     * is not an override. Normalizing on read keeps the badges, the group tags
     * and the "Reset N overrides" count telling the same story.
     */
    const readConfig = () => {
      const stored = getTrainConfig(profiles, login, slug)
        ?? { presetId: myProfile()?.defaultPresetId ?? null, overrides: {}, spotlight: [] };
      const base = basisFor(stored);
      return { ...stored, overrides: diffSettings(base, applySettings(base, stored.overrides)) };
    };

    function persist(config) {
      // Stamp when this Event ends while we can still see it in a good read.
      // Once it leaves the feed the store is the only thing that remembers,
      // and that memory is what lets the Live Link drop it on positive
      // evidence rather than on absence (#31).
      profiles = upsertTrainConfig(profiles, login, slug, {
        ...config, endsAt: feedEndsAt(slug) ?? config.endsAt ?? null,
      });
      saveProfiles();
      refreshEditorChrome();
    }
    function refreshEditorChrome() {
      const config = readConfig();
      const count = Object.keys(config.overrides ?? {}).length;
      const reset = $('.reset-all');
      if (reset) {
        reset.hidden = count === 0;
        reset.textContent = resetOverridesLabel(count);
      }
      const url = $('#cfg-url');
      if (url) url.value = trainOverlayUrl(slug);
      // The chip on the train's card carries the override count. An auto-prune
      // (#31) removes the record entirely, so without this the stale "+0"
      // artifact just persists in the DOM. No-ops when the card isn't mounted.
      paintCard(slug);
      const { settings, spotlight } = trainSettings(slug);
      previewCaption(settings);
      preview?.render(buildOverlayQuery({ ...settings, event: slug, spotlight: spotlight.join(',') }), slug);
    }

    settingsForm = mountSettingsForm({
      root: $('#settings-root'),
      prefix: 'cfg',
      t: (k, p) => t(k, p),
      getState: () => {
        const config = readConfig();
        const base = basisFor(config);
        return { values: applySettings(base, config.overrides), base };
      },
      onChange: (key, value) => {
        const config = readConfig();
        const base = basisFor(config);
        const next = applySettings(base, { ...config.overrides, [key]: value });
        persist({ ...config, overrides: diffSettings(base, next) });
      },
      onRevert: (key) => {
        const config = readConfig();
        const overrides = { ...config.overrides };
        delete overrides[key];
        persist({ ...config, overrides });
      },
    });

    $('#cfg-preset')?.addEventListener('change', (e) => {
      // Switching Preset must not change what's on stream: re-diff the SAME
      // effective settings against the new base, so a train pinned to tron
      // stays on tron — and an override the new Preset already satisfies
      // quietly stops being an override.
      const config = readConfig();
      const effective = applySettings(basisFor(config), config.overrides);
      const next = { ...config, presetId: e.target.value || null };
      persist({ ...next, overrides: diffSettings(basisFor(next), effective) });
      settingsForm.sync();
    });
    $('#cfg-spotlight')?.addEventListener('input', (e) => {
      const names = e.target.value.split(',').map((n) => n.trim()).filter(Boolean);
      persist({ ...readConfig(), spotlight: names });
    });

    refreshEditorChrome();
  }

  // ── Wiring: Preset editor ──────────────────────────────────────────────
  function wirePresetEditor() {
    const id = state.editingPreset;
    preview = mountPreview();
    const settingsOf = () => normalizeSettings(getPreset(library, id)?.settings ?? {});
    function refreshChrome() {
      const settings = settingsOf();
      previewCaption(settings);
      preview?.render(buildOverlayQuery({ ...settings, event: DEMO_EVENT }), DEMO_EVENT);
    }
    settingsForm = mountSettingsForm({
      root: $('#settings-root'),
      prefix: 'pst',
      t: (k, p) => t(k, p),
      getState: () => ({ values: settingsOf(), base: null }),
      onChange: (key, value) => {
        library = updatePresetSettings(library, id, { ...settingsOf(), [key]: value });
        saveLibrary();
        refreshChrome();
      },
    });
    refreshChrome();
  }

  // ── Wiring: One-off link ───────────────────────────────────────────────
  function harvestStreamers() {
    if (oneOff.source !== 'manual') return;
    const handles = oneOff.manual.djs.map((d) => (d.handle || '').trim()).filter(Boolean);
    if (handles.length === 0) return;
    streamers = addStreamers(streamers, handles);
    saveStreamers();
    manualEditor?.refresh();
  }

  function wireOneOff() {
    preview = mountPreview();
    settingsForm = mountSettingsForm({
      root: $('#settings-root'),
      prefix: 'one',
      t: (k, p) => t(k, p),
      getState: () => ({ values: oneOff.settings, base: null }),
      onChange: (key, value) => { oneOff.settings = normalizeSettings({ ...oneOff.settings, [key]: value }); refreshOneOff(); },
    });

    const setSource = (next) => {
      oneOff.source = next;
      $('#src-raidpal').classList.toggle('active', next === 'raidpal');
      $('#src-manual').classList.toggle('active', next === 'manual');
      $('#src-raidpal').setAttribute('aria-pressed', String(next === 'raidpal'));
      $('#src-manual').setAttribute('aria-pressed', String(next === 'manual'));
      $('#raidpal-source').hidden = next !== 'raidpal';
      $('#manual-source').hidden = next !== 'manual';
      if (next === 'manual' && !manualEditor) {
        manualEditor = mountManualEditor({
          root: $('#manual-source'), state: oneOff.manual, onChange: refreshOneOff, t: (k, p) => t(k, p),
          getStreamers: () => listStreamers(streamers),
          onForgetStreamer: (h) => { streamers = removeStreamer(streamers, h); saveStreamers(); },
          onAddStreamer: (h) => { streamers = addStreamers(streamers, [h]); saveStreamers(); },
        });
      }
      refreshOneOff();
    };
    $('#src-raidpal').addEventListener('click', () => setSource('raidpal'));
    $('#src-manual').addEventListener('click', () => setSource('manual'));
    $('#f-event').addEventListener('input', (e) => { oneOff.event = e.target.value; refreshOneOff(); });
    $('#one-spotlight').addEventListener('input', (e) => { oneOff.spotlight = e.target.value; refreshOneOff(); });
    $('#f-event').addEventListener('blur', () => {
      const slug = extractSlug(oneOff.event);
      if (slug && slug !== oneOff.event.trim()) { oneOff.event = slug; $('#f-event').value = slug; refreshOneOff(); }
    });
    if (oneOff.source === 'manual' && !manualEditor) setSource('manual');
    else refreshOneOff();
  }

  // Re-validate a slug against RaidPal only when it CHANGES; every other tweak
  // just re-renders the preview in place — no refetch on a theme change.
  let validatedSlug = null;
  let validateToken = 0;
  let oneOffTimer = null;
  function refreshOneOff() {
    const formState = { source: oneOff.source, event: oneOff.event, manual: oneOff.manual, ...oneOff.settings, spotlight: oneOff.spotlight };
    const query = buildOverlayQuery(formState);
    const params = new URLSearchParams(query);
    const urlBox = $('#oneoff-url');
    const copyBtn = $('[data-act="copy-oneoff"]');
    const hasSource = params.has('event') || params.has('lineup');
    if (urlBox) { urlBox.value = hasSource ? `${OVERLAY_BASE}?${query}` : ''; }
    if (copyBtn) copyBtn.disabled = !hasSource;
    previewCaption(oneOff.settings);

    clearTimeout(oneOffTimer);
    oneOffTimer = setTimeout(async () => {
      const status = $('#slug-status');
      if (oneOff.source === 'manual') {
        if (status) { status.textContent = ''; status.className = 'status-dot'; }
        if (oneOff.manual.djs.some((d) => (d.handle || '').trim())) {
          preview?.render(query, params.get('lineup'));
        }
        return;
      }
      const slug = extractSlug(oneOff.event);
      if (!slug) {
        // Empty field → preview the built-in demo so the page is never blank, while
        // the copy URL stays empty (the demo must never leak into a copied link).
        if (status) { status.textContent = t('configurator.slugDemo'); status.className = 'status-dot ok'; }
        preview?.render(buildOverlayQuery({ ...formState, event: DEMO_EVENT }), DEMO_EVENT);
        return;
      }
      if (slug === DEMO_EVENT || slug === validatedSlug) {
        if (status) { status.textContent = t('configurator.slugFound', { slug }); status.className = 'status-dot ok'; }
        preview?.render(query, slug);
        return;
      }
      if (status) { status.textContent = t('configurator.slugChecking'); status.className = 'status-dot checking'; }
      const token = ++validateToken;
      try {
        await loadEvent(slug);
        if (token !== validateToken) return;
        validatedSlug = slug;
        if (status) { status.textContent = t('configurator.slugFound', { slug }); status.className = 'status-dot ok'; }
        preview?.render(query, slug);
      } catch {
        if (token !== validateToken) return;
        validatedSlug = null;
        if (status) { status.textContent = t('configurator.slugNotFound', { slug }); status.className = 'status-dot bad'; }
        preview?.reset();
      }
    }, 350);
  }

  // ── Navigation ─────────────────────────────────────────────────────────
  function go(view, opts = {}) {
    state.view = view;
    state.editing = null;
    state.editingPreset = null;
    state.renaming = opts.renaming ?? null;
    render(opts);
  }

  for (const el of $$('.nav-item')) {
    el.addEventListener('click', () => {
      const nav = el.dataset.nav;
      if (nav === 'livelink') { go('trains', { flashLiveLink: true }); return; }
      go(nav);
    });
  }

  // ── Profile menu ───────────────────────────────────────────────────────
  const profileBtn = $('#profile-btn');
  const profileMenu = $('#profile-menu');
  profileBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = profileMenu.classList.toggle('open');
    profileBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (!profileMenu.contains(e.target)) { profileMenu.classList.remove('open'); profileBtn.setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { profileMenu.classList.remove('open'); closeModal(); } });

  /** Add (or switch to) a Profile, seed it a Preset, and load its trains. */
  function useProfile(rawLogin) {
    const login = (rawLogin ?? '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    if (login === '') return;
    profiles = addProfile(profiles, login);
    profiles = setActiveProfile(profiles, login);
    saveProfiles();
    ensureStarterPreset(login);
    state.pastOpen = false;
    go('trains');
    loadFeed();
  }
  $('#profile-add-btn').addEventListener('click', () => {
    useProfile($('#profile-add-input').value);
    $('#profile-add-input').value = '';
    profileMenu.classList.remove('open');
  });
  $('#profile-add-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#profile-add-btn').click(); });
  profileMenu.addEventListener('click', (e) => {
    const item = e.target.closest('[data-act]');
    if (!item) { e.stopPropagation(); return; }
    profileMenu.classList.remove('open');
    if (item.dataset.act === 'switch-profile') { useProfile(item.dataset.name); toast(t('configurator.toastActingAs', { name: item.dataset.name })); }
    if (item.dataset.act === 'manage-profile') go('profile');
  });

  // ── Main-content actions (delegated: the views are re-rendered wholesale) ──
  $('#main').addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'onboard') { useProfile($('#onboard-input').value); return; }
    if (act === 'goto-oneoff') { e.preventDefault(); go('oneoff'); return; }
    if (act === 'goto-presets') { e.preventDefault(); go('presets'); return; }
    if (act === 'goto-profile') { e.preventDefault(); go('profile'); return; }
    if (act === 'back-trains') { go('trains'); return; }
    if (act === 'back-presets') { go('presets'); return; }
    if (act === 'refresh-all') { loadFeed({ force: true }); return; }

    if (act === 'toggle-past') {
      state.pastOpen = !state.pastOpen;
      el.classList.toggle('open', state.pastOpen);
      const list = $('.past-list');
      if (list) list.hidden = !state.pastOpen;
      return;
    }
    if (act === 'refresh-train') {
      el.classList.add('spin');
      const detail = await refreshEventDetail(el.dataset.slug, { fetchImpl: fetch.bind(window), storage: localStorage });
      state.feed.details[detail.slug] = detail;
      paintCard(detail.slug);
      toast(t(detail.error ? 'configurator.toastRefreshFailed' : 'configurator.toastRefreshed'));
      return;
    }
    if (act === 'copy-train-link') { copyText(trainOverlayUrl(el.dataset.slug), t('configurator.toastLinkCopied')); return; }
    if (act === 'open-config') {
      state.editing = el.dataset.slug;
      state.editingPreset = null;
      render();
      return;
    }
    if (act === 'copy-live') {
      const url = liveLinkUrl();
      if (!url) { toast(t('configurator.toastAddProfileFirst')); return; }
      copyText(url, t('configurator.toastLiveLinkCopied'));
      return;
    }
    if (act === 'copy-cfg-url') { copyText($('#cfg-url').value, t('configurator.toastLinkCopied')); return; }
    if (act === 'copy-oneoff') {
      const url = $('#oneoff-url').value;
      if (!url) return;
      copyText(url, t('configurator.toastLinkCopied'));
      harvestStreamers();
      return;
    }
    if (act === 'reset-overrides') {
      const config = getTrainConfig(profiles, me(), state.editing);
      profiles = upsertTrainConfig(profiles, me(), state.editing, { ...config, overrides: {} });
      saveProfiles();
      render();
      toast(t('configurator.toastOverridesReset'));
      return;
    }

    if (act === 'forget-config') {
      const slug = state.editing;
      const config = getTrainConfig(profiles, me(), slug);
      if (!config) return;
      const count = Object.keys(config.overrides ?? {}).length;
      // What it drops TO is the Profile's default Preset, not this Config's own
      // reference — with the record gone, resolveTrainSettings has nothing else
      // to read. No default means normalizeSettings({}): classic theme, pass
      // mode. That is the sharp edge, so the confirm names it outright.
      const preset = getPreset(library, myProfile()?.defaultPresetId ?? null);
      openModal(`<h3>${te('configurator.cfgForgetHead')}</h3>
        <p>${plural(count, 'configurator.cfgForgetCountOne', 'configurator.cfgForgetCountMany', { n: `<b>${count}</b>` })}</p>
        <p>${preset
          ? t('configurator.cfgForgetDropsToPreset', { name: `<b>${esc(preset.name)}</b>` })
          : te('configurator.cfgForgetDropsToDefaults')}</p>
        <p>${te('configurator.cfgForgetLinksNote')}</p>
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-forget" data-slug="${esc(slug)}">${te('configurator.cfgForgetConfirm')}</button>
        </div>`);
      return;
    }

    // ── Preset library ──
    if (act === 'new-preset') {
      const made = createPreset(library, t('configurator.newPresetName'), SETTINGS_DEFAULTS);
      library = made.library;
      saveLibrary();
      go('presets', { renaming: made.id });
      return;
    }
    if (act === 'dup-preset') {
      const made = duplicatePreset(library, el.dataset.id);
      library = made.library;
      saveLibrary();
      go('presets', { renaming: made.id }); // dupe → rename → editor is ONE flow
      return;
    }
    if (act === 'edit-preset') {
      if (e.target.id === 'rename-input') return; // an inline rename is in progress
      state.renaming = null;
      state.editingPreset = el.dataset.id;
      state.editing = null;
      render();
      return;
    }
    if (act === 'make-default' || act === 'make-default-editor') {
      if (!me()) { toast(t('configurator.toastAddProfileFirst')); return; }
      if (!getPreset(library, el.dataset.id)) { render(); return; } // a stale click must never dangle the default
      profiles = setDefaultPreset(profiles, me(), el.dataset.id);
      saveProfiles();
      render();
      toast(t('configurator.toastNowDefault', { name: getPreset(library, el.dataset.id).name }));
      return;
    }
    if (act === 'del-preset') {
      const preset = getPreset(library, el.dataset.id);
      if (!preset) return;
      const { configs, defaults } = countPresetReferences(profiles, el.dataset.id);
      openModal(`<h3>${te('configurator.delPresetHead', { name: preset.name })}</h3>
        ${configs
          ? `<p>${plural(configs, 'configurator.delPresetUsedOne', 'configurator.delPresetUsedMany', { n: `<b>${configs}</b>` })}</p>`
          : `<p>${te('configurator.delPresetUnused')}</p>`}
        ${defaults ? `<p>${plural(defaults, 'configurator.delPresetDefaultOne', 'configurator.delPresetDefaultMany')}</p>` : ''}
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-del" data-id="${esc(el.dataset.id)}">${te('configurator.delPresetConfirm')}</button>
        </div>`);
      return;
    }

    // ── Profile settings ──
    if (act === 'add-spot') {
      const input = $('#spot-input');
      const name = input.value.trim().replace(/,/g, '');
      if (!name) return;
      profiles = addSpotlight(profiles, me(), name);
      saveProfiles();
      render();
      $('#spot-input')?.focus();
      toast(t('configurator.toastSpotlightAdded', { name }));
      return;
    }
    if (act === 'rm-spot') {
      profiles = removeSpotlight(profiles, me(), el.dataset.name);
      saveProfiles();
      render();
      return;
    }
    if (act === 'export-backup') {
      const blob = await encodeBackup({ presets: library, profiles, streamers });
      $('#backup-blob').value = blob;
      copyText(blob, t('configurator.toastBackupCopied'));
      return;
    }
    if (act === 'import-backup') {
      const decoded = await decodeBackup($('#backup-blob').value.trim());
      if (!decoded) { toast(t('configurator.toastBadBackup')); return; }
      openModal(`<h3>${te('configurator.restoreHead')}</h3>
        <p>${t('configurator.restoreCounts', {
          presets: `<b>${Object.keys(decoded.presets).length}</b>`,
          profiles: `<b>${listProfiles(decoded.profiles).length}</b>`,
        })}</p>
        <p>${t('configurator.restoreWarn')}</p>
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-import">${te('configurator.restoreConfirm')}</button>
        </div>`);
      pendingImport = decoded;
      return;
    }
    if (act === 'remove-profile') {
      openModal(`<h3>${te('configurator.removeProfileHead', { login: me() })}</h3>
        <p>${te('configurator.removeProfileBody')}</p>
        <div class="m-actions">
          <button type="button" class="btn" data-mact="cancel">${te('configurator.cancel')}</button>
          <button type="button" class="btn danger-solid" data-mact="confirm-remove-profile">${te('configurator.removeProfileConfirm')}</button>
        </div>`);
      return;
    }
  });

  // Live Link idle-card controls (change events, so they live on their own).
  $('#main').addEventListener('change', (e) => {
    if (e.target.id === 'll-idle-toggle') {
      const horizon = $('#ll-horizon');
      profiles = setLiveLinkPrefs(profiles, me(), { upcoming: e.target.checked ? horizon.value : null });
      saveProfiles();
      horizon.disabled = !e.target.checked;
      $('#ll-url').value = liveLinkUrl();
      toast(t(e.target.checked ? 'configurator.toastIdleOn' : 'configurator.toastIdleOff'));
      return;
    }
    if (e.target.id === 'll-horizon') {
      profiles = setLiveLinkPrefs(profiles, me(), { upcoming: e.target.value });
      saveProfiles();
      $('#ll-url').value = liveLinkUrl();
      toast(t('configurator.toastHorizonUpdated'));
      return;
    }
    if (e.target.id === 'default-preset-select') {
      profiles = setDefaultPreset(profiles, me(), e.target.value || null);
      saveProfiles();
      toast(t('configurator.toastDefaultUpdated'));
    }
  });

  // ── Preset renaming (inline in the library, and the editor's title) ─────
  function commitRename(input) {
    const id = input.dataset.id;
    const name = input.value.trim();
    state.renaming = null;
    if (name && name !== getPreset(library, id)?.name) {
      library = renamePreset(library, id, name);
      saveLibrary();
    }
    // Post-duplicate intent is always "now customize it": any commit drops
    // straight into the new Preset's editor. Escape stays in the library.
    state.editingPreset = id;
    render();
  }
  $('#main').addEventListener('keydown', (e) => {
    if (e.target.id === 'rename-input') {
      if (e.key === 'Enter') commitRename(e.target);
      if (e.key === 'Escape') { state.renaming = null; render(); }
      return;
    }
    if (e.target.id === 'preset-title-input') {
      if (e.key === 'Enter') e.target.blur();
      if (e.key === 'Escape') { e.target.value = getPreset(library, e.target.dataset.id)?.name ?? ''; e.target.blur(); }
      return;
    }
    if (e.target.id === 'spot-input' && e.key === 'Enter') $('[data-act="add-spot"]')?.click();
    if (e.target.id === 'onboard-input' && e.key === 'Enter') $('[data-act="onboard"]')?.click();
  });
  $('#main').addEventListener('focusout', (e) => {
    if (e.target.id === 'rename-input' && state.renaming) commitRename(e.target);
    if (e.target.id === 'preset-title-input') {
      const id = e.target.dataset.id;
      const name = e.target.value.trim();
      const current = getPreset(library, id);
      if (!current || !name || name === current.name) { e.target.value = current?.name ?? ''; return; }
      library = renamePreset(library, id, name);
      saveLibrary();
      toast(t('configurator.toastRenamed', { name }));
      // Patch the label in place rather than re-rendering: an in-flight click on
      // "Make default" must still land on a Preset that exists.
      e.target.value = getPreset(library, id).name;
    }
  });

  // ── Modal actions ──────────────────────────────────────────────────────
  $('#modal-scrim').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) { closeModal(); return; }
    const el = e.target.closest('[data-mact]');
    if (!el) return;
    const act = el.dataset.mact;
    if (act === 'cancel') { closeModal(); pendingImport = null; return; }
    if (act === 'confirm-del') {
      const id = el.dataset.id;
      const name = getPreset(library, id)?.name ?? '';
      // Bake the Preset into every referencing Config FIRST, so nothing dangles
      // and nothing changes on stream — then drop it from the library.
      profiles = materializePreset(profiles, library, id);
      library = deletePreset(library, id);
      saveProfiles();
      saveLibrary();
      closeModal();
      go('presets');
      toast(t('configurator.toastDeleted', { name }));
      return;
    }
    if (act === 'confirm-forget') {
      // Back to the train list, not the editor: the editor would immediately
      // re-synthesize a default Config from readConfig() and the deletion
      // would read as having done nothing.
      profiles = deleteTrainConfig(profiles, me(), el.dataset.slug);
      saveProfiles();
      closeModal();
      state.editing = null;
      go('trains');
      toast(t('configurator.toastConfigForgotten'));
      return;
    }
    if (act === 'confirm-import') {
      if (!pendingImport) { closeModal(); return; }
      library = pendingImport.presets;
      profiles = pendingImport.profiles;
      streamers = pendingImport.streamers;
      pendingImport = null;
      saveLibrary(); saveProfiles(); saveStreamers();
      closeModal();
      go('trains');
      loadFeed();
      toast(t('configurator.toastBackupRestored'));
      return;
    }
    if (act === 'confirm-remove-profile') {
      profiles = removeProfile(profiles, me());
      saveProfiles();
      closeModal();
      go('trains');
      if (me()) loadFeed();
      toast(t('configurator.toastProfileRemoved'));
    }
  });

  // ── Init ───────────────────────────────────────────────────────────────
  // A landing-page door (`?theme=…`, `#manual`) or an old shared Configurator
  // link opens the one-off view, hydrated from the query. Otherwise the
  // Profile's My Raid Trains is home.
  (async function start() {
    // Bind the translator before anything renders — every view goes through it,
    // and an unbound `t` would paint raw message keys.
    const search = window.location.search.replace(/^\?/, '');
    // An explicit ?lang= picks the page's language too; otherwise follow the browser.
    pageLocale = resolveLocale(parseConfig(search).lang, navigator.languages);
    const messages = await loadMessages(pageLocale);
    t = makeT(messages);
    // The header, sidebar and profile menu are authored as static markup, so they
    // localize through data-i18n rather than a template literal. Everything below
    // #main is rendered by render() and already reads through `t`.
    document.documentElement.lang = pageLocale;
    document.title = t('configurator.title');
    localizeDom(document, messages);
    // A query string means "build a one-off link from these params" — EXCEPT
    // `lang`, which selects the page's own language and says nothing about
    // which view to open. Counting it opened the One-off view for `?lang=de`,
    // so the localized My Raid Trains / Preset / Profile views were unreachable
    // by URL at all (a German browser reached them, a German link never did).
    const viewParams = new URLSearchParams(search);
    viewParams.delete('lang');
    const wantsOneOff = [...viewParams.keys()].length > 0 || window.location.hash === '#manual';
    if (wantsOneOff) {
      const config = parseConfig(search);
      const params = new URLSearchParams(search);
      oneOff.event = config.event ?? '';
      oneOff.spotlight = params.get('spotlight') ?? '';   // raw, so the form keeps the typed casing
      oneOff.settings = normalizeSettings({
        theme: config.theme,
        mode: config.mode,
        interval: String(config.interval),
        speed: String(config.speed),
        track: config.track,
        trackfadein: String(config.trackfadein),
        trackfadeout: String(config.trackfadeout),
        scale: String(config.scale),
        height: String(config.height),
        refresh: config.refresh ? String(config.refresh) : '',
        openslots: config.openslots,
        hidefinished: config.hidefinished,
        enginedim: config.enginedim,
        tz: params.get('tz') ?? '',
        lang: config.lang ?? '',
      });
      if (config.lineup) {
        const model = decodeLineup(config.lineup);
        if (model) {
          const durations = (model.d ?? []).map((x) => snapDuration(x.d));
          const gcd = (a, b) => (b ? gcd(b, a % b) : a);
          const base = durations.length ? durations.reduce((g, n) => gcd(g, n), 0) : 60;
          Object.assign(oneOff.manual, {
            title: model.t,
            organiser: model.o?.n ?? '',
            zone: model.z || detectedZone,
            startISO: model.s ? instantToZonedWallClock(model.s, model.z || detectedZone) : freshStartISO(),
            slotMins: base,
            djs: (model.d ?? []).map((x, i) => ({ handle: x.h, slots: Math.max(1, Math.round(durations[i] / base)) })),
          });
          oneOff.source = 'manual';
        }
      }
      if (window.location.hash === '#manual') oneOff.source = 'manual';
      state.view = 'oneoff';
    }
    render();
    if (!wantsOneOff && me()) loadFeed();
  })();
</script>
</body>
</html>
